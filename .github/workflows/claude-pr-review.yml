name: Claude PR review

# An independent reviewer, in a context that did not write the code.
#
# This is a separate workflow rather than another step in claude-agent.yml for
# one reason: an author reviewing their own work re-derives the same
# assumptions. A fresh context reads what is actually in the diff.
#
# It cannot push. `contents: read` is the whole safety argument — this workflow
# has an opinion and no hands.

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

concurrency:
  # Per pull request, and cancellable: a review of an old head is worse than no
  # review, because somebody will read it as current.
  group: attadipa-pr-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions: {}

jobs:
  review:
    name: Independent review
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      pull-requests: write
      issues: write
      # id-token: write is not optional, and the reason is easy to miss.
      #
      # github_token below is ATTADIPA_AGENT_TOKEN, which is deliberately allowed
      # to be empty — see docs/automation/CLAUDE_AUTOMATION.md. When it is, the
      # action authenticates as the Claude GitHub App by exchanging this
      # workflow's GitHub OIDC token for an installation token, and without this
      # permission that exchange fails with "Unable to get
      # ACTIONS_ID_TOKEN_REQUEST_URL". The failure looks like an authentication
      # problem with the Anthropic credential and is not one.
      id-token: write
    # A fork's pull request runs without secrets on a public repository, so
    # there is no credential to review with. That is GitHub's protection, not an
    # oversight, and pull_request_target — which would grant them — is exactly
    # the pattern that leaks tokens to untrusted code.
    #
    # The bot condition names what it excludes, and it is one name.
    #
    # `github.actor` on a `pull_request` event is whoever caused it, which for a
    # `synchronize` is the pusher rather than the author. So the actor set here
    # is not the set of pull-request authors, and a suffix test on it does not
    # mean what it reads as. It used to be
    #
    #   (!endsWith(github.actor, '[bot]') || github.actor == 'claude[bot]')
    #
    # and it excluded `github-actions[bot]` — the actor on every branch our own
    # update sweep pushes. A swept branch's review was skipped, not pending, so
    # the pull request kept its round-1 `ai-review:blocking` label forever and
    # could never converge. #330, the fix for "nothing keeps an open pull
    # request current", was the pull request it happened to: pushed by the
    # automation, and unreviewable because it was pushed by the automation.
    # Somebody closed and reopened it by hand to re-fire the event with a human
    # actor. That is a crank, and it has to be turned again after every sweep.
    #
    # Naming the excluded bot is possible because the set is closed and small.
    # Every pull request this repository has ever had was opened by `hleserg`,
    # `app/claude` or `app/dependabot`, and only the third is unwanted: it opens
    # four dependency bumps at a time and none of them wants an architecture
    # review. `.github/dependabot.yml` is what puts it there. The
    # `head.repo.full_name` clause above is what makes one name enough — a fork
    # actor never reaches this job at all.
    #
    # PAIRED WITH `allowed_bots` BELOW, WHICH IS THE HALF THAT BITES IN SILENCE.
    # The action refuses any Bot actor its list does not name, in about five
    # seconds, before reading a file — and the Review step carries
    # `continue-on-error`, so that refusal reports success. Admitting an actor
    # here without adding it there converts a visible skip into an invisible
    # one. `.github/tests/bot-actor-test.sh` asserts the pair.
    #
    # This does not create a loop. The review's output is a comment and a label;
    # a comment cannot raise a `pull_request` event, and the intake gate rejects
    # claude[bot] comments separately (.github/scripts/intake-decision.sh). The
    # job also holds `contents: read`, so the widest thing it can do is have an
    # opinion twice.
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      vars.CLAUDE_AUTOMATION_ENABLED != 'false' &&
      vars.CLAUDE_PR_REVIEW_ENABLED != 'false' &&
      github.actor != 'dependabot[bot]'
    steps:
      - name: Record review-run start
        id: started
        run: echo "at=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      - name: Drop the previous head's pass before reviewing this one
        # A `synchronize` is a new head, so an `ai-review:pass` on the pull
        # request at this moment was granted to a commit that is no longer the
        # one being merged. `review-invalidate.sh` takes it off too, but only
        # when the run reaches its publish step -- thirteen minutes later on the
        # pull request this was found on. For that whole window the cheapest
        # signal anybody reads first, the label, says "reviewed, passed" about
        # code nothing has read, while only `mergeStateStatus` and a pending
        # check disagree. #339, second observation.
        #
        # Before the credential gate on purpose: a stale pass has to come off
        # even when there is no credential to review the new head with.
        #
        # `ai-review:blocking` is deliberately left alone, for the reason the
        # did-not-run path leaves it alone: a review that has not run yet has
        # said nothing that justifies releasing a hold somebody else put on, and
        # a stale block is the fail-safe direction of being wrong.
        #
        # Not routed through `review-invalidate.sh`: that helper also posts its
        # "published no verdict" note, which is untrue at the start of a run.
        #
        # A re-run of a `synchronize` against a head that already passed strips
        # a label that was valid and the same run re-grants it. Also the
        # fail-safe direction.
        #
        # `--remove-label` on an absent label exits 0, so a failure here is an
        # API failure rather than a missing label. It is a warning because the
        # publish path invalidates again and fails the step if it cannot -- this
        # step makes the invalidation earlier, it does not become the guard.
        if: github.event.action == 'synchronize'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          set -uo pipefail
          gh pr edit "$PR" --repo "$REPO" --remove-label ai-review:pass ||
            echo "::warning::could not remove a previous head's \`ai-review:pass\` from #$PR at the start of this run; the publish step invalidates again"

      - name: Check that an Anthropic credential exists
        id: auth
        env:
          HAS_KEY: ${{ secrets.ANTHROPIC_API_KEY != '' }}
          HAS_OAUTH: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN != '' }}
        run: |
          if [ "$HAS_KEY" = "true" ] || [ "$HAS_OAUTH" = "true" ]; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
          else
            echo "ok=false" >> "$GITHUB_OUTPUT"
            echo "::notice::No Anthropic credential configured; skipping the AI review."
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        if: steps.auth.outputs.ok == 'true'
        with:
          fetch-depth: 0

      # Stage decision scripts and the prompt from the trusted default branch,
      # never from the pull request being reviewed.
      - name: Fetch trusted review inputs
        if: steps.auth.outputs.ok == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          sparse-checkout: |
            .github/scripts
            .github/prompts
          sparse-checkout-cone-mode: false
          persist-credentials: false
          path: .attadipa-bundle

      - name: Stage trusted review inputs
        if: steps.auth.outputs.ok == 'true'
        run: |
          set -euo pipefail
          dest="$RUNNER_TEMP/attadipa-orchestration"
          rm -rf "$dest"
          mkdir -p "$dest"
          cp -R .attadipa-bundle/.github/scripts "$dest/scripts"
          cp -R .attadipa-bundle/.github/prompts "$dest/prompts"
          rm -rf .attadipa-bundle
          test -r "$dest/scripts/failure-reason.sh"
          test -r "$dest/prompts/pr-review.md"
          echo "ATTADIPA_TRUSTED_SCRIPTS=$dest/scripts" >> "$GITHUB_ENV"
          echo "ATTADIPA_TRUSTED_PROMPTS=$dest/prompts" >> "$GITHUB_ENV"

      - name: Load trusted review prompt
        id: review_prompt
        if: steps.auth.outputs.ok == 'true'
        env:
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          {
            echo 'body<<ATTADIPA_REVIEW_PROMPT'
            printf 'Review pull request #%s in %s.\n\n' "$PR" "$REPO"
            cat "$ATTADIPA_TRUSTED_PROMPTS/pr-review.md"
            echo ATTADIPA_REVIEW_PROMPT
          } >> "$GITHUB_OUTPUT"

      - name: Has this review already had its five rounds
        id: cap
        # OD-25 caps the independent review at five rounds. Until now the cap was
        # applied AFTER the model answered: `review-verdict.sh` defers every
        # finding past round five, floor included, and returns `ai-review:pass` —
        # a verdict that was fixed before the round started. #382 paid for three
        # of those, rounds six, seven and eight, none of which could reach any
        # other answer. Five rounds of holding is now also five rounds of
        # reviewing, which is what the owner asked for on 2026-09-01.
        #
        # It sits here, between the staged bundle and the paid step, because that
        # is the only place a skip saves anything. And it fails toward running:
        # no bundle, no ledger, an unreadable round, a `gh` that errors — every
        # one of those leaves `run=yes`. A needless round costs tokens; a round
        # skipped by a parse bug costs the review.
        if: steps.auth.outputs.ok == 'true'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          TRUSTED: ${{ env.ATTADIPA_TRUSTED_SCRIPTS }}
          # THE SAME AUTHOR FILTER AS `Converge the published reviewer verdict`,
          # and for the reason spelled out there: this repository is public, so a
          # ledger query with no author condition reads a comment anyone could
          # have written. The two queries must stay identical. This one decides
          # whether to review at all, which is the cheaper of the two to subvert.
          ATTADIPA_LEDGER_ACTOR: github-actions[bot]
          ATTADIPA_REVIEW_ACTOR: claude[bot]
        run: |
          set -uo pipefail
          run=yes
          open=0
          round=0
          if [ -n "${TRUSTED:-}" ] && [ -r "$TRUSTED/review-verdict.sh" ]; then
            : > /tmp/previous-ledger.md
            ledger_id=$(gh api "repos/$REPO/issues/$PR/comments" --paginate --jq '.[] | select(.user.login == env.ATTADIPA_LEDGER_ACTOR) | select(.body | startswith("<!-- attadipa-review-ledger -->")) | .id' | tail -1) || ledger_id=""
            if [ -n "$ledger_id" ]; then
              gh api "repos/$REPO/issues/comments/$ledger_id" --jq '.body' > /tmp/previous-ledger.md || : > /tmp/previous-ledger.md
            fi
            # THE SECOND COUNT, AND THE REASON THE LEDGER ALONE IS NOT ENOUGH.
            # `Converge the published reviewer verdict` is what advances the
            # ledger's `round=`, and it is skipped whenever `review-published.sh`
            # answers `unknown`. On #382 that happened four times running: the
            # ledger says `round=5`, and the reviewer published findings at
            # 16:08, 16:34, 17:26 and 17:59 after it, every one of them with
            # converge `skipped` and the run green. Nine paid rounds, a ledger
            # that says five. Counting the published blocks measures the thing
            # actually being paid for, and it cannot freeze while rounds run.
            # Same query as converge's `finding_id`, counted rather than
            # `tail -1`-ed -- and counted with `wc`, not with `jq | length`,
            # because `--paginate` runs the filter once per page and a `length`
            # would report the last page instead of the total. A pull request
            # past a hundred comments is exactly the one that gets here.
            paid=$(gh api "repos/$REPO/issues/$PR/comments" --paginate --jq '.[] | select(.user.login == env.ATTADIPA_REVIEW_ACTOR) | select((.body | startswith("<!-- attadipa-review-ledger -->")) | not) | select(.body | contains("<!-- attadipa-review-findings")) | .id' | wc -l | tr -d ' ') || paid=0
            if bash "$TRUSTED/review-verdict.sh" gate /tmp/previous-ledger.md 5 "$paid" > /tmp/gate.txt; then
              [ "$(sed -n 's/^run=//p' /tmp/gate.txt)" = no ] && run=no
              open=$(sed -n 's/^open=//p' /tmp/gate.txt)
              round=$(sed -n 's/^round=//p' /tmp/gate.txt)
            fi
          fi
          echo "run=$run" >> "$GITHUB_OUTPUT"
          [ "$run" = no ] || exit 0
          echo "::notice::#$PR has had its five review rounds (OD-25); round $((round + 1)) was not run."
          # A STANDING BLOCK IS NOT CLEARED BY RE-RUNNING THE WORKFLOW. The
          # invalidation step above strips both labels on `synchronize` only, so
          # after a push there is no label here and the cap hands over the pass
          # round six would have returned. Without a push the round-five
          # `ai-review:blocking` is still on the pull request, and applying a
          # pass over it would let a bare re-run launder a blocking verdict into
          # a merge with no commit in between. Push the fix; the cap clears it.
          blocking=$(gh pr view "$PR" --repo "$REPO" --json labels --jq '.labels[].name' | grep -cx 'ai-review:blocking') || blocking=0
          # One note, not one per trigger. The ledger comment it points at is
          # already on the page with every finding and its status: OD-25 stops
          # the review holding, and now reviewing, but never recording.
          marker='<!-- attadipa-review-cap -->'
          said=$(gh api "repos/$REPO/issues/$PR/comments" --paginate --jq '.[] | select(.user.login == env.ATTADIPA_LEDGER_ACTOR) | select(.body | startswith("<!-- attadipa-review-cap -->")) | .id' | tail -1) || said=""
          # The single quotes are the point: every `backtick` below is markdown
          # for the comment this writes, not a command substitution waiting to
          # expand. Double quotes here would run them.
          # shellcheck disable=SC2016
          {
            printf '%s\n' "$marker"
            if [ "$blocking" -gt 0 ]; then
              printf '**The independent review has had its five rounds (OD-25), and this pull request still carries `ai-review:blocking`.**\n\n'
              printf 'No round will run on it again. That label is from round %s, and only a push clears it: pushing the fix drops the stale verdict, and the cap then hands over `ai-review:pass` without paying for a round whose answer is already fixed. Re-running this workflow will not clear it, on purpose — a re-run with no commit between it and the block would turn a blocking verdict into a merge with nothing changed.\n\n' "$round"
              printf 'Круги ревью исчерпаны (OD-25, пять кругов). `ai-review:blocking` с круга %s снимается только пушем: перезапуск воркфлоу его намеренно не снимает.\n' "$round"
            else
              printf '**The independent review has had its five rounds (OD-25), so this one did not run.**\n\n'
              printf 'Round %s published, and from round six no finding holds a pull request at all — a `floor` finding included. A sixth round could only have returned the verdict this label already carries, so it was not bought.\n\n' "$round"
              printf '`ai-review:pass` here means *the review is over*, not *the review found nothing*: %s open finding(s) remain in the review ledger on this page, and past the ceiling none of them holds a pull request. Read them before merging. One may be `floor` — a finding that *did* hold this pull request up to round five, whose fix, if it was pushed, was checked by nothing. The ledger table says which.\n\n' "$open"
              printf 'Независимое ревью исчерпало пять кругов (OD-25) и на этот раз не запускалось. Круг %s опубликован; за потолком ни одна находка PR не держит. `ai-review:pass` здесь значит «ревью закончено», а не «замечаний нет»: открытых находок в леджере — %s, и среди них может быть `floor`, который держал PR до пятого круга и чьё исправление никто не проверял.\n' "$round" "$open"
            fi
          } > /tmp/cap-note.md
          if [ "$blocking" -eq 0 ]; then
            gh pr edit "$PR" --repo "$REPO" --add-label ai-review:pass --remove-label ai-review:blocking ||
              echo "::error::could not apply \`ai-review:pass\` to #$PR after the review cap; add it by hand"
          else
            echo "::warning::#$PR is capped and still carries \`ai-review:blocking\` from round $round. The cap does not clear it without a push."
          fi
          [ -z "$said" ] || exit 0
          gh pr comment "$PR" --repo "$REPO" --body-file /tmp/cap-note.md || true

      # The model may fail for quota or authentication reasons. A later step
      # distinguishes that from a published review and clears stale verdicts.
      - name: Review
        if: steps.auth.outputs.ok == 'true' && steps.cap.outputs.run != 'no'
        id: review
        continue-on-error: true
        uses: anthropics/claude-code-action@a60f3e1db3edbceed2b1e6c6a9d34c36b8a15eba # v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ secrets.ATTADIPA_AGENT_TOKEN }}
          use_sticky_comment: "true"
          allowed_bots: "claude, github-actions"
          allowed_non_write_users: ""
          show_full_output: "false"
          display_report: "true"
          claude_args: |
            --model claude-opus-5 --effort xhigh --max-turns 100
            --allowedTools "Read,Glob,Grep,Bash(git diff:*),Bash(git log:*),Bash(git show:*),Bash(git rev-parse:*),Bash(git blame:*),Bash(git ls-files:*),Bash(ls:*),Bash(cat:*),Bash(head:*),Bash(tail:*),Bash(sed:*),Bash(grep:*),Bash(rg:*),Bash(wc:*),Bash(sort:*),Bash(uniq:*),Bash(gh pr view:*),Bash(gh pr diff:*),Bash(gh pr checks:*),Bash(gh pr comment:*),Bash(gh pr edit:*)"
          prompt: ${{ steps.review_prompt.outputs.body }}

      # What actually went wrong, read from the action's own execution log
      # rather than guessed at.
      #
      # The note below used to list two possible causes and leave the reader to
      # work out which applied. On 2026-08-22 the answer was neither: the review
      # ran, cost money, returned `is_error: false`, and was killed at turn 50 by
      # a 40-turn ceiling. Somebody spent twenty minutes reading credential
      # documentation for a limit written three lines above it. A diagnostic that
      # offers a menu is not a diagnostic.
      - name: Did the review actually happen
        # A GREEN JOB IS NOT A REVIEW, and until this step existed the two were
        # the same event on the pull request page.
        #
        # `continue-on-error: true` on the step above means a failed review
        # still leaves the job green; the reporting below keys off
        # `steps.review.outcome == 'failure'` to catch that. What it did not
        # catch is the action deciding not to run at all, which it reports as
        # SUCCESS:
        #
        #   ##[warning]Skipping action due to workflow validation: Workflow
        #   validation failed. The workflow file must exist and have identical
        #   content to the version on the repository's default branch.
        #   Exiting due to workflow validation skip
        #
        # That is the action refusing to run a version of itself that a pull
        # request has edited, and it is a good rule: without it a pull request
        # could edit this reviewer into rubber-stamping the same pull request.
        # But the outcome on the page is a green check, no comment and no
        # label — indistinguishable from a review that ran and found nothing,
        # which is the reading somebody will take. Observed on #81 at
        # 7a4d0f1, run 32591032435, 1.6 s.
        #
        # The signal is structural rather than textual: the action writes its
        # execution log only once the model has been invoked, so a step that
        # succeeded and left no log never reached the model. That covers the
        # validation skip, a refused credential and anything future that exits
        # early, without this step having to recognise each one by name.
        id: happened
        if: always() && steps.auth.outputs.ok == 'true'
        env:
          EXEC_FILE: ${{ steps.review.outputs.execution_file }}
          OUTCOME: ${{ steps.review.outcome }}
        run: |
          set -uo pipefail
          ran=yes
          if [ -z "${EXEC_FILE:-}" ] || [ ! -f "${EXEC_FILE}" ]; then
            ran=no
          fi
          echo "ran=${ran}" >> "$GITHUB_OUTPUT"
          if [ "$ran" = "no" ] && [ "${OUTCOME}" = "success" ]; then
            echo "::warning::The review step reported success and never reached the model — see the note on the pull request."
          fi

      - name: Establish whether the review was published
        id: published
        if: always() && steps.auth.outputs.ok == 'true' && steps.happened.outputs.ran == 'yes'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          STARTED: ${{ steps.started.outputs.at }}
          OUTCOME: ${{ steps.review.outcome }}
        run: |
          set -uo pipefail
          # The read is retried, and its failure stays distinguishable from an
          # empty list (#391). It used to sit behind two `2>/dev/null` and a
          # `|| true`, so a rate limit or a 502 arrived here as "", the helper
          # answered `unknown`, and no step below matches `unknown`: the job
          # ended green having converged nothing (#382, four rounds).
          comments=""
          for attempt in 1 2 3; do
            comments="$(gh api "repos/$REPO/issues/$PR/comments?per_page=100" --paginate --slurp | jq -c 'flatten(1)')" && break
            comments=""
            echo "::warning::reading the comments of #$PR failed (attempt $attempt of 3)"
            [ "$attempt" -lt 3 ] && sleep 5
          done
          labels="$(gh pr view "$PR" --repo "$REPO" --json labels --jq '.labels[].name' 2>/dev/null || true)"
          answer="$(bash "$ATTADIPA_TRUSTED_SCRIPTS/review-published.sh" yes "$OUTCOME" "$comments" "$labels" "$STARTED" || echo 'unknown helper failed')"
          case "$answer" in
            published\ *) state=published ;;
            silent\ *) state=silent ;;
            *) state=unknown ;;
          esac
          echo "state=$state" >> "$GITHUB_OUTPUT"
          if [ "$state" = unknown ]; then
            # Neither `published` nor `silent`, and no step below runs for it,
            # so this step carries the failure itself. Widening the two
            # did-not-happen conditions instead would also catch their mirror
            # case, a run that declined to review on purpose (#391).
            echo "::error::the review reached the model but its verdict could not be read back (${answer#unknown }); nothing was converged, and the label on #$PR is the reviewer's own rather than the convergence rule's. Re-run this check (#391)"
            exit 1
          fi
          if [ "$state" = published ] && [ "$OUTCOME" = failure ]; then
            echo "::warning::The review action reported failure after publishing its verdict; the published verdict remains authoritative."
          fi

      - name: Say that the review published nothing
        if: always() && steps.published.outputs.state == 'silent' && steps.review.outcome != 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          SHA: ${{ github.event.pull_request.head.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          TRUSTED: ${{ env.ATTADIPA_TRUSTED_SCRIPTS }}
        run: |
          # No `set -e`, and that is the fix rather than a relaxation (#240).
          # This step used to read the comments, post a note and only then strip
          # the previous head's verdict labels, all under `set -euo pipefail`.
          # A rate-limited or 502-ing API on either of the first two ended the
          # step before the third, and a new head that nothing had reviewed kept
          # its `ai-review:pass`. The helper inverts the order: notification
          # failure is a warning, invalidation failure is a failure.
          #
          # THIS STEP THEN FAILS ANYWAY (#339). It used to exit with the
          # helper's status, so a successful invalidation of a silent review
          # ended green and the pull request presented as reviewed: check
          # `success`, `mergeStateStatus` `CLEAN`, no verdict label either way,
          # and the one signal that said otherwise was the body of a comment.
          # `merge-candidate.sh` held on the absent `ai-review:pass`, so the
          # automated path was safe; a hand merge was one step away. The silence
          # is the defect being reported, so it is what the exit status has to
          # carry. The helper's own result still reaches the log as its own
          # `::error::`, which is the difference between "nothing was published"
          # and "and the stale label is still there".
          set -uo pipefail
          silent() {
            echo "::error::the independent review ran on ${SHA:0:8} and published no verdict, so this check is red rather than reporting a review that did not happen. Re-run it: a silent run is not deterministic (#339)"
            exit 1
          }
          if [ -n "${TRUSTED:-}" ] && [ -r "$TRUSTED/review-invalidate.sh" ]; then
            bash "$TRUSTED/review-invalidate.sh" || true
            silent
          fi
          # Reaching here means the default-branch bundle could not be staged,
          # which also means `steps.published` could not run its own helper and
          # this step's `if:` should not have matched. Belt and braces: drop the
          # note rather than the invalidation, because the note is a courtesy
          # and the invalidation is what stops a merge.
          echo "::warning::the review invalidation helper was not staged from the default branch; removing the stale verdict labels without posting the note"
          gh pr edit "$PR" --repo "$REPO" --remove-label ai-review:pass ||
            echo "::error::could not remove the stale \`ai-review:pass\` from #$PR; take it off by hand"
          gh pr edit "$PR" --repo "$REPO" --remove-label ai-review:blocking ||
            echo "::error::could not remove the stale \`ai-review:blocking\` from #$PR; take it off by hand"
          silent

      - name: Converge the published reviewer verdict
        # This is deliberately after publication: no model output, missing bundle,
        # or failed API read may manufacture a pass. In every such case the
        # reviewer's own label remains the only verdict.
        if: >-
          !cancelled() && steps.auth.outputs.ok == 'true' &&
          steps.happened.outputs.ran == 'yes' &&
          steps.published.outputs.state == 'published' &&
          vars.CLAUDE_PR_REVIEW_ENABLED != 'false'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          TRUSTED: ${{ env.ATTADIPA_TRUSTED_SCRIPTS }}
          # WHOSE COMMENTS MAY DECIDE A VERDICT, named here rather than spelled
          # inside the queries below, so that changing an account is an edit to
          # a workflow rather than to a `jq` string nothing reads twice.
          #
          # The reviewer publishes as the account the action authenticates as.
          # The ledger is written by this step, with `github.token`, so it
          # arrives as `github-actions[bot]` — and the ledger query below had no
          # author condition at all. This repository is public, so that was an
          # unauthenticated write into the rule that sets `ai-review:pass`: a
          # comment beginning with the ledger marker is picked by `tail -1` over
          # the real one, and `review-verdict.sh` reads `first_round` and
          # `status` out of it for every finding.
          ATTADIPA_REVIEW_ACTOR: claude[bot]
          ATTADIPA_LEDGER_ACTOR: github-actions[bot]
        run: |
          set -euo pipefail
          [ -n "${TRUSTED:-}" ] && [ -r "$TRUSTED/review-verdict.sh" ] || exit 0
          : > /tmp/previous-ledger.md
          : > /tmp/findings.md
          ledger_id=$(gh api "repos/$REPO/issues/$PR/comments" --paginate --jq '.[] | select(.user.login == env.ATTADIPA_LEDGER_ACTOR) | select(.body | startswith("<!-- attadipa-review-ledger -->")) | .id' | tail -1)
          [ -z "$ledger_id" ] || gh api "repos/$REPO/issues/comments/$ledger_id" --jq '.body' > /tmp/previous-ledger.md
          # `contains`, NOT `startswith`, AND THE DIFFERENCE WAS THE WHOLE RULE.
          # The prompt above tells the reviewer to BEGIN the comment with
          # `<!-- attadipa-ai-review -->` and to END it with the findings block,
          # so `startswith` on the findings marker matched nothing the reviewer
          # can write: `finding_id` was always empty, `review-verdict.sh` always
          # answered `label=unknown`, no ledger was ever written and the
          # convergence rule of #169 never ran once. `_attadipa_block()` anchors
          # on the first marker line itself, so matching the comment loosely
          # here costs nothing.
          finding_id=$(gh api "repos/$REPO/issues/$PR/comments" --paginate --jq '.[] | select(.user.login == env.ATTADIPA_REVIEW_ACTOR) | select((.body | startswith("<!-- attadipa-review-ledger -->")) | not) | select(.body | contains("<!-- attadipa-review-findings")) | .id' | tail -1)
          [ -z "$finding_id" ] || gh api "repos/$REPO/issues/comments/$finding_id" --jq '.body' > /tmp/findings.md
          bash "$TRUSTED/review-verdict.sh" /tmp/previous-ledger.md /tmp/findings.md 4 /tmp/new-ledger.md /tmp/deferred.md "$PR" 5 > /tmp/verdict.txt
          label=$(sed -n 's/^label=//p' /tmp/verdict.txt)
          [ "$label" = "ai-review:pass" ] || [ "$label" = "ai-review:blocking" ] || exit 0
          if [ -n "$ledger_id" ]; then gh api -X PATCH "repos/$REPO/issues/comments/$ledger_id" -F body=@/tmp/new-ledger.md > /dev/null; else gh pr comment "$PR" --repo "$REPO" --body-file /tmp/new-ledger.md; fi
          case "$label" in ai-review:pass) other=ai-review:blocking;; *) other=ai-review:pass;; esac
          gh pr edit "$PR" --repo "$REPO" --add-label "$label" --remove-label "$other"

      - name: Work out why the review did not happen
        id: why
        # `!cancelled()` RATHER THAN `always()`, AND THE DIFFERENCE IS ONE
        # SENTENCE THIS WORKFLOW WAS PRINTING FALSELY.
        #
        # `always()` is true on cancellation as well as on success and failure.
        # The concurrency group above cancels a review whose head has been
        # superseded -- deliberately, because "a review of an old head is worse
        # than no review" -- and a cancelled job wrote no execution log, so
        # `steps.happened.outputs.ran` is `no` and this whole path used to run.
        # On #173 at `1c13322e` it posted **the independent review did not run**
        # and offered six causes, none of which was "this run was superseded",
        # beside a real review of the current head.
        #
        # `!cancelled()` is true for success and failure and false for
        # cancellation, which is exactly the line wanted here: a job killed by
        # `timeout-minutes` reports `failure`, not `cancelled`, so every run
        # that genuinely could not reach the model still says so with all six
        # causes intact. `.github/tests/review-cancelled-test.sh` evaluates both
        # of these conditions under a cancelled context and a failed one rather
        # than trusting that sentence.
        if: >-
          !cancelled() && steps.auth.outputs.ok == 'true' &&
          steps.cap.outputs.run != 'no' &&
          (steps.review.outcome == 'failure' || steps.happened.outputs.ran == 'no') &&
          steps.published.outputs.state != 'published'
        env:
          EXEC_FILE: ${{ steps.review.outputs.execution_file }}
        run: |
          set -euo pipefail
          detail='The action wrote no execution log at all, which means it never reached the model — a refused workflow or a rejected credential.'
          if [ -n "${EXEC_FILE:-}" ] && [ -f "${EXEC_FILE}" ]; then
            # Only the numeric and boolean fields. The free-text `result` is
            # model output and would be interpolated into a comment we author.
            # `-s` plus `flatten(1)` so this reads the log whether the action
            # writes one JSON array or one object per line. Both shapes have
            # been seen from this action and neither is documented.
            summary="$(jq -rs '
              flatten(1)
              | [.[] | select(type == "object" and .type == "result")] | last
              | if . == null then "the log has no result record — the session did not finish"
                else "is_error=\(.is_error), subtype=\(.subtype), turns=\(.num_turns), cost=$\(.total_cost_usd // 0)"
                end' "${EXEC_FILE}" 2>/dev/null || echo "the execution log could not be parsed")"
            detail="The session's own result record says: ${summary}"
            # AND THE PART THE STRUCTURAL FIELDS CANNOT REACH. `is_error=true,
            # subtype=success` is a true sentence that names nothing, and the
            # agent workflow lost an afternoon to exactly that shape on #67
            # (run 32589375744). .github/scripts/failure-reason.sh reads the
            # same log for text matching a whitelist of error grammars only --
            # an API status, a context refusal, a credit balance, an expired
            # token -- so the free-text `result` still never reaches a comment
            # we author, but a recognised failure gets to say its own name.
            #
            # From the default-branch bundle, never from the workspace -- the
            # workspace here is `refs/pull/N/merge`, which is the branch being
            # reviewed. See the bundle step near the checkout. With no bundle
            # the structural fields above still get reported; only the named
            # reason is lost, which is the right thing to lose.
            reason=""
            if [ -n "${ATTADIPA_TRUSTED_SCRIPTS:-}" ] && [ -r "${ATTADIPA_TRUSTED_SCRIPTS}/failure-reason.sh" ]; then
              reason="$(bash "${ATTADIPA_TRUSTED_SCRIPTS}/failure-reason.sh" "${EXEC_FILE}")"
            fi
            case "${reason}" in
              ""|unclassified*|"the run reported no error"*) ;;
              *) detail="${detail}"$'\n'"Reason: ${reason}" ;;
            esac
          fi
          {
            echo "detail<<ATTADIPA_EOF"
            echo "${detail}"
            echo "ATTADIPA_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Say that the review did not happen
        # The step that actually posts and strips labels, so this is where the
        # cancellation distinction is load-bearing rather than tidy. See the
        # note on `Work out why the review did not happen` above.
        #
        # `Say that the review published nothing` deliberately keeps `always()`:
        # its condition needs `steps.published.outputs.state == 'silent'`, which
        # is reachable only when the review ran and published nothing, and that
        # is a true finding about this head whether or not a newer one has since
        # arrived. Dropping a stale `ai-review:pass` off a superseded head is
        # the fail-closed direction; suppressing it would not be.
        if: >-
          !cancelled() && steps.auth.outputs.ok == 'true' &&
          steps.cap.outputs.run != 'no' &&
          (steps.review.outcome == 'failure' || steps.happened.outputs.ran == 'no') &&
          steps.published.outputs.state != 'published'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          SHA: ${{ github.event.pull_request.head.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          TRUSTED: ${{ env.ATTADIPA_TRUSTED_SCRIPTS }}
          # Through the environment, never through `${{ }}` inside the script:
          # the value is assembled from a file the model's session wrote.
          DETAIL: ${{ steps.why.outputs.detail }}
        run: |
          set -uo pipefail
          if [ -n "${TRUSTED:-}" ] && [ -r "$TRUSTED/review-not-run.sh" ]; then
            bash "$TRUSTED/review-not-run.sh"
            exit $?
          fi
          echo "::error::the trusted no-review helper was not staged"
          gh pr edit "$PR" --repo "$REPO" --remove-label ai-review:pass
          exit 1
