name: Claude PR review

# An independent reviewer, in a context that did not write the code.
#
# This is a separate workflow rather than another step in claude-agent.yml for
# one reason: an author reviewing their own work re-derives the same
# assumptions. A fresh context reads what is actually in the diff.
#
# It cannot push. `contents: read` is the whole safety argument — this workflow
# has an opinion and no hands.

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

concurrency:
  # Per pull request, and cancellable: a review of an old head is worse than no
  # review, because somebody will read it as current.
  group: attadipa-pr-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions: {}

jobs:
  review:
    name: Independent review
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      pull-requests: write
      issues: write
      # id-token: write is not optional, and the reason is easy to miss.
      #
      # github_token below is ATTADIPA_AGENT_TOKEN, which is deliberately allowed
      # to be empty — see docs/automation/CLAUDE_AUTOMATION.md. When it is, the
      # action authenticates as the Claude GitHub App by exchanging this
      # workflow's GitHub OIDC token for an installation token, and without this
      # permission that exchange fails with "Unable to get
      # ACTIONS_ID_TOKEN_REQUEST_URL". The failure looks like an authentication
      # problem with the Anthropic credential and is not one.
      id-token: write
    # A fork's pull request runs without secrets on a public repository, so
    # there is no credential to review with. That is GitHub's protection, not an
    # oversight, and pull_request_target — which would grant them — is exactly
    # the pattern that leaks tokens to untrusted code.
    #
    # claude[bot] is exempted from the bot guard, and the guard would otherwise
    # defeat this workflow's entire purpose.
    #
    # When ATTADIPA_AGENT_TOKEN is unset — the documented default — the
    # implementation agent opens its pull request through the Claude GitHub App,
    # so `github.actor` on that pull_request event is `claude[bot]`. A blanket
    # `!endsWith(actor, '[bot]')` therefore skipped the review on exactly the
    # pull requests this workflow exists to review: the agent's own. Every other
    # bot stays excluded, which is what the guard was actually for — Dependabot
    # opens four pull requests at a time and none of them wants an architecture
    # review.
    #
    # This does not create a loop. The review's output is a comment and a label;
    # a comment cannot raise a `pull_request` event, and the intake gate rejects
    # claude[bot] comments separately (.github/scripts/intake-decision.sh). The
    # job also holds `contents: read`, so the widest thing it can do is have an
    # opinion twice.
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      vars.CLAUDE_AUTOMATION_ENABLED != 'false' &&
      vars.CLAUDE_PR_REVIEW_ENABLED != 'false' &&
      (!endsWith(github.actor, '[bot]') || github.actor == 'claude[bot]')
    steps:
      - name: Record review-run start
        id: started
        run: echo "at=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      - name: Check that an Anthropic credential exists
        id: auth
        env:
          HAS_KEY: ${{ secrets.ANTHROPIC_API_KEY != '' }}
          HAS_OAUTH: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN != '' }}
        run: |
          if [ "$HAS_KEY" = "true" ] || [ "$HAS_OAUTH" = "true" ]; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
          else
            echo "ok=false" >> "$GITHUB_OUTPUT"
            echo "::notice::No Anthropic credential configured; skipping the AI review."
          fi

      - uses: actions/checkout@v7
        if: steps.auth.outputs.ok == 'true'
        with:
          fetch-depth: 0

      # Stage decision scripts and the prompt from the trusted default branch,
      # never from the pull request being reviewed.
      - name: Fetch trusted review inputs
        if: steps.auth.outputs.ok == 'true'
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          sparse-checkout: |
            .github/scripts
            .github/prompts
          sparse-checkout-cone-mode: false
          persist-credentials: false
          path: .attadipa-bundle

      - name: Stage trusted review inputs
        if: steps.auth.outputs.ok == 'true'
        run: |
          set -euo pipefail
          dest="$RUNNER_TEMP/attadipa-orchestration"
          rm -rf "$dest"
          mkdir -p "$dest"
          cp -R .attadipa-bundle/.github/scripts "$dest/scripts"
          cp -R .attadipa-bundle/.github/prompts "$dest/prompts"
          rm -rf .attadipa-bundle
          test -r "$dest/scripts/failure-reason.sh"
          test -r "$dest/prompts/pr-review.md"
          echo "ATTADIPA_TRUSTED_SCRIPTS=$dest/scripts" >> "$GITHUB_ENV"
          echo "ATTADIPA_TRUSTED_PROMPTS=$dest/prompts" >> "$GITHUB_ENV"

      - name: Load trusted review prompt
        id: review_prompt
        if: steps.auth.outputs.ok == 'true'
        env:
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          {
            echo 'body<<ATTADIPA_REVIEW_PROMPT'
            printf 'Review pull request #%s in %s.\n\n' "$PR" "$REPO"
            cat "$ATTADIPA_TRUSTED_PROMPTS/pr-review.md"
            echo ATTADIPA_REVIEW_PROMPT
          } >> "$GITHUB_OUTPUT"

      # The model may fail for quota or authentication reasons. A later step
      # distinguishes that from a published review and clears stale verdicts.
      - name: Review
        if: steps.auth.outputs.ok == 'true'
        id: review
        continue-on-error: true
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ secrets.ATTADIPA_AGENT_TOKEN }}
          use_sticky_comment: "true"
          allowed_bots: "claude"
          allowed_non_write_users: ""
          show_full_output: "false"
          display_report: "true"
          claude_args: |
            --model claude-opus-5 --effort xhigh --max-turns 100
            --allowedTools "Read,Glob,Grep,Bash(git diff:*),Bash(git log:*),Bash(git show:*),Bash(git rev-parse:*),Bash(git blame:*),Bash(git ls-files:*),Bash(ls:*),Bash(cat:*),Bash(head:*),Bash(tail:*),Bash(sed:*),Bash(grep:*),Bash(rg:*),Bash(wc:*),Bash(sort:*),Bash(uniq:*),Bash(gh pr view:*),Bash(gh pr diff:*),Bash(gh pr checks:*),Bash(gh pr comment:*),Bash(gh pr edit:*)"
          prompt: ${{ steps.review_prompt.outputs.body }}

      # What actually went wrong, read from the action's own execution log
      # rather than guessed at.
      #
      # The note below used to list two possible causes and leave the reader to
      # work out which applied. On 2026-08-22 the answer was neither: the review
      # ran, cost money, returned `is_error: false`, and was killed at turn 50 by
      # a 40-turn ceiling. Somebody spent twenty minutes reading credential
      # documentation for a limit written three lines above it. A diagnostic that
      # offers a menu is not a diagnostic.
      - name: Did the review actually happen
        # A GREEN JOB IS NOT A REVIEW, and until this step existed the two were
        # the same event on the pull request page.
        #
        # `continue-on-error: true` on the step above means a failed review
        # still leaves the job green; the reporting below keys off
        # `steps.review.outcome == 'failure'` to catch that. What it did not
        # catch is the action deciding not to run at all, which it reports as
        # SUCCESS:
        #
        #   ##[warning]Skipping action due to workflow validation: Workflow
        #   validation failed. The workflow file must exist and have identical
        #   content to the version on the repository's default branch.
        #   Exiting due to workflow validation skip
        #
        # That is the action refusing to run a version of itself that a pull
        # request has edited, and it is a good rule: without it a pull request
        # could edit this reviewer into rubber-stamping the same pull request.
        # But the outcome on the page is a green check, no comment and no
        # label — indistinguishable from a review that ran and found nothing,
        # which is the reading somebody will take. Observed on #81 at
        # 7a4d0f1, run 32591032435, 1.6 s.
        #
        # The signal is structural rather than textual: the action writes its
        # execution log only once the model has been invoked, so a step that
        # succeeded and left no log never reached the model. That covers the
        # validation skip, a refused credential and anything future that exits
        # early, without this step having to recognise each one by name.
        id: happened
        if: always() && steps.auth.outputs.ok == 'true'
        env:
          EXEC_FILE: ${{ steps.review.outputs.execution_file }}
          OUTCOME: ${{ steps.review.outcome }}
        run: |
          set -uo pipefail
          ran=yes
          if [ -z "${EXEC_FILE:-}" ] || [ ! -f "${EXEC_FILE}" ]; then
            ran=no
          fi
          echo "ran=${ran}" >> "$GITHUB_OUTPUT"
          if [ "$ran" = "no" ] && [ "${OUTCOME}" = "success" ]; then
            echo "::warning::The review step reported success and never reached the model — see the note on the pull request."
          fi

      - name: Establish whether the review was published
        id: published
        if: always() && steps.auth.outputs.ok == 'true' && steps.happened.outputs.ran == 'yes' && steps.review.outcome != 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          STARTED: ${{ steps.started.outputs.at }}
          OUTCOME: ${{ steps.review.outcome }}
        run: |
          set -uo pipefail
          comments="$(gh api "repos/$REPO/issues/$PR/comments?per_page=100" --paginate --slurp 2>/dev/null | jq -c 'flatten(1)' 2>/dev/null || true)"
          labels="$(gh pr view "$PR" --repo "$REPO" --json labels --jq '.labels[].name' 2>/dev/null || true)"
          answer="$(bash "$ATTADIPA_TRUSTED_SCRIPTS/review-published.sh" yes "$OUTCOME" "$comments" "$labels" "$STARTED" || echo 'unknown helper failed')"
          case "$answer" in
            published\ *) state=published ;;
            silent\ *) state=silent ;;
            *) state=unknown ;;
          esac
          echo "state=$state" >> "$GITHUB_OUTPUT"

      - name: Say that the review published nothing
        if: always() && steps.published.outputs.state == 'silent'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          SHA: ${{ github.event.pull_request.head.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          TRUSTED: ${{ env.ATTADIPA_TRUSTED_SCRIPTS }}
        run: |
          # No `set -e`, and that is the fix rather than a relaxation (#240).
          # This step used to read the comments, post a note and only then strip
          # the previous head's verdict labels, all under `set -euo pipefail`.
          # A rate-limited or 502-ing API on either of the first two ended the
          # step before the third, and a new head that nothing had reviewed kept
          # its `ai-review:pass`. The helper inverts the order and this step's
          # exit status is the helper's: notification failure is a warning,
          # invalidation failure is a failure.
          set -uo pipefail
          if [ -n "${TRUSTED:-}" ] && [ -r "$TRUSTED/review-invalidate.sh" ]; then
            bash "$TRUSTED/review-invalidate.sh"
            exit $?
          fi
          # Reaching here means the default-branch bundle could not be staged,
          # which also means `steps.published` could not run its own helper and
          # this step's `if:` should not have matched. Belt and braces: drop the
          # note rather than the invalidation, because the note is a courtesy
          # and the invalidation is what stops a merge.
          echo "::warning::the review invalidation helper was not staged from the default branch; removing the stale verdict labels without posting the note"
          rc=0
          gh pr edit "$PR" --repo "$REPO" --remove-label ai-review:pass || rc=1
          gh pr edit "$PR" --repo "$REPO" --remove-label ai-review:blocking || rc=1
          exit $rc

      - name: Converge the published reviewer verdict
        # This is deliberately after publication: no model output, missing bundle,
        # or failed API read may manufacture a pass. In every such case the
        # reviewer's own label remains the only verdict.
        if: >-
          !cancelled() && steps.auth.outputs.ok == 'true' &&
          steps.happened.outputs.ran == 'yes' &&
          steps.published.outputs.state == 'published' &&
          vars.CLAUDE_PR_REVIEW_ENABLED != 'false'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          TRUSTED: ${{ env.ATTADIPA_TRUSTED_SCRIPTS }}
          # WHOSE COMMENTS MAY DECIDE A VERDICT, named here rather than spelled
          # inside the queries below, so that changing an account is an edit to
          # a workflow rather than to a `jq` string nothing reads twice.
          #
          # The reviewer publishes as the account the action authenticates as.
          # The ledger is written by this step, with `github.token`, so it
          # arrives as `github-actions[bot]` — and the ledger query below had no
          # author condition at all. This repository is public, so that was an
          # unauthenticated write into the rule that sets `ai-review:pass`: a
          # comment beginning with the ledger marker is picked by `tail -1` over
          # the real one, and `review-verdict.sh` reads `first_round` and
          # `status` out of it for every finding.
          ATTADIPA_REVIEW_ACTOR: claude[bot]
          ATTADIPA_LEDGER_ACTOR: github-actions[bot]
        run: |
          set -euo pipefail
          [ -n "${TRUSTED:-}" ] && [ -r "$TRUSTED/review-verdict.sh" ] || exit 0
          : > /tmp/previous-ledger.md
          : > /tmp/findings.md
          ledger_id=$(gh api "repos/$REPO/issues/$PR/comments" --paginate --jq '.[] | select(.user.login == env.ATTADIPA_LEDGER_ACTOR) | select(.body | startswith("<!-- attadipa-review-ledger -->")) | .id' | tail -1)
          [ -z "$ledger_id" ] || gh api "repos/$REPO/issues/comments/$ledger_id" --jq '.body' > /tmp/previous-ledger.md
          # `contains`, NOT `startswith`, AND THE DIFFERENCE WAS THE WHOLE RULE.
          # The prompt above tells the reviewer to BEGIN the comment with
          # `<!-- attadipa-ai-review -->` and to END it with the findings block,
          # so `startswith` on the findings marker matched nothing the reviewer
          # can write: `finding_id` was always empty, `review-verdict.sh` always
          # answered `label=unknown`, no ledger was ever written and the
          # convergence rule of #169 never ran once. `_attadipa_block()` anchors
          # on the first marker line itself, so matching the comment loosely
          # here costs nothing.
          finding_id=$(gh api "repos/$REPO/issues/$PR/comments" --paginate --jq '.[] | select(.user.login == env.ATTADIPA_REVIEW_ACTOR) | select((.body | startswith("<!-- attadipa-review-ledger -->")) | not) | select(.body | contains("<!-- attadipa-review-findings")) | .id' | tail -1)
          [ -z "$finding_id" ] || gh api "repos/$REPO/issues/comments/$finding_id" --jq '.body' > /tmp/findings.md
          bash "$TRUSTED/review-verdict.sh" /tmp/previous-ledger.md /tmp/findings.md 4 /tmp/new-ledger.md /tmp/deferred.md "$PR" > /tmp/verdict.txt
          label=$(sed -n 's/^label=//p' /tmp/verdict.txt)
          [ "$label" = "ai-review:pass" ] || [ "$label" = "ai-review:blocking" ] || exit 0
          if [ -n "$ledger_id" ]; then gh api -X PATCH "repos/$REPO/issues/comments/$ledger_id" -F body=@/tmp/new-ledger.md > /dev/null; else gh pr comment "$PR" --repo "$REPO" --body-file /tmp/new-ledger.md; fi
          case "$label" in ai-review:pass) other=ai-review:blocking;; *) other=ai-review:pass;; esac
          gh pr edit "$PR" --repo "$REPO" --add-label "$label" --remove-label "$other"

      - name: Work out why the review did not happen
        id: why
        if: always() && steps.auth.outputs.ok == 'true' && (steps.review.outcome == 'failure' || steps.happened.outputs.ran == 'no')
        env:
          EXEC_FILE: ${{ steps.review.outputs.execution_file }}
        run: |
          set -euo pipefail
          detail='The action wrote no execution log at all, which means it never reached the model — a refused workflow or a rejected credential.'
          if [ -n "${EXEC_FILE:-}" ] && [ -f "${EXEC_FILE}" ]; then
            # Only the numeric and boolean fields. The free-text `result` is
            # model output and would be interpolated into a comment we author.
            # `-s` plus `flatten(1)` so this reads the log whether the action
            # writes one JSON array or one object per line. Both shapes have
            # been seen from this action and neither is documented.
            summary="$(jq -rs '
              flatten(1)
              | [.[] | select(type == "object" and .type == "result")] | last
              | if . == null then "the log has no result record — the session did not finish"
                else "is_error=\(.is_error), subtype=\(.subtype), turns=\(.num_turns), cost=$\(.total_cost_usd // 0)"
                end' "${EXEC_FILE}" 2>/dev/null || echo "the execution log could not be parsed")"
            detail="The session's own result record says: ${summary}"
            # AND THE PART THE STRUCTURAL FIELDS CANNOT REACH. `is_error=true,
            # subtype=success` is a true sentence that names nothing, and the
            # agent workflow lost an afternoon to exactly that shape on #67
            # (run 32589375744). .github/scripts/failure-reason.sh reads the
            # same log for text matching a whitelist of error grammars only --
            # an API status, a context refusal, a credit balance, an expired
            # token -- so the free-text `result` still never reaches a comment
            # we author, but a recognised failure gets to say its own name.
            #
            # From the default-branch bundle, never from the workspace -- the
            # workspace here is `refs/pull/N/merge`, which is the branch being
            # reviewed. See the bundle step near the checkout. With no bundle
            # the structural fields above still get reported; only the named
            # reason is lost, which is the right thing to lose.
            reason=""
            if [ -n "${ATTADIPA_TRUSTED_SCRIPTS:-}" ] && [ -r "${ATTADIPA_TRUSTED_SCRIPTS}/failure-reason.sh" ]; then
              reason="$(bash "${ATTADIPA_TRUSTED_SCRIPTS}/failure-reason.sh" "${EXEC_FILE}")"
            fi
            case "${reason}" in
              ""|unclassified*|"the run reported no error"*) ;;
              *) detail="${detail}"$'\n'"Reason: ${reason}" ;;
            esac
          fi
          {
            echo "detail<<ATTADIPA_EOF"
            echo "${detail}"
            echo "ATTADIPA_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Say that the review did not happen
        if: always() && steps.auth.outputs.ok == 'true' && (steps.review.outcome == 'failure' || steps.happened.outputs.ran == 'no')
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          SHA: ${{ github.event.pull_request.head.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          TRUSTED: ${{ env.ATTADIPA_TRUSTED_SCRIPTS }}
          # Through the environment, never through `${{ }}` inside the script:
          # the value is assembled from a file the model's session wrote.
          DETAIL: ${{ steps.why.outputs.detail }}
        run: |
          set -uo pipefail
          if [ -n "${TRUSTED:-}" ] && [ -r "$TRUSTED/review-not-run.sh" ]; then
            bash "$TRUSTED/review-not-run.sh"
            exit $?
          fi
          echo "::error::the trusted no-review helper was not staged"
          gh pr edit "$PR" --repo "$REPO" --remove-label ai-review:pass
          exit 1
