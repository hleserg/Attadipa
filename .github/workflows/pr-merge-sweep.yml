name: Merge what is finished

# THE LAST LINK IN THE QUEUE HAD NO AUTOMATION IN IT.
#
# An agent opens a pull request, CI goes green, the independent reviewer sets
# `ai-review:pass` -- and then nothing happens, because AGENTS.md makes the
# merge an *orchestrator* act and an orchestrator is a live session. On
# 2026-08-22 six finished pull requests sat green for hours, each carrying
# `Fixes #N`, and the six issues behind them stayed open. The complaint was
# about the issues; the cause was that nobody merged.
#
# The unattended backstop routine does merge, but `docs/` only, never
# `docs/automation/`, three per run. A green pull request touching `core/` was
# waiting for a human-shaped event the design never scheduled.
#
# This closes that gap with the SAME conditions the owner already approved for
# the backstop (docs/automation/attadipa-backstop-routine.md, STEP 2),
# transcribed rather than reinvented -- INCLUDING the path allowlist, the
# three-per-run cap and the requirement that the verdict was reached on the head
# commit. The first version of this file dropped all three, in the widening
# direction; review caught it. Widening what may be merged unattended reverses an
# owner decision of 2026-08-21 and is not a reviewer's to grant, so this sweep
# merges exactly what the backstop routine already may, on a schedule instead of
# on somebody remembering. Everything outside that list still waits for an
# orchestrator session, which is what AGENTS.md says it waits for.
#
# WHAT THIS IS NOT. It is not GitHub's native auto-merge, which cannot read a
# label -- and `ai-review:blocking` is a label rather than a required check,
# deliberately, because the reviewer's verdict is a judgement and a red tick is
# a fact. Arming native auto-merge would merge exactly the pull requests the
# reviewer blocked.
#
# COST AND SAFETY. Shell and the GitHub API; no Claude, no Anthropic spend. It
# never checks out a pull request's code and never runs anything from a branch,
# so a hostile contributor's tree cannot execute here -- the only inputs are API
# facts, and the decision itself is a file that a test can execute:
# .github/scripts/merge-candidate.sh, .github/tests/merge-candidate-test.sh.

on:
  schedule:
    # Every half hour, deliberately off both :00 and :30 -- every scheduled
    # workflow on GitHub fires on the hour and queues behind everybody else's.
    - cron: "23,53 * * * *"
  workflow_dispatch:

concurrency:
  group: attadipa-pr-merge-sweep
  cancel-in-progress: false

permissions: {}

jobs:
  sweep:
    name: Merge what is finished
    runs-on: ubuntu-latest
    if: vars.CLAUDE_AUTOMATION_ENABLED != 'false'
    permissions:
      contents: write
      pull-requests: write
    # Against `cancel-in-progress: false` on the group above: one hung API call
    # would otherwise hold the group for the six-hour default while GitHub
    # cancels the sweeps queued behind it. CLAUDE_AUTOMATION.md lists job
    # timeouts as a cost control; this one is a liveness control as well.
    timeout-minutes: 15
    steps:
      # Sparse and pinned to the default branch, for the reason the intake
      # gate's checkout is: this job can put a commit in `main`, so the rule it
      # applies comes from `main` or from nowhere. A schedule event already runs
      # from the default branch; saying so here means a future trigger cannot
      # quietly change that.
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          sparse-checkout: .github/scripts
          sparse-checkout-cone-mode: false
          persist-credentials: false

      - name: Decide, and merge what qualifies
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -uo pipefail

          # One pass over the open pull requests. `--slurp` because `--paginate`
          # alone emits one JSON array per page, which `jq` reads as several
          # documents rather than one.
          #
          # THE FILTER IS A PIPE, NOT `--jq`. `gh` refuses the two together --
          # "the `--slurp` option is not supported with `--jq` or `--template`"
          # -- so the first version of this failed on its very first run,
          # before it had looked at a single pull request. Caught by dispatching
          # the workflow rather than by reading it, which is the argument for
          # dispatching a new scheduled workflow once instead of waiting for its
          # cron. `.github/tests/gh-api-usage-test.sh` now fails the build on
          # the combination so it cannot come back.
          #
          # An API failure and an empty repository must not print the same
          # line: "no open pull requests" on a rate limit, a 5xx or a `gh` too
          # old for `--slurp` reads as a healthy quiet sweep, and this workflow
          # runs 48 times a day. Found in review.
          if ! PRS="$(gh api --paginate --slurp \
            "repos/$REPO/pulls?state=open&per_page=100" 2>/tmp/pulls-err \
            | jq -r 'if type=="array" and (.[0]|type)=="array" then add else . end
                  | map(.number) | .[]' 2>>/tmp/pulls-err)"; then
            echo "::error::could not list open pull requests ($(head -c 400 /tmp/pulls-err 2>/dev/null)); this sweep decided nothing"
            exit 1
          fi

          if [ -z "$PRS" ]; then
            echo "::notice::no open pull requests"
            exit 0
          fi

          # THREE PER RUN, the same cap the backstop routine carries and for the
          # reason it gives: "a backstop that empties the queue in one go is
          # indistinguishable from one that has gone wrong". It also bounds the
          # base-moved problem -- a green tick is `refs/pull/N/merge` against
          # `main` AS IT WAS when the checks ran, and merging A then B lands a
          # combination no check has seen. Three is a bound on that, not a cure;
          # the cure is up-to-date-branch protection, which is the owner's to
          # turn on.
          MAX_PER_RUN=3
          # One permission lookup per distinct non-bot commenter, and a bound on
          # them: a pull request with a hundred participants must not spend a
          # sweep on API calls. Past the bound the remaining logins stay
          # `unknown`, which holds rather than merges, and the run says so.
          MAX_PERMISSION_LOOKUPS=25
          MERGED=0
          REFUSED=0
          for PR in $PRS; do
            if [ "$MERGED" -ge "$MAX_PER_RUN" ]; then
              echo "::notice::reached the cap of $MAX_PER_RUN merges for this run; the rest wait for the next sweep"
              break
            fi
            # --- gather, per pull request. Nothing here is inferred. ---------
            # GraphQL in one round trip for the facts REST splits across four
            # endpoints, including the two REST cannot answer at all:
            # mergeStateStatus and whether a review thread is resolved.
            # shellcheck disable=SC2016  # $owner/$name/$number are GraphQL variables, bound by -F below
            FACTS="$(gh api graphql -f query='
              query($owner:String!, $name:String!, $number:Int!) {
                repository(owner:$owner, name:$name) {
                  pullRequest(number:$number) {
                    isDraft
                    mergeStateStatus
                    labels(first:50) { nodes { name } }
                    reviewThreads(first:100) { nodes { isResolved } }
                    files(first:100) { nodes { path } }
                    timelineItems(last:100, itemTypes:[LABELED_EVENT]) {
                      nodes { ... on LabeledEvent { createdAt label { name } } }
                    }
                    commits(last:1) { nodes { commit {
                      committedDate
                      pushedDate
                      statusCheckRollup { contexts(first:100) { nodes {
                        __typename
                        ... on CheckRun { conclusion status }
                        ... on StatusContext { state }
                      } } }
                    } } }
                  }
                }
              }' -F owner="${REPO%%/*}" -F name="${REPO##*/}" -F number="$PR" \
              2>/dev/null)" || FACTS=""

            # An empty or error document means the facts were not established.
            # Not establishing a fact is not the same as the fact being benign,
            # so this declines rather than defaulting.
            if [ -z "$FACTS" ] || ! printf '%s' "$FACTS" | jq -e '.data.repository.pullRequest' >/dev/null 2>&1; then
              echo "::notice::#$PR: could not read its state, leaving it alone"
              continue
            fi

            IS_DRAFT="$(printf '%s' "$FACTS" | jq -r '.data.repository.pullRequest.isDraft')"
            MERGEABLE="$(printf '%s' "$FACTS" | jq -r '.data.repository.pullRequest.mergeStateStatus // "" | ascii_downcase')"
            # One label per line, not space joined: GitHub permits a space
            # inside a label name, and a label called `x ai-review:pass`
            # satisfied a space-separated substring test. Found in review.
            LABELS="$(printf '%s' "$FACTS" | jq -r '.data.repository.pullRequest.labels.nodes[].name')"
            UNRESOLVED="$(printf '%s' "$FACTS" | jq -r '[.data.repository.pullRequest.reviewThreads.nodes[] | select(.isResolved | not)] | length')"
            # pushedDate first, committedDate as the fallback. The settling
            # window asks when code last ARRIVED, and committedDate is the git
            # committer clock -- `GIT_COMMITTER_DATE=2020-01-01` defeats it
            # while pushedDate is observed by GitHub. pushedDate is null for
            # some commits, which is why the fallback exists and why this is a
            # narrowing rather than a replacement. Found in review.
            COMMITTED="$(printf '%s' "$FACTS" | jq -r '
              .data.repository.pullRequest.commits.nodes[0].commit
              | (.pushedDate // .committedDate) // "null"')"

            # WHICH COMMIT THE VERDICT WAS REACHED ON. The label says a verdict
            # happened, not which commit it happened on -- and a review that
            # reaches no verdict leaves the previous commit's label in place,
            # which is how a commit nothing reviewed reaches `main`. So the most
            # recent `labeled ai-review:pass` event is dated against the head.
            # `unknown` when either date is missing, and unknown holds.
            PASS_AT="$(printf '%s' "$FACTS" | jq -r '
              [ .data.repository.pullRequest.timelineItems.nodes[]?
                | select(.label.name == "ai-review:pass") | .createdAt ]
              | max // ""')"
            PASS_AFTER_HEAD=unknown
            if [ -n "$PASS_AT" ] && [ "$PASS_AT" != "null" ] \
               && [ -n "$COMMITTED" ] && [ "$COMMITTED" != "null" ]; then
              PASS_EPOCH=$(date -u -d "$PASS_AT" +%s 2>/dev/null || echo "")
              HEAD_EPOCH=$(date -u -d "$COMMITTED" +%s 2>/dev/null || echo "")
              if [ -n "$PASS_EPOCH" ] && [ -n "$HEAD_EPOCH" ]; then
                if [ "$PASS_EPOCH" -ge "$HEAD_EPOCH" ]; then
                  PASS_AFTER_HEAD=true
                else
                  PASS_AFTER_HEAD=false
                fi
              fi
            fi

            # WHAT IT TOUCHES. `files(first:100)` -- a pull request with more
            # than a hundred changed files reads as a truncated list, so the
            # count is compared against `changedFiles` below and a truncation
            # holds rather than merging on a partial read.
            PATHS="$(printf '%s' "$FACTS" | jq -r '.data.repository.pullRequest.files.nodes[]?.path')"
            FILE_COUNT="$(printf '%s' "$FACTS" | jq -r '[.data.repository.pullRequest.files.nodes[]?] | length')"
            if [ "$FILE_COUNT" -ge 100 ]; then
              echo "::notice::#$PR: 100 or more changed files, so the path list may be truncated; leaving it alone"
              continue
            fi

            # A run still in flight has a null conclusion. It must reach the
            # decision as something, and `pending` is what the rule refuses on
            # -- reporting it as empty would drop the token and shorten the
            # list, which is how "all green" over nothing gets to be true.
            #
            # AND THE ROLLUP HOLDS TWO DIFFERENT THINGS. A `StatusContext` is a
            # commit status posted by whatever app has a token; a `CheckRun` is
            # a job. Flattening them let one third-party status stand in for CI
            # having run at all -- "Devin Review / success / Full review
            # skipped: trial expired" was the only context on heads whose
            # workflows were still waiting for approval, and the combined state
            # read `success`. Statuses are tagged so the rule can refuse on a
            # red one without counting a green one as a check.
            CHECKS="$(printf '%s' "$FACTS" | jq -r '
              [ .data.repository.pullRequest.commits.nodes[0].commit.statusCheckRollup.contexts.nodes[]?
                | if .__typename == "CheckRun"
                  then (if .status == "COMPLETED" then (.conclusion // "pending") else "pending" end)
                  else "status:" + (.state // "pending") end
                | ascii_downcase ] | join(" ")')"

            HEAD_AGE=""
            if [ -n "$COMMITTED" ] && [ "$COMMITTED" != "null" ]; then
              HEAD_AGE=$(( $(date -u +%s) - $(date -u -d "$COMMITTED" +%s) ))
            fi

            # The other reviewer. Codex is configured on ChatGPT's side and does
            # not set `ai-review:pass`, so a finding of its reaches us only as a
            # comment -- and that it always arrives as a review thread was
            # observed once, on #19, not promised anywhere. ALL THREE SHAPES
            # COUNT, and the first version of this only read
            # `issues/{n}/comments`, which is issue comments -- a Codex REVIEW
            # BODY was invisible to it while the comment beside it said both
            # shapes were counted.
            #
            # AND "ANSWERED" MEANT ANY COMMENT BY ANYBODY AFTER IT. Two rounds
            # of narrowing did not reach the bottom of that. The first excluded
            # bots, because the hand-over's outcome comment and the reviewer's
            # sticky comment were closing findings by themselves. What was left
            # -- `select(.bot | not)` -- was still a CLASSIFICATION standing in
            # for an AUTHORISATION, on a public repository where anybody with an
            # account can leave a comment, and the "answer" needed no relation
            # to the finding beyond a later timestamp. Issue #130.
            #
            # So the facts are gathered here and the rule lives in a file that a
            # test can execute: .github/scripts/codex-answered.sh. Three sources,
            # because a reply relationship only exists in one of them --
            # `pulls/{n}/comments` carries `in_reply_to_id`, and issue comments
            # and review bodies carry nothing of the kind.
            #
            # Piped rather than `--jq`, for the reason given at the head of this
            # step: `gh` rejects `--slurp` together with `--jq`. Here it failed
            # QUIETLY -- every read is `|| ..._=""`, so the rejection landed as
            # "could not read its comments, leaving it alone" on every pull
            # request, which is the safe direction and therefore the one nobody
            # would have chased.
            CODEX_ISSUE="$(gh api --paginate --slurp \
              "repos/$REPO/issues/$PR/comments?per_page=100" 2>/dev/null \
              | jq 'if type=="array" and (.[0]|type)=="array" then add else . end
                    | map({kind: "issue", login: .user.login, at: .created_at,
                           bot: (.user.type == "Bot"), thread: null,
                           body: (.body // "")})' \
              2>/dev/null)" || CODEX_ISSUE=""
            CODEX_REVIEW="$(gh api --paginate --slurp \
              "repos/$REPO/pulls/$PR/reviews?per_page=100" 2>/dev/null \
              | jq 'if type=="array" and (.[0]|type)=="array" then add else . end
                    | map(select(.body != "" and .body != null)
                          | {kind: "review", login: .user.login, at: .submitted_at,
                             bot: (.user.type == "Bot"), thread: null,
                             body: (.body // "")})' \
              2>/dev/null)" || CODEX_REVIEW=""
            # `in_reply_to_id // id` is GitHub's own thread root: every comment
            # in a thread but the first carries the first one's id, and the
            # first carries none. That is the only structural link between a
            # finding and a reply that this API offers, and it is why inline
            # comments do not need the written acknowledgement that issue
            # comments and review bodies do.
            CODEX_INLINE="$(gh api --paginate --slurp \
              "repos/$REPO/pulls/$PR/comments?per_page=100" 2>/dev/null \
              | jq 'if type=="array" and (.[0]|type)=="array" then add else . end
                    | map({kind: "review-comment", login: .user.login, at: .created_at,
                           bot: (.user.type == "Bot"), thread: (.in_reply_to_id // .id),
                           body: (.body // "")})' \
              2>/dev/null)" || CODEX_INLINE=""

            if [ -z "$CODEX_ISSUE" ] || [ -z "$CODEX_REVIEW" ] || [ -z "$CODEX_INLINE" ]; then
              # A read that failed is not a repository with nothing outstanding.
              echo "::notice::#$PR: could not read its comments, leaving it alone"
              continue
            fi
            RECORDS="$(jq -n --argjson a "$CODEX_ISSUE" --argjson b "$CODEX_REVIEW" \
                             --argjson c "$CODEX_INLINE" '$a + $b + $c' 2>/dev/null)" || RECORDS=""

            # ASK ONCE BEFORE PAYING FOR THE ANSWER. With no `permission` field
            # on any record the rule reads them all as unverified, so it can
            # still answer `0` -- and it answers `0` for exactly one reason:
            # the other reviewer never commented on this pull request. Most
            # never carry a finding, and this is 48 runs a day, so the
            # permission lookups below happen only where a finding exists.
            #
            # This also keeps the Codex logins in ONE place, inside the rule.
            # Testing for them here as well would be a second list, and a
            # second list is a list that will disagree.
            CODEX=unknown
            if [ -n "$RECORDS" ]; then
              CODEX="$(printf '%s' "$RECORDS" \
                       | bash .github/scripts/codex-answered.sh "$COMMITTED" 2>/dev/null)" || CODEX=unknown
            fi

            if [ "$CODEX" != "0" ] && [ -n "$RECORDS" ]; then
              # WHO IS ENTITLED TO ANSWER, established rather than assumed. This
              # is the same call the intake gate makes before starting a
              # billable writer -- `repos/{repo}/collaborators/{login}/permission`
              # -- and it needs no permission this job does not already hold. A
              # lookup that fails is `unknown`, not `none`: both hold the merge,
              # but only one of them is true, and a log that says the wrong one
              # sends somebody chasing a stranger who does not exist.
              PERMS='{}'
              LOOKED=0
              for LOGIN in $(printf '%s' "$RECORDS" \
                             | jq -r '[.[] | select(.bot == false) | .login] | unique | .[]' 2>/dev/null); do
                if [ "$LOOKED" -ge "$MAX_PERMISSION_LOOKUPS" ]; then
                  # No silent cap. The logins past it stay `unknown`, which
                  # holds if one of them was the answer, and says so here.
                  echo "::notice::#$PR: more than $MAX_PERMISSION_LOOKUPS distinct commenters; the rest count as unverified"
                  break
                fi
                LOOKED=$((LOOKED + 1))
                PERM="$(gh api "repos/$REPO/collaborators/$LOGIN/permission" \
                        --jq .permission 2>/dev/null)" || PERM=""
                case "$PERM" in
                  admin|maintain|write|triage|read|none) : ;;
                  *) PERM=unknown ;;
                esac
                PERMS="$(jq -n --argjson m "$PERMS" --arg l "$LOGIN" --arg p "$PERM" \
                         '$m + {($l): $p}' 2>/dev/null)" || PERMS='{}'
              done

              CODEX=unknown
              RECORDS="$(jq -n --argjson r "$RECORDS" --argjson p "$PERMS" \
                '[ $r[] | . + {permission: ($p[.login] // "unknown")} ]' 2>/dev/null)" || RECORDS=""
              if [ -n "$RECORDS" ]; then
                CODEX="$(printf '%s' "$RECORDS" \
                         | bash .github/scripts/codex-answered.sh "$COMMITTED" 2>/dev/null)" || CODEX=unknown
              fi
            fi
            case "$CODEX" in
              unknown) : ;;
              ''|*[!0-9]*) CODEX=unknown ;;
            esac

            VERDICT="$(bash .github/scripts/merge-candidate.sh \
              "$CHECKS" "$LABELS" "$UNRESOLVED" "$CODEX" \
              "$MERGEABLE" "$IS_DRAFT" "$HEAD_AGE" "$PATHS" "$PASS_AFTER_HEAD")"

            case "$VERDICT" in
              HOLD*)
                echo "::notice::#$PR: ${VERDICT#HOLD }"
                continue ;;
              READY)
                # Undrafting is a visible act on somebody else's work, so it
                # happens only once every other condition already holds -- never
                # as a way to make a candidate qualify.
                #
                # AND IT DOES NOT START A REVIEW, which the first version of
                # this said it did. GitHub raises no workflow run from an event
                # caused by `GITHUB_TOKEN`, with the exception of
                # `workflow_dispatch` and `repository_dispatch` -- and
                # claude-pr-review.yml fires on `ready_for_review`. So no second
                # opinion is obtained here, and saying one was is worse than
                # merging in a single pass, because it reads as a check that
                # happened. Found in review.
                #
                # What actually protects the merge is the condition above: the
                # `ai-review:pass` this rests on has to have been set AT OR
                # AFTER the head commit. Undrafting changes no commit, so that
                # stays true across the two passes. Splitting the passes is
                # still worth it -- every fact is re-gathered, and undrafting
                # somebody's work is a visible act that should not share a run
                # with the merge -- but it is not a second review, and a person
                # who wants one can ask for it in the window.
                if gh pr ready "$PR" --repo "$REPO"; then
                  echo "::notice::#$PR: taken out of draft; the next sweep re-gathers every fact and decides. No review is started by this -- see the note in the workflow."
                else
                  echo "::warning::#$PR: could not take it out of draft"
                fi
                continue ;;
              MERGE) : ;;
              *)
                echo "::warning::#$PR: unrecognised verdict '$VERDICT', leaving it alone"
                continue ;;
            esac

            if gh pr merge "$PR" --repo "$REPO" --squash --delete-branch; then
              MERGED=$((MERGED + 1))
              echo "::notice::#$PR: merged"
            else
              REFUSED=$((REFUSED + 1))
              echo "::warning::#$PR: merge refused by GitHub; nothing changed"
            fi
          done

          echo "::notice::sweep finished, $MERGED merged"

          # A refusal is a repository setting, not a transient. If `main`
          # requires a human review, or squash merges are disabled, EVERY merge
          # fails -- and as warnings on a green job that reads exactly like a
          # sweep with nothing to do, 48 times a day. So a refusal fails the run
          # once, loudly, with the thing to go and look at.
          if [ "$REFUSED" -gt 0 ]; then
            echo "::error::$REFUSED merge(s) were refused by GitHub. This is usually a repository setting rather than a transient: check whether 'main' requires a review it is not getting, or whether squash merging is disabled."
            exit 1
          fi
