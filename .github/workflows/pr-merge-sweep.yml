name: Merge what is finished

# Scheduled, non-billable backstop. It uses the owner's narrow unattended
# allowlist and never checks out pull-request code. The tested transport and
# decisions come from the trusted default branch.

on:
  schedule:
    - cron: "23,53 * * * *"
  workflow_dispatch:

concurrency:
  group: attadipa-pr-merge-sweep
  cancel-in-progress: false

permissions: {}

jobs:
  sweep:
    name: Merge what is finished
    runs-on: ubuntu-latest
    if: vars.CLAUDE_AUTOMATION_ENABLED != 'false'
    timeout-minutes: 15
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          sparse-checkout: .github/scripts
          sparse-checkout-cone-mode: false
          persist-credentials: false

      - name: Decide, and merge what qualifies
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: bash .github/scripts/pr-merge-sweep.sh

