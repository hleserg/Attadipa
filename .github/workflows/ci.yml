name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  # One run per ref. A push that supersedes an earlier one cancels it: the older
  # result is about code nobody is looking at any more, and on an agent branch
  # a stale failure would trigger a repair for a problem already replaced.
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  host-build:
    name: Host build and tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # Pillow, for the two asset-pipeline checks that have to draw something to
      # know whether the drawing changed. The apt package rather than pip,
      # because the runner's Python is externally managed and this needs no
      # version pin — nothing ships Pillow, it is a tool-time dependency and its
      # output is committed. Without it CMake registers a deliberately failing
      # test in their place rather than skipping them quietly.
      - name: Install Pillow
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends python3-pil

      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build

      - name: Test
        run: ctest --test-dir build --output-on-failure

  strict-warnings:
    name: Strict warnings (GCC, -Werror)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # -Werror is only defensible because the debt is zero, and that was
      # measured rather than assumed: this set — including -Wshadow and
      # -Wconversion, the two that usually produce hundreds — produced no
      # warnings at all on the tree this job was added to. If it ever does, the
      # right response is to fix the warning, not to trim the list.
      #
      # It is a separate job from host-build on purpose. A new compiler release
      # with a new warning should fail one clearly named job, not the build
      # everyone else is waiting on.
      #
      # The simulator is deliberately not built here: LVGL is a vendored
      # dependency with its own warning profile, and holding somebody else's
      # code to our flags produces noise rather than quality.
      # Pillow, for the two asset-pipeline checks that have to draw something to
      # know whether the drawing changed. The apt package rather than pip,
      # because the runner's Python is externally managed and this needs no
      # version pin — nothing ships Pillow, it is a tool-time dependency and its
      # output is committed. Without it CMake registers a deliberately failing
      # test in their place rather than skipping them quietly.
      - name: Install Pillow
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends python3-pil

      - name: Configure
        run: >
          cmake -S . -B build-strict -DCMAKE_BUILD_TYPE=Debug
          -DCMAKE_CXX_FLAGS="-Wall -Wextra -Wpedantic -Wshadow -Wconversion -Wsign-conversion -Wcast-qual -Wold-style-cast -Werror"

      - name: Build
        run: cmake --build build-strict

      - name: Test
        run: ctest --test-dir build-strict --output-on-failure

  clang:
    name: Clang build and tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # A second front end catches what one does not: different template
      # diagnostics, different UB detection, different opinions about what is
      # conforming. This costs one runner and has caught real portability bugs
      # in every project that has tried it.
      # Pillow rides along with clang: the two asset-pipeline checks have to
      # draw something to know whether the drawing changed, and a second
      # apt-get update for one package is 10 seconds nobody needs. Without it
      # CMake registers a deliberately failing test in their place rather than
      # skipping them quietly.
      - name: Install Clang and Pillow
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends clang python3-pil

      - name: Configure
        run: cmake -S . -B build-clang -DCMAKE_BUILD_TYPE=Release -DCMAKE_CXX_COMPILER=clang++

      - name: Build
        run: cmake --build build-clang

      - name: Test
        run: ctest --test-dir build-clang --output-on-failure

  sanitizers:
    name: AddressSanitizer and UndefinedBehaviorSanitizer
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # The host tests are where the logic lives, so this is where memory and
      # UB bugs are cheapest to find. On the device there is no sanitizer and a
      # buffer overrun is a reboot with no message.
      #
      # halt_on_error=1 matters: without it UBSan prints and continues, the test
      # passes, and the report scrolls past in a green job.
      # Pillow, for the two asset-pipeline checks that have to draw something to
      # know whether the drawing changed. The apt package rather than pip,
      # because the runner's Python is externally managed and this needs no
      # version pin — nothing ships Pillow, it is a tool-time dependency and its
      # output is committed. Without it CMake registers a deliberately failing
      # test in their place rather than skipping them quietly.
      - name: Install Pillow
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends python3-pil

      - name: Configure
        run: >
          cmake -S . -B build-asan -DCMAKE_BUILD_TYPE=Debug
          -DCMAKE_CXX_FLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer -fno-sanitize-recover=all -g"
          -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=address,undefined"

      - name: Build
        run: cmake --build build-asan

      - name: Test
        env:
          ASAN_OPTIONS: detect_leaks=1:abort_on_error=1
          UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1
        run: ctest --test-dir build-asan --output-on-failure

  coverage:
    name: Host coverage report
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install gcovr
        run: pipx install gcovr

      # Pillow, for the two asset-pipeline checks that have to draw something to
      # know whether the drawing changed. The apt package rather than pip,
      # because the runner's Python is externally managed and this needs no
      # version pin — nothing ships Pillow, it is a tool-time dependency and its
      # output is committed. Without it CMake registers a deliberately failing
      # test in their place rather than skipping them quietly.
      - name: Install Pillow
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends python3-pil

      - name: Configure
        run: >
          cmake -S . -B build-cov -DCMAKE_BUILD_TYPE=Debug
          -DCMAKE_CXX_FLAGS="--coverage -O0 -g"
          -DCMAKE_EXE_LINKER_FLAGS="--coverage"

      - name: Build
        run: cmake --build build-cov

      - name: Test
        run: ctest --test-dir build-cov --output-on-failure

      # An artifact, not a gate. A coverage threshold enforced before anybody
      # has looked at what is covered produces tests written for the number.
      # The report is here so the number can be looked at.
      - name: Report
        run: |
          gcovr --root . --exclude 'tests/.*' --exclude 'sim/.*' \
                --html-details build-cov/coverage.html \
                --txt build-cov/coverage.txt --print-summary
          cat build-cov/coverage.txt >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always()
        with:
          name: host-coverage
          path: |
            build-cov/coverage.html
            build-cov/coverage*.html
            build-cov/coverage.txt
          if-no-files-found: warn

  workflows:
    name: Workflow lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # The automation in .github/workflows/ is now load-bearing: it decides who
      # may drive a write-capable agent. A typo in an `if:` there fails open, and
      # a YAML file that is never compiled has nothing else to catch it.
      # actionlint also runs shellcheck over every `run:` block, which is where
      # the guards actually live.
      - name: Install actionlint
        env:
          ACTIONLINT_VERSION: "1.7.7"
        run: |
          set -euo pipefail
          curl -sSLo actionlint.tar.gz \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          tar -xzf actionlint.tar.gz actionlint
          sudo mv actionlint /usr/local/bin/

      - name: Lint
        run: actionlint -color

      # actionlint runs shellcheck over `run:` blocks, but not over the scripts
      # those blocks call. The intake gate is one of those scripts, so it would
      # otherwise be the least-checked file in the security boundary.
      - name: Shellcheck the scripts the workflows call
        run: shellcheck -x .github/scripts/*.sh .github/tests/*.sh

      # The gate decides who may drive a write-capable agent on a public
      # repository. This runs the real decision function against sixteen cases,
      # including a stranger who has copied the task marker verbatim.
      # Invoked through bash rather than as ./script on purpose. This working
      # copy lives on a filesystem where git reports core.filemode=false, so an
      # executable bit set locally never reaches a commit and the runner gets
      # `Permission denied` instead of a result. The mode is set correctly in
      # the index as well; this makes the job independent of it either way.
      - name: Intake gate
        run: bash .github/tests/intake-gate-test.sh

      # The watchdog hands over by workflow_dispatch, which the intake gate
      # trusts by construction and does not re-check the actor for. So this
      # filter is the last refusal before a billable writer starts, and it
      # reached review once in a state where the repository's own output could
      # have driven its own agent. There was no test; now there is.
      - name: Watchdog queue scan
        run: bash .github/tests/watchdog-filter-test.sh

      # agent:failed with no agent:ready beside it meant invisible to the
      # watchdog forever, with nothing on the issue explaining that. #82 found
      # #27 and #28 in exactly that state; this is the filter that finds them.
      - name: Stranded failures
        run: bash .github/tests/stranded-failures-test.sh

      # The count behind the bounded retry: how many times agent:failed has
      # been labelled since a HUMAN, not the hand-over itself, last put the
      # issue back in the queue. A first version counted an issue's whole
      # history instead, which meant a genuinely fixed task could never earn
      # back a retry -- found in review on #82's own pull request, against
      # #27, #28 and #69's real timelines.
      - name: Bounded retry count
        run: bash .github/tests/failure-count-test.sh

      # What the pipeline says out loud. A silent pipeline and a dead one look
      # the same from an issue, which cost this project a morning of somebody
      # asking whether anything was happening. The receipt and the outcome
      # comment are the fix, and text nobody asserts on drifts back to silence
      # one edit at a time.
      - name: What the agent says
        run: bash .github/tests/agent-say-test.sh

      # And whether what it says is true. The hand-over step has shipped two
      # defects, both in shell embedded in this workflow's sibling where nothing
      # could execute it: a GraphQL error document printed as a pull request
      # number, and then a claim of "pushed to this pull request" on a run that
      # pushed nothing. The decision is a file now, so it can be run.
      - name: What the agent decides it did
        run: bash .github/tests/handover-decision-test.sh

      # And what may be merged with nobody looking. This is the only rule in the
      # repository that can put a commit in `main` unattended, so it gets the
      # heaviest test: every one of the six conditions asserted in both
      # directions, plus the ORDER, because a rule that reads mergeStateStatus
      # before the draft flag declines every candidate it was written for -- a
      # draft reads `draft` there, never `clean`. Proven to fail against two
      # distinct real defects.
      - name: What may be merged unattended
        run: bash .github/tests/merge-candidate-test.sh

      # And who is entitled to close the other reviewer's findings. That
      # condition's trust test was `user.type != "Bot"` -- a classification
      # doing the work of an authorisation, on a public repository, where the
      # "answer" needed no relation to the finding beyond a later timestamp. A
      # stranger's comment cleared it. The rule is a file now, and the first
      # fixture below is the bypass, asserted as one.
      - name: Who may answer the other reviewer
        run: bash .github/tests/codex-answered-test.sh

      # And whether it says WHY, when the answer is in a log nobody may read.
      # `show_full_output: false` empties the published run log of exactly the
      # cause -- deliberately, because tool results carry file contents -- so a
      # failure comment saying "the cause is in the log" was sending people to a
      # redacted page. The extractor reads the unpublished execution log on the
      # runner and emits only text matching an error grammar. The tests that
      # matter put a private key and an API key in that log beside a real error
      # and assert that only the error comes out; the whitelist IS the security
      # model, so nothing else may keep it honest.
      - name: Why the agent says a run died
        run: bash .github/tests/failure-reason-test.sh

      # And whether the watchdog's dispatch is one the agent will accept.
      # Both files were individually correct and the PAIR was not: the watchdog
      # hands over as `github-actions[bot]` and the agent passed
      # `allowed_bots: ""`, so every autonomous run died in five seconds before
      # reading a file. Four issues were written off as unexplained model
      # deaths. Nothing either file's own review could have caught, which is
      # what makes it a test rather than a comment.
      # Two workflows admitted a bot actor and then handed the action a list
      # that did not name it: the watchdog dispatching claude-agent.yml as
      # github-actions[bot], and the reviewer's own claude[bot] exemption.
      # Both died in about five seconds with no execution log, and the
      # reviewer's died GREEN, because its step carries continue-on-error.
      - name: A workflow that admits a bot names it in allowed_bots
        run: bash .github/tests/bot-actor-test.sh

      # A task the bounded retry escalated carries agent:blocked, and the one
      # restart route that needs no label surgery -- a `@claude` comment -- ran
      # to completion and then reported NOTHING, because Hand over reads
      # agent:blocked as "the agent blocked itself this run" and exits. Each
      # half correct alone, in two different files, which is why it survived
      # both files' own tests and was found in review.
      - name: Restarting a blocked task produces an outcome
        run: bash .github/tests/blocked-restart-test.sh

      - name: A completed review reaches the pull request
        run: bash .github/tests/review-published-test.sh

      # The step above drives `review-published.sh`. This one drives the
      # workflow around it -- that a review which reached the model and
      # published nothing reports red, and that the previous head's
      # `ai-review:pass` comes off when the new head arrives.
      #
      # It is added here because it was never run. The file has existed since
      # #277; every other suite in `.github/tests/` has an explicit `run:`
      # above or below, and this one had none, so it was shellcheck-linted at
      # `:233` and never executed. #339's assertions existed only on a laptop.
      - name: A review that publishes nothing is red, and drops the stale pass
        run: bash .github/tests/review-invalidate-workflow-test.sh

      # The same query found two more, and they are not small: 19 assertions
      # and 104. `pr-branch-update-decision.sh:19` even says "CI runs that" of
      # a suite CI has never run.
      - name: A CI escalation is cleared by a repair, and only on a pull request
        run: bash .github/tests/ci-repair-reset-test.sh

      - name: Updating a pull request branch decides before it writes
        run: bash .github/tests/pr-branch-update-test.sh

      # The condition, evaluated. `always()` is true on cancellation as well as
      # on success and failure, so the no-verdict path used to report a
      # superseded review as a refused credential; a grep for `!cancelled()`
      # would pass on a file that had it in a comment.
      - name: A cancelled review is not a review that could not run
        run: bash .github/tests/review-cancelled-test.sh

      # The dependency-lock gate, exercised against a planted drift. The
      # firmware job runs the same script on a real build; this runs it on two
      # files, which is the only way to prove it goes red -- committing a
      # deliberately wrong lock to see CI fail is not a test anybody can leave
      # in the tree.
      - name: A moved dependency graph fails the lock gate
        run: bash .github/tests/lock-drift-check-test.sh

      # And nothing new joins them in the dark. Wiring three suites by hand is
      # a fix that lasts until somebody adds a fourth file, so the list is
      # checked rather than remembered. `shellcheck -x .github/tests/*.sh` at
      # `:233` is what let this hide: a suite nothing runs still parses, and a
      # green shellcheck reads as coverage.
      #
      # This was an inline `run:` block on #385 and is a script on #387, for
      # one reason: an inline block cannot be pointed at a tree with a planted
      # suite in it, so the one step in this file whose whole job is "no suite
      # hides here" was the one step nothing tested. It also grew a Python
      # half, and that is where #387's premise turned out to be wrong: the ten
      # suites it named were NOT in the state
      # `.github/tests/review-invalidate-workflow-test.sh` was in. Eleven of the
      # sixteen under `tools/` are `add_test` entries in `tests/CMakeLists.txt`,
      # which six jobs in this file run; the other five are steps in the `docs`
      # job below. #387 measured coverage by grepping this directory alone, so
      # it could not see a registration. What it did surface is that this guard
      # knew only one of the two ways to run a suite here.
      - name: The suite-coverage guard actually catches an unwired suite
        run: bash .github/tests/suite-coverage-test.sh

      - name: Every self-test suite in the tree is actually run
        run: bash .github/scripts/check-suite-coverage.sh .

      - name: A re-review eventually converges without weakening floor findings
        run: bash .github/tests/review-verdict-test.sh

      - name: The review cap clears a block the head has outrun, and holds one it has not
        run: bash .github/tests/review-cap-stale-block-test.sh

      - name: The pull-request queue has a bounded width
        run: bash .github/tests/wip-limit-test.sh

      - name: Writer admission and exclusive claims are fail-closed
        run: bash .github/tests/admission-claim-test.sh

      # The step above proves admission refuses correctly. This one proves the
      # refusal is heard: the workflow's own condition graph, driven and then
      # mutated, because #293 was an ordering defect between two scripts that
      # were each right on their own.
      - name: A refused start is not a lost request
        run: bash .github/tests/deferred-admission-test.sh

      # Static, and it says so: it proves nothing about the code AT those
      # commits. What it proves is that the set of things which can change
      # under us without a commit here is empty.
      - name: Privileged actions run at a commit, not at a movable name
        env:
          GH_TOKEN: ${{ github.token }}
          ATTADIPA_PIN_CHECK_NETWORK: "1"
        run: bash .github/tests/action-pin-test.sh

      - name: The stable merge gate fails closed
        run: bash .github/tests/required-ci-test.sh

      # The gate above decides about one commit; this one asks whether the
      # merge that follows is bound to it. Drives pr-merge-sweep.sh itself
      # against a recording `gh`, because what the caller passes to `gh` is
      # the whole of #256 and a re-implementation cannot show it.
      - name: The unattended merge names the commit it inspected
        run: bash .github/tests/merge-sweep-head-binding-test.sh

      # Taking a pull request out of draft is not a sentence in a comment: a
      # draft can never read `mergeable_state: clean`, so undrafting is the step
      # that makes a branch eligible for an unattended merge. The number it is
      # given for done_pr comes from whichever open pull request says
      # `Fixes #N`, which an abandoned branch also says. This is the evidence
      # test between the two.
      - name: What may be taken out of draft
        run: bash .github/tests/promote-decision-test.sh

      # `gh issue edit` resolves repository.issue(number:), which does not
      # resolve pull requests -- three of claude-agent.yml's five triggers fire
      # on one, and every call is `|| true`, so neither outcome was reported.
      # Run against a stub `gh` on PATH: no network, no token.
      - name: A label edit reaches the object it names
        run: bash .github/tests/gh-label-test.sh

      # The staleness line is the only thing telling an agent that the finding
      # it is about to implement was made against code that has since moved.
      # Its previous version truncated at 800 characters and, on issue #26,
      # ended mid-path on the word "c".
      - name: The staleness summary
        run: bash .github/tests/compare-summary-test.sh

      # And whether anything notices a pull request that CANNOT be built. A
      # merge conflict stops GitHub creating the `pull_request` run at all, so
      # #65 sat with `total_count: 0` across two pushes: not a red check, no
      # check, and every consumer downstream reads that as "not failing". The
      # guard's own failure mode is the opposite one and it is easier to ship --
      # `mergeable` is null for a few seconds after every push, and a guard that
      # reads null as false would accuse every push in flight, hourly, forever.
      # All three states are asserted here in both directions.
      - name: A conflicted pull request gets told
        run: bash .github/tests/pr-conflict-decision-test.sh

      # `gh` refuses `--slurp` together with `--jq`, and exits 1 before making
      # a request. pr-merge-sweep.yml shipped with three of them: one fatal on
      # the first dispatched run, two swallowed by `|| VAR=""` into "could not
      # read its comments, leaving it alone" on every candidate. shellcheck saw
      # a well-formed command and actionlint saw valid YAML.
      - name: The gh calls in the workflows are ones gh accepts
        run: bash .github/tests/gh-api-usage-test.sh

      # The hand-over used to read its own code out of $GITHUB_WORKSPACE, which
      # on two of claude-agent.yml's five triggers is `refs/pull/N/merge` and on
      # all five is whatever the model session left behind. A branch that edits
      # `.github/scripts` had its version run with issues:write in hand; a
      # branch missing a helper killed the step under `set -euo pipefail`,
      # before the outcome comment, leaving the issue on agent:working. This
      # extracts the Hand over shell from the YAML and runs it against a stub
      # `gh` with a hostile working tree -- the boundary is executed, not read.
      - name: The hand-over runs the default branch's code, or says it could not
        run: bash .github/tests/orchestration-bundle-test.sh

  docs:
    name: Documentation consistency
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # Mutation-test the checker before trusting its result.
      - name: The checker actually checks
        run: python3 tools/docs/test_check_docs.py

      # What the citation check can and cannot see, because three documents
      # billed it as the answer to citation drift and it is not: it catches a
      # line past the end of a file, a blank line, and a range that is not one.
      # A citation that lands on a real, WRONG line is invisible to it unless
      # the citation carries a fingerprint -- `EXAMPLE.md:357 "Display FPC"`,
      # written with the reserved placeholder path because an illustration with
      # a real one is a live assertion -- in which case the check reads the line
      # and says where the text actually went. Two citations here were thirteen
      # lines out for weeks.
      #
      # Check 1 now reads the other half of a link too: the `#anchor` it had
      # always captured and never looked at. A renamed heading leaves a link
      # that lands at the top of the right file, which reads as working, and it
      # is what makes an OD-number collision survive a merge.
      - name: Links, spans, registers, root files and citations
        run: python3 tools/docs/check_docs.py .

      # The public site has static and JavaScript render paths. Test each
      # checker against mutations before trusting its result.
      - name: The site head-sync check actually checks
        run: python3 tools/site/test_check_head_sync.py

      - name: The rendered site head matches its static HTML
        run: python3 tools/site/check_head_sync.py .

      - name: The site-facts check actually checks
        run: python3 tools/site/test_check_site_facts.py

      - name: SEO image facts match repository assets
        run: python3 tools/site/check_site_facts.py .

      - name: The reveal-contract check actually checks
        run: python3 tools/site/test_check_reveal_contract.py

      - name: The site remains readable without JavaScript
        run: python3 tools/site/check_reveal_contract.py .

      # A named watch must stay named. The bench has a unit still carrying its
      # factory image, so a command aimed at one device and silently served by
      # another is not a tidiness problem.
      #
      # This drives the command line with a recorder behind it. Its sibling
      # `tools/watch/selftest.py` -- which drives `Watch` against a scripted
      # device, 41 groups and no socket -- is deliberately NOT a step here: it
      # is registered at `tests/CMakeLists.txt:502` -- "add_test(NAME watch_tool"
      # -- so six jobs already run it, and a step for it would be the tenth
      # duplicate of the nine this pull request removed. Faster feedback in a
      # job with no C++ build would be a reason to keep one; it is not a reason
      # to keep one and not the other nine.
      #
      # This step and the four above it are steps because nothing registers
      # them. Those five are the whole of what #387 was actually about.
      - name: An explicitly named watch stays named
        run: python3 tools/test_watch_control.py

  simulator:
    name: Simulator build and headless run
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # LVGL is fetched by CMake at the commit pinned in
      # docs/research/DEPENDENCIES.md. SDL2 is the only system package this
      # build needs; LVGL carries the SDL display, mouse and keyboard drivers
      # in-tree but does not link SDL itself.
      - name: Install SDL2 and Pillow
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libsdl2-dev python3-pil

      # CMake's shallow clone is --no-single-branch, so it pulls one commit off
      # every ref and the tree runs to hundreds of megabytes. That is a
      # download cost, not a correctness one -- the commit is verified after
      # the clone either way -- so it is fixed here rather than by inventing
      # another fetch mechanism in CMake. The key is the pin file: change the
      # pinned commit and the cache misses, which is the behaviour we want. The
      # repository is deliberately part of the key: CMake stores absolute
      # paths in FetchContent's sub-build cache, so a repository rename must
      # never restore a tree configured under the former checkout path.
      - name: Cache LVGL
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: build-sim/_deps
          key: lvgl-v2-${{ github.repository }}-${{ runner.os }}-${{ hashFiles('cmake/AttadipaLvgl.cmake') }}

      - name: Configure
        run: cmake -S . -B build-sim -DCMAKE_BUILD_TYPE=Release -DATTADIPA_BUILD_SIMULATOR=ON

      - name: Build
        run: cmake --build build-sim

      # No display attached, so SDL opens its dummy video driver. This renders
      # real frames through LVGL and writes a screenshot per geometry; the test
      # fails if either file cannot be produced.
      - name: Test
        env:
          SDL_VIDEODRIVER: dummy
        run: ctest --test-dir build-sim --output-on-failure

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: simulator-screenshots
          path: build-sim/screenshots/*.png
          # warn, not error: the render tests already fail if a screenshot is
          # missing. Failing the upload as well would turn one red into two and
          # bury the real message under an artifact-step error.
          if-no-files-found: warn

  firmware-build:
    name: Firmware build (ESP32-S3, ESP-IDF v5.5.5)
    runs-on: ubuntu-latest
    # The pinned toolchain, as a container rather than as an install script, so
    # that "reproducible from a clean checkout" is something this job proves
    # rather than something a pull-request body asserts.
    #
    # BY DIGEST, FOR THE SAME REASON EVERY `uses:` IN THIS DIRECTORY IS.
    # `espressif/idf:v5.5.5` is a name its owner can move, and this job builds
    # the firmware that ships. The tag stays as provenance and is not the trust
    # anchor: the digest below is the `linux/amd64` + `linux/arm64` OCI index
    # resolved from that tag on 2026-09-01, recorded with its resolution in
    # docs/research/DEPENDENCIES.md. Re-resolving it is a deliberate edit here.
    #
    # A digest binds the image BYTES, not their contents. What is inside is
    # asserted by the step below, which reads the commit out of the running
    # image and compares it with the one DEPENDENCIES.md documents -- so the
    # claim "this container is ESP-IDF v5.5.5 at ff1bac0" is checked on every
    # run rather than written down once.
    container: espressif/idf@sha256:a9231d0697ab8f7517cc072e93b7c83e04907bfbfba80b6440d7dbbf90665cf2  # v5.5.5
    steps:
      - name: The image is the ESP-IDF commit this repository documents
        shell: bash
        run: |
          # docs/research/DEPENDENCIES.md is the canonical record and this is the
          # only thing that makes it true of the bytes CI actually runs. A digest
          # alone proves the image did not change; it does not prove the image
          # was ever what the table says.
          #
          # THIS IS THE COMMIT, NOT THE TAG OBJECT. `git/ref/tags/v5.5.5` answers
          # `ff1bac0aeecdd2b797b9c3a558c6bd03629bc013` with `.object.type == "tag"`;
          # dereferencing it through `git/tags/<sha>` gives the commit below, and
          # `git rev-parse HEAD` inside the image returns the commit. The table
          # in DEPENDENCIES.md records the same trap for the same reason.
          documented=b774170ff46c393eeb5e495ea37936038d3f4f4f
          actual="$(git -C "$IDF_PATH" rev-parse HEAD)"
          version="$(. "$IDF_PATH/export.sh" >/dev/null 2>&1; idf.py --version)"
          echo "IDF_PATH=$IDF_PATH"
          echo "commit   $actual"
          echo "version  $version"
          if [ "$actual" != "$documented" ]; then
            echo "::error title=Container is not the documented ESP-IDF commit::image is at $actual, DEPENDENCIES.md documents $documented. Re-resolve the digest and update the table together, or find out why they disagree."
            exit 1
          fi
          case "$version" in
            *v5.5.5*) ;;
            *) echo "::error title=Container is not v5.5.5::idf.py --version said $version"; exit 1 ;;
          esac

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # Host-side and independent of ESP-IDF. The firmware build also validates
      # its generated table against the declared 16 MB size; this check covers
      # every repository CSV before a toolchain starts.
      - name: Partition table stays below the 16 MB addressing ceiling
        run: python3 tools/flash/partition_check.py

      # ADR-0016 section 1 says this is checked in CI, and the rule it states
      # was already broken when the ADR was written: sleep lived in one file and
      # the rail writes in another, with nothing joining them.
      - name: The power-owner check tests itself
        run: python3 tools/flash/one_power_owner.py --selftest

      # The bench flasher's plan (sorted offsets, RESTORE_SPAN, esptool argv)
      # is decided host-side before esptool is imported, so it is checkable here.
      - name: The no-reset flasher tests its plan
        run: python3 tools/flash/flash_no_reset.py --selftest

      - name: Sleep, wake arming and AXP2101 rails have one owner
        run: python3 tools/flash/one_power_owner.py .

      - name: Build the production image
        shell: bash
        run: |
          . "$IDF_PATH/export.sh"
          cd firmware
          # The build rewrites dependencies.lock in place, so the committed
          # copy is taken before anything runs. `git diff` cannot do this job
          # here, and the reason is worth writing down rather than leaving for
          # the next person to rediscover: the workspace is created by the
          # runner as one user and this step runs as another inside the
          # container, so git stops its discovery walk at the ownership
          # boundary and answers "Not a git repository". That is exactly what
          # the first version of this check did, on the pull request that
          # added it -- the check is compared against a file, not against the
          # index, for that reason and not by preference.
          cp dependencies.lock "$RUNNER_TEMP/dependencies.lock.committed"
          idf.py set-target esp32s3
          idf.py build
          # This is the job that decides whether a product image can answer an
          # unauthenticated USB host (#346). Two independent proofs, because
          # the configuration and the artefact can disagree: the generated
          # config must say the endpoint is off, and the linked ELF must not
          # contain the dispatcher every privileged opcode goes through.
          # Restoring CONFIG_ATTADIPA_WATCH_CONTROL=y to sdkconfig.defaults
          # turns this step red on both counts.
          grep -q "^# CONFIG_ATTADIPA_WATCH_CONTROL is not set$" sdkconfig
          python3 ../tools/flash/firmware_elf_check.py build/attadipa.elf
          # If the build resolved something other than what this repository
          # holds, the licence audit in DEPENDENCIES.md describes a graph
          # nobody is building -- so the drift is the failure, not the diff.
          #
          # It does not re-resolve on every build, and the comment that used to
          # say so was wrong. `is_solve_required()` returns false for a lock
          # that is still valid, so this catches a lock stale against a changed
          # manifest, target, IDF version or direct-dependency set -- not a new
          # `cmake_utilities 0.*` appearing in the registry. DEPENDENCIES.md,
          # "The lock is binding", has the sourced version.
          #
          # The decision lives in a script so that
          # `.github/tests/lock-drift-check-test.sh` can plant a moved version
          # and prove the gate goes red; as an inline block it was the one
          # check here that nothing checked.
          bash ../.github/scripts/lock-drift-check.sh \
            "$RUNNER_TEMP/dependencies.lock.committed" dependencies.lock
          # app_main owns the degraded-PSRAM diagnostic. Without this option,
          # ESP-IDF aborts before that diagnostic can run.
          grep -q "^CONFIG_SPIRAM_IGNORE_NOTFOUND=y$" sdkconfig

      - name: Build the development/HIL image
        shell: bash
        run: |
          . "$IDF_PATH/export.sh"
          cd firmware
          # -B and -DSDKCONFIG together, for the reason FIRMWARE_BRINGUP.md:86
          # records: idf.py keeps sdkconfig in the project directory, so
          # without them this silently rebuilds the production image and calls
          # it a HIL build.
          idf.py -B build-hil -DSDKCONFIG=build-hil/sdkconfig -DSDKCONFIG_DEFAULTS="sdkconfig.defaults;sdkconfig.hil" build
          grep -q "^CONFIG_ATTADIPA_WATCH_CONTROL=y$" build-hil/sdkconfig
          # This line used to check that sdkconfig.hil had not lost a copy of
          # the symbol. It now checks that `select LV_USE_SNAPSHOT` on
          # ATTADIPA_WATCH_CONTROL fires -- sdkconfig.hil no longer names it,
          # so the only way it can be `y` here is the select. Deleting the
          # select turns this red, which is the point: LVGL compiles
          # lv_snapshot_take_to_draw_buf() out under `n` and its own default
          # is `n`.
          grep -q "^CONFIG_LV_USE_SNAPSHOT=y$" build-hil/sdkconfig
          # The same check in the other direction: the bench image is required
          # to carry the endpoint, so a HIL build that quietly lost it is
          # caught here rather than at the bench.
          python3 ../tools/flash/firmware_elf_check.py --variant hil build-hil/attadipa.elf

      # Nothing else here selects CONFIG_ATTADIPA_BOARD_TWATCH_S3_PLUS, so
      # without this step twatch_board.cpp and the T-Watch branch of
      # board_power.cpp -- static_assert on the rail table included -- compile
      # only in a hand-run on the bench. Arm B (the vendor command table) is
      # behind its own symbol, default n, so it is built once more with the
      # symbol on: the code a bench session reaches for after arm C shows
      # nothing must not be code no compiler has read.
      - name: Build the T-Watch S3 Plus image, both panel arms
        shell: bash
        run: |
          . "$IDF_PATH/export.sh"
          cd firmware
          idf.py -B build-twatch -DSDKCONFIG=build-twatch/sdkconfig -DSDKCONFIG_DEFAULTS="sdkconfig.defaults;sdkconfig.twatch" build
          grep -q "^CONFIG_ATTADIPA_BOARD_TWATCH_S3_PLUS=y$" build-twatch/sdkconfig
          grep -q "^CONFIG_ESPTOOLPY_FLASHMODE_DIO=y$" build-twatch/sdkconfig
          # This generated-config check is the predicate for the twatch
          # attadipa_link exemption below: slice #417 deliberately disables
          # Bluetooth; the board itself is not claimed to lack it.
          grep -q "^# CONFIG_BT_ENABLED is not set$" build-twatch/sdkconfig
          python3 ../tools/flash/firmware_elf_check.py --variant twatch build-twatch/attadipa.elf
          echo "CONFIG_ATTADIPA_TWATCH_PANEL_VENDOR_TABLE=y" > "$RUNNER_TEMP/sdkconfig.armb"
          idf.py -B build-twatch-b -DSDKCONFIG=build-twatch-b/sdkconfig -DSDKCONFIG_DEFAULTS="sdkconfig.defaults;sdkconfig.twatch;$RUNNER_TEMP/sdkconfig.armb" build
          grep -q "^CONFIG_ATTADIPA_TWATCH_PANEL_VENDOR_TABLE=y$" build-twatch-b/sdkconfig
          # The GNSS bring-up bridge is stacked here for the reason the RAM job
          # gives for sdkconfig.i2cprobe: it is the same board's image plus an
          # instrument, so building it here is what stops gnss_bridge.cpp and
          # the BLDO1 branch of board_power.cpp from being code no compiler
          # reads until somebody is at the bench with the watch already open.
          idf.py -B build-twatch-gnss -DSDKCONFIG=build-twatch-gnss/sdkconfig -DSDKCONFIG_DEFAULTS="sdkconfig.defaults;sdkconfig.twatch;sdkconfig.gnssbridge" build
          grep -q "^CONFIG_ATTADIPA_GNSS_BRIDGE=y$" build-twatch-gnss/sdkconfig
          grep -q "^CONFIG_ATTADIPA_GNSS_BRIDGE_PASSTHROUGH=y$" build-twatch-gnss/sdkconfig

      # The builds that compile gnss/ for xtensa. The host suite builds the
      # parser for the machine it runs on; nothing else in this file reaches
      # local_gnss.cpp, the vendored minmea, or the -Dtimegm=mktime that the
      # shipping newlib makes necessary. They also exercise the composition
      # root's direct-link contract, which only fires when the layer is added --
      # now from both boards, since #442 made the receiver board-neutral and
      # local_gnss.cpp is in every image rather than the Waveshare's alone.
      - name: Build both images with the local GNSS receiver
        shell: bash
        run: |
          . "$IDF_PATH/export.sh"
          cd firmware
          idf.py -B build-gnss -DSDKCONFIG=build-gnss/sdkconfig -DSDKCONFIG_DEFAULTS="sdkconfig.defaults;sdkconfig.gnsslocal" build
          grep -q "^CONFIG_ATTADIPA_GNSS_LOCAL=y$" build-gnss/sdkconfig
          # The overlay names only the symbol since #442; these two are the
          # per-board defaults, so the greps now check that the Waveshare still
          # gets its own pair and not the T-Watch's.
          grep -q "^CONFIG_ATTADIPA_GNSS_LOCAL_RX=44$" build-gnss/sdkconfig
          grep -q "^CONFIG_ATTADIPA_GNSS_LOCAL_BAUD=115200$" build-gnss/sdkconfig
          # The same overlay on the other board, which is what #442 is for. This
          # is the only build that compiles local_gnss.cpp and gnss/ against the
          # T-Watch composition root, so without it the tick in twatch_board.cpp
          # and the widened BLDO1 branch of board_power.cpp are code no compiler
          # reads until somebody is at the bench with the watch already open.
          idf.py -B build-twatch-gnsslocal -DSDKCONFIG=build-twatch-gnsslocal/sdkconfig -DSDKCONFIG_DEFAULTS="sdkconfig.defaults;sdkconfig.twatch;sdkconfig.gnsslocal" build
          grep -q "^CONFIG_ATTADIPA_BOARD_TWATCH_S3_PLUS=y$" build-twatch-gnsslocal/sdkconfig
          grep -q "^CONFIG_ATTADIPA_GNSS_LOCAL_RX=41$" build-twatch-gnsslocal/sdkconfig
          grep -q "^CONFIG_ATTADIPA_GNSS_LOCAL_BAUD=38400$" build-twatch-gnsslocal/sdkconfig
          # The refusal itself, which is a Kconfig claim and therefore only true
          # if something asks. Stacking both overlays must leave the local
          # receiver off rather than putting two UART drivers on GPIO 41.
          idf.py -B build-twatch-gnssboth -DSDKCONFIG=build-twatch-gnssboth/sdkconfig -DSDKCONFIG_DEFAULTS="sdkconfig.defaults;sdkconfig.twatch;sdkconfig.gnssbridge;sdkconfig.gnsslocal" reconfigure
          grep -q "^CONFIG_ATTADIPA_GNSS_BRIDGE=y$" build-twatch-gnssboth/sdkconfig
          # Absent, not "is not set": Kconfig omits a symbol whose dependency is
          # unmet rather than writing it off, so the check is that the overlay
          # asked for it and the generated config carries no trace of it.
          if grep -q "ATTADIPA_GNSS_LOCAL" build-twatch-gnssboth/sdkconfig; then
            echo "::error title=The GNSS refusal did not fire::ATTADIPA_GNSS_LOCAL survived alongside ATTADIPA_GNSS_BRIDGE; both would drive GPIO 41"
            exit 1
          fi

      # The RAM route is the one proved to work on the received unit and the one
      # with nothing to undo, so it is the one a bench session reaches for first.
      # If it stops building, that is found here rather than at the bench.
      - name: Build the RAM-load variant
        shell: bash
        run: |
          . "$IDF_PATH/export.sh"
          cd firmware
          # sdkconfig.i2cprobe is stacked here rather than in a job of its own:
          # the bench image is the RAM route *plus* the probe, so this builds
          # what actually gets loaded, and i2c_probe.cpp cannot rot unnoticed.
          idf.py -B build-ram -DSDKCONFIG=build-ram/sdkconfig -DSDKCONFIG_DEFAULTS="sdkconfig.defaults;sdkconfig.ramprobe;sdkconfig.i2cprobe" build
          # idf.py keeps sdkconfig in the project directory, so without
          # the line above this silently rebuilds the flash image and
          # calls it a RAM build. Prove the option actually took.
          grep -q "^CONFIG_APP_BUILD_TYPE_PURE_RAM_APP=y$" build-ram/sdkconfig
          grep -q "^CONFIG_ATTADIPA_I2C_PROBE=y$" build-ram/sdkconfig
          python3 ../tools/flash/pure_ram_elf_check.py build-ram/attadipa.elf
          python3 ../tools/flash/firmware_elf_check.py --variant pure-ram build-ram/attadipa.elf

  required-ci:
    name: Required CI
    if: always()
    needs:
      - host-build
      - strict-warnings
      - clang
      - sanitizers
      - workflows
      - docs
      - simulator
      - firmware-build
    runs-on: ubuntu-latest
    steps:
      - name: Verify required jobs
        env:
          HOST_BUILD_RESULT: ${{ needs.host-build.result }}
          STRICT_WARNINGS_RESULT: ${{ needs.strict-warnings.result }}
          CLANG_RESULT: ${{ needs.clang.result }}
          SANITIZERS_RESULT: ${{ needs.sanitizers.result }}
          WORKFLOWS_RESULT: ${{ needs.workflows.result }}
          DOCS_RESULT: ${{ needs.docs.result }}
          SIMULATOR_RESULT: ${{ needs.simulator.result }}
          FIRMWARE_BUILD_RESULT: ${{ needs.firmware-build.result }}
        run: |
          set -uo pipefail
          failed=0
          for name in \
            HOST_BUILD_RESULT STRICT_WARNINGS_RESULT CLANG_RESULT \
            SANITIZERS_RESULT WORKFLOWS_RESULT DOCS_RESULT \
            SIMULATOR_RESULT FIRMWARE_BUILD_RESULT
          do
            result=${!name}
            if [ "$result" != success ]; then
              printf '%s=%s\n' "$name" "$result" >&2
              failed=1
            fi
          done
          exit "$failed"

  evidence:
    name: What this run did not prove
    runs-on: ubuntu-latest
    if: always()
    needs: [host-build, strict-warnings, clang, sanitizers, simulator, firmware-build]
    steps:
      # AGENTS.md's rule, made visible where people actually look. A green badge
      # reports each dependency's real result. A compile is still not evidence
      # about physical hardware, and the only reliable way to stop that being
      # forgotten is to write it down on every single run.
      - name: Say so
        run: |
          {
            echo "### Evidence level of this run"
            echo
            echo "| Target | Status |"
            echo "|---|---|"
            echo "| Host build, GCC and Clang | UNIT-TESTED |"
            echo "| Strict warnings, sanitizers | UNIT-TESTED |"
            echo "| Simulator, both geometries | SIMULATED |"
            echo "| ESP32-S3 firmware build (production, HIL and RAM variants) | CI job: \`${{ needs.firmware-build.result }}\` |"
            echo "| Anything on a physical board | **NOT EXECUTED — HARDWARE REQUIRED** |"
            echo
            echo "Power, timing and RF numbers are \`ESTIMATED\` or \`UNKNOWN\` until"
            echo "a hardware-in-the-loop plan in \`docs/testing/HIL_PLANS.md\` has been run."
          } >> "$GITHUB_STEP_SUMMARY"

# Still not present, and still deliberately not faked:
#
#   * second board    — the firmware job builds for the Waveshare only. The
#                       T-Watch is not available to this runner, and
#                       a matrix entry for a board nobody can boot would make
#                       this run look like it proved more than it did.
#   * formatting      — no repository-wide formatter contract exists yet
#   * hardware tests  — NOT EXECUTED, HARDWARE REQUIRED. There is no HIL runner,
#                       and a job that pretended otherwise would be worse than
#                       no job at all.
