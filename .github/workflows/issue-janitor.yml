name: Attadipa Issue Janitor

on:
  workflow_dispatch:
  schedule:
    - cron: '30 2 * * *'

permissions:
  issues: write
  contents: read

jobs:
  create-janitor-task:
    name: Queue issue janitor task
    runs-on: ubuntu-latest
    steps:
      - name: Create janitor issue
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue create \
            --repo "$GITHUB_REPOSITORY" \
            --title "Maintenance: review and clean stale issues" \
            --label "agent:ready" \
            --body """attadipa-agent-task

task_type: maintenance
priority: P3
producer: automation

Clean up GitHub Issues only.

Check open issues and close only those that are:
- already implemented in current main
- obsolete due to project direction changes
- duplicates of another issue

Do not create new issues.
Do not suggest new work.
Do not modify active tasks.

Return only a short summary of actions taken."""
