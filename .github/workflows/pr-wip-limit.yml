name: PR WIP limit

# How many pull requests are open, said out loud at the one moment it is still
# cheap to act on: when another one has just been opened.
#
# CLAUDE.md, "The queue has a width, and it is two" — owner decision OD-23,
# 2026-08-24, after this repository reached thirty-five open at once and spent
# more on re-reviewing branches that had gone stale waiting than on the work
# they carried.
#
# THIS DOES NOT REFUSE ANYTHING, and that is deliberate rather than unfinished.
# It holds no `contents` write, closes nothing and blocks no merge. Refusing the
# pull request would not reduce the queue — the branch and the work would still
# exist, and the only casualty would be the record of them. What breaks the loop
# is an agent reading a number before it starts the next task, so the number is
# what this produces.
#
# It is also not the whole guard. The check an agent is supposed to make is the
# one in CLAUDE.md, before opening anything; this is the backstop for when that
# did not happen, which on 2026-08-24 was thirty-five times in a row.

on:
  pull_request:
    types: [opened, reopened, ready_for_review]

concurrency:
  # One answer per pull request. The count changes under it constantly and an
  # old one is misleading, so a newer run always wins.
  group: attadipa-wip-limit-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions: {}

jobs:
  count:
    name: How wide is the queue
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: write
      issues: write
    # Two conditions, and the kill switch is the first of them. Every other
    # automation workflow here carries this gate, and CLAUDE_AUTOMATION.md opens
    # by promising "one shared kill switch" — a workflow that keeps commenting
    # and labelling after the switch is thrown makes that sentence false, model
    # or no model.
    #
    # The second: a fork's pull request cannot be counted against this
    # repository's queue — it is not in it — and pull_request_target, which
    # would give the token to do it anyway, is the pattern this repository
    # refuses everywhere else. That exclusion is applied to the number itself in
    # wip-limit.sh; this half only stops the run.
    if: >-
      vars.CLAUDE_AUTOMATION_ENABLED != 'false' &&
      github.event.pull_request.head.repo.full_name == github.repository
    steps:
      # Pinned to the default branch, and sparse, for the same reason the merge
      # sweep's checkout is. On `pull_request`, GITHUB_REF is refs/pull/N/merge,
      # so a bare checkout takes THE BRANCH UNDER REVIEW, and this job would
      # then run that branch's copy of the rule while holding
      # `pull-requests: write`. A pull request changing `-le 2` to `-le 20`
      # would report itself compliant, and one with `exit 1` in the body would
      # be green and silent for ever. The gate's rules come from `main` or from
      # nowhere — CLAUDE_AUTOMATION.md says so three times, and this is one of
      # the places that has to hold.
      #
      # refs/pull/N/merge also does not exist while a branch conflicts with
      # `main`, so a bare checkout would fail on `reopened` for exactly the
      # long-lived conflicted branches this guard exists to notice. The default
      # branch is always there. `persist-credentials: false` keeps a
      # write-scoped token out of `.git/config` beside it.
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          sparse-checkout: .github/scripts
          sparse-checkout-cone-mode: false
          persist-credentials: false

      - name: Count the open pull requests
        id: wip
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: bash .github/scripts/wip-limit.sh

      # Only when it is over, or when it could not be read at all. A comment on
      # every pull request saying the queue is fine is how a signal becomes
      # something people filter out, and this one has to still be readable the
      # day it says thirty-five. But `unknown` is not `ok`: an API failure and a
      # healthy queue must not produce the same silence, which is the rule
      # pr-merge-sweep.yml states as "an API failure and an empty repository
      # must not print the same line". Without this, a `gh` that fails leaves a
      # green check and nothing said anywhere a reader looks.
      - name: Say so on the pull request
        if: >-
          steps.wip.outputs.state == 'full' ||
          steps.wip.outputs.state == 'incident' ||
          steps.wip.outputs.state == 'unknown'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          STATE: ${{ steps.wip.outputs.state }}
          COUNT: ${{ steps.wip.outputs.count }}
          EXEMPT: ${{ steps.wip.outputs.exempt }}
        run: |
          set -euo pipefail
          body="$(bash .github/scripts/wip-limit.sh --say "$STATE" "$COUNT")"
          {
            echo "<!-- attadipa-wip-limit -->"
            echo "$body"
            echo
            echo "Counted: every open pull request of this repository's own, except those labelled \`queue:parked\` or \`queue:emergency\`. A draft counts. A fork's pull request does not."
            if [ "${EXEMPT:-0}" != "0" ] && [ -n "${EXEMPT:-}" ] && [ "${EXEMPT}" != "unknown" ]; then
              echo
              echo "**\`$EXEMPT\` further pull request(s) were subtracted as exempt, and this guard took that on trust.** It reads the label and not the reason for it, and every agent here can apply one. If that number is not what you expected, the count above is not the queue."
            fi
            echo
            echo "This does not block this pull request. It is the number the next agent is supposed to read before opening one."
          } > body.md

          # Once per pull request, not once per event. The triggers include
          # `reopened` and `ready_for_review`, so a draft opened during an
          # incident and later marked ready by a person would otherwise carry
          # two identical walls of text, and a reopen three. The marker written
          # at the top of the body is what bounds it -- the same idiom
          # approval-stall-decision.sh uses.
          said="$(gh pr view "$PR" --repo "$REPO" --json comments                     --jq '[ .comments[].body ] | any(contains("<!-- attadipa-wip-limit -->"))'                   2>/dev/null || echo "false")"
          if [ "$said" = "true" ]; then
            echo "::notice::Already said on this pull request; not repeating it."
          else
            gh pr comment "$PR" --repo "$REPO" --body-file body.md
          fi

          # The label is for having crossed the line, so an unreadable count
          # must not apply it -- that would record a verdict never reached.
          # Reported rather than swallowed: `|| true` alone is how a label that
          # does not exist becomes a guard that silently marks nothing, which is
          # what happened before setup-labels.sh was run for the queue: set.
          if [ "$STATE" = "full" ] || [ "$STATE" = "incident" ]; then
            if ! gh pr edit "$PR" --repo "$REPO" --add-label queue:over-limit; then
              echo "::warning::Could not apply queue:over-limit to #$PR. If the label is missing, run .github/scripts/setup-labels.sh."
            fi
          fi

      - name: Summary
        if: always()
        env:
          STATE: ${{ steps.wip.outputs.state }}
          COUNT: ${{ steps.wip.outputs.count }}
        run: |
          set -euo pipefail
          printf 'Open working pull requests: %s (%s)\n' "${COUNT:-unknown}" "${STATE:-unknown}" >> "$GITHUB_STEP_SUMMARY"
