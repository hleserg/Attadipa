name: Claude agent

# The intake end of the loop: a task arrives as a GitHub issue and an agent
# picks it up without anybody carrying it there by hand.
#
# docs/automation/AI_TASK_PROTOCOL.md is the contract this implements, and
# docs/automation/CLAUDE_AUTOMATION.md explains the security model and the kill
# switch. Read one of those before changing this file — several of the guards
# here look redundant and are not.

on:
  issues:
    types: [opened, reopened, assigned, labeled]
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  pull_request_review:
    types: [submitted]
  workflow_dispatch:
    inputs:
      issue_number:
        description: "Issue number to work on"
        required: true
        type: string

# THE ONE WRITER RULE LIVES ON THE `agent` JOB, NOT HERE, AND THAT IS THE FIX
# FOR A DEFECT RATHER THAN A PREFERENCE.
#
# It was a workflow-level group until 2026-08-22, which put the intake gate
# inside it too. `cancel-in-progress: false` protects a RUNNING member of a
# group; it does not protect a PENDING one. GitHub keeps at most one run queued
# per group and cancels the previously pending run when a newer one arrives —
# so a burst of events loses all but the last, before anything has looked at
# them.
#
# Observed: at 07:18 on 2026-08-22 the owner labelled #26, #27 and #28
# `agent:ready`, nine `issues` events fired, six runs were cancelled while
# pending, and the three that survived were the ones carrying an unrelated
# label. Three tasks were queued and no agent started. Nothing was red and
# nothing said so; the hourly watchdog would have recovered them one per hour.
#
# The gate is a few seconds of shell and has nothing to serialise, so it now
# runs for every event. The group is on the job that writes code, which is what
# the rule was ever about, and the claim moved inside that job so a queued
# agent that gets cancelled leaves no `agent:working` label behind — an
# unclaimed task is picked up again, a falsely claimed one is not.
#
# THIS NARROWS THE RACE; IT DOES NOT REMOVE IT, and saying so is the difference
# between a bound and a belief. GitHub's rule still applies to the `agent` job's
# own group, so two tasks accepted close together can still cost the earlier one
# its queued run. What changed is the consequence: it is then an unclaimed
# `agent:ready` issue, which `agent-queue-watchdog.yml` rediscovers on its next
# hourly tick. The residual failure is a delay of up to about an hour, not a
# lost task — and that recovery is only true for tasks the watchdog's own filter
# in .github/scripts/queue-scan.jq can see, which is why that filter and the
# gate must keep agreeing about what a task looks like.

# Nothing at the top level. Each job asks for exactly what it needs.
permissions: {}

# THE QUEUE WIDTH REACHES THE GATE FROM HERE, and from nowhere else. Every step
# in this file inherits it, so a step added later that runs `wip-limit.sh` --
# directly or through `writer-admission.sh` -- cannot silently fall back to the
# designed width while the repository setting says otherwise. Unset is 2; see
# `.github/scripts/wip-limit.sh`.
env:
  ATTADIPA_WIP_LIMIT: ${{ vars.ATTADIPA_WIP_LIMIT }}

jobs:
  gate:
    name: Should an agent run
    runs-on: ubuntu-latest
    permissions:
      issues: read
      pull-requests: read
      contents: read
    outputs:
      run: ${{ steps.decide.outputs.run }}
      # Writer capacity, carried out of the gate rather than consulted again.
      # `run` now means ACCEPTED and these two mean MAY START NOW; before #293
      # one output tried to mean both, and the case where they disagree --
      # accepted, no capacity -- had nowhere to be said.
      admission: ${{ steps.admission.outputs.state }}
      admission_allow: ${{ steps.admission.outputs.allow }}
      admission_count: ${{ steps.admission.outputs.count }}
      issue: ${{ steps.decide.outputs.issue }}
      # "pr" or "issue". Empty only on the paths that refuse before the issue is
      # fetched, and those start none of the jobs that read it.
      target_kind: ${{ steps.decide.outputs.target_kind }}
      task_type: ${{ steps.decide.outputs.task_type }}
      priority: ${{ steps.decide.outputs.priority }}
      producer: ${{ steps.decide.outputs.producer }}
      research_only: ${{ steps.decide.outputs.research_only }}
      reason: ${{ steps.decide.outputs.reason }}
      reviewed_head: ${{ steps.decide.outputs.reviewed_head }}
      head_moved: ${{ steps.decide.outputs.head_moved }}
      staleness: ${{ steps.decide.outputs.staleness }}
      refused_marker: ${{ steps.decide.outputs.refused_marker }}
      refusal_kind: ${{ steps.decide.outputs.refusal_kind }}
      refusal: ${{ steps.decide.outputs.refusal }}
    steps:
      - name: Kill switch
        id: switch
        env:
          ENABLED: ${{ vars.CLAUDE_AUTOMATION_ENABLED }}
        run: |
          # Unset reads as enabled, so a fresh clone of this repository is not
          # silently inert. Setting the repository variable to exactly "false"
          # stops every Anthropic-billed step in every workflow while leaving
          # ordinary CI running — see docs/automation/RECOVERY.md.
          if [ "$ENABLED" = "false" ]; then
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::notice::CLAUDE_AUTOMATION_ENABLED is false. Not invoking Claude."
          else
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          fi

      # The decision logic lives in .github/scripts/intake-decision.sh so that it
      # can be executed and tested — .github/tests/intake-gate-test.sh runs it
      # over sixteen cases including real refusals, and CI runs that test. Logic
      # transcribed into a second file drifts from the first; logic in one file
      # sourced by both cannot.
      #
      # ref is pinned to the default branch on purpose. For a
      # pull_request_review_comment event GITHUB_REF is refs/pull/N/merge, so a
      # plain checkout would fetch a fork's version of the very script that
      # decides whether a write-capable agent may run. The gate's rules come
      # from main or from nowhere.
      - name: Fetch the gate logic from the default branch
        if: steps.switch.outputs.enabled == 'true'
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          sparse-checkout: .github/scripts
          sparse-checkout-cone-mode: false
          persist-credentials: false

      - name: Check writer admission
        id: admission
        if: steps.switch.outputs.enabled == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          ISSUE: ${{ github.event.issue.number || github.event.pull_request.number || inputs.issue_number }}
        run: |
          set -euo pipefail
          bash ".github/scripts/writer-admission.sh" "$REPO" "$ISSUE"

      # DECIDE BEFORE ADMIT, AND THE ORDER IS THE FIX FOR #293.
      #
      # This step used to carry `&& steps.admission.outputs.allow == 'true'`.
      # When the queue was full it was skipped, so it wrote no outputs at all --
      # not `run=true`, not `run=false`, not a refusal. Every downstream job is
      # conditional on one of those, so the whole workflow finished green and
      # silent. Run 33048001621 lost the owner's verified NVS/RTC finding on
      # #264 that way: ten seconds, success, no reaction, no comment, no label,
      # nothing for the watchdog to rediscover.
      #
      # Admission still decides whether a writer STARTS -- on the `agent` job's
      # own `if`, and again under the lease inside it. What it no longer decides
      # is whether the request is answered at all.
      - name: Decide
        id: decide
        if: steps.switch.outputs.enabled == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          EVENT_NAME: ${{ github.event_name }}
          ACTOR: ${{ github.actor }}
          # Untrusted text never reaches a shell expansion directly. Interpolating
          # ${{ github.event.issue.body }} into a run: block is a script injection
          # with the attacker holding the pen, and on a public repository anybody
          # can open an issue.
          ISSUE_NUMBER: ${{ github.event.issue.number || github.event.pull_request.number || inputs.issue_number }}
          COMMENT_BODY: ${{ github.event.comment.body || github.event.review.body || '' }}
          LABEL_NAME: ${{ github.event.label.name || '' }}
          ACTION: ${{ github.event.action }}
          # Comma-separated GitHub App logins the owner has named as producing
          # agents, e.g. `chatgpt-codex-connector[bot]`. Empty by default, and
          # empty is exactly the old behaviour. Read as a variable rather than
          # hard-coded because which producer files the tasks is an operational
          # decision, not a property of this code — and because changing it must
          # not require a pull request that edits the security boundary.
          TRUSTED_PRODUCERS: ${{ vars.ATTADIPA_TRUSTED_PRODUCERS }}
        run: |
          set -euo pipefail

          say() { echo "run=false" >> "$GITHUB_OUTPUT"; echo "reason=$1" >> "$GITHUB_OUTPUT"; echo "::notice::$1"; }

          if [ -z "${ISSUE_NUMBER:-}" ]; then
            say "no issue or pull request number in this event"; exit 0
          fi

          # The one fact the decision needs that cannot be decided offline: what
          # permission this actor actually holds. `producer: chatgpt` in a task
          # marker is a data field anybody can type; write access is not.
          PERMISSION=dispatch
          if [ "$EVENT_NAME" != "workflow_dispatch" ]; then
            PERMISSION=$(gh api "repos/$REPO/collaborators/$ACTOR/permission" --jq .permission 2>/dev/null || echo none)
          fi

          # Read the task from the API rather than from the event payload, which
          # is a snapshot of whatever the issue said when the event fired.
          gh api "repos/$REPO/issues/$ISSUE_NUMBER" > /tmp/issue.json

          # WHICH OBJECT THIS IS, decided once and carried out of the gate.
          # Three of the five triggers fire on pull requests, so `issue` is a
          # pull request number roughly whenever an agent starts from one, and
          # `gh issue edit` does not resolve those -- .github/scripts/gh-label.sh
          # has the whole argument in its header. Every later step that touches
          # a label used to re-derive this or, worse, not ask; the JSON is
          # already here, so it is answered here and read from the gate output.
          TARGET_KIND=$(jq -r 'if .pull_request then "pr" else "issue" end' /tmp/issue.json)
          case "$TARGET_KIND" in pr|issue) ;; *) TARGET_KIND=issue ;; esac
          echo "target_kind=$TARGET_KIND" >> "$GITHUB_OUTPUT"

          BODY=$(jq -r '.body // ""' /tmp/issue.json)
          LABELS=$(jq -r '[.labels[].name] | join(",")' /tmp/issue.json)
          STATE=$(jq -r '.state' /tmp/issue.json)

          # BODY and COMMENT_BODY are different texts and both are needed. BODY is
          # the issue, and it carries the marker; COMMENT_BODY is what was just
          # said, and on a comment event it is the only place `@claude` can be.
          #
          # This call used to stop at $PERMISSION plus the producer list, and the
          # gate's own `@claude` check therefore ran against the ISSUE body on
          # comment events. Every mention this repository ever received was
          # refused with "nothing asks for an agent" — the owner's included, on
          # #41 at 00:54 on 2026-08-22, which is the run that found this. The
          # gate was right about the text it was given. It was given the wrong
          # text.
          VERDICT=$(bash .github/scripts/intake-decision.sh \
            "$ACTOR" "$EVENT_NAME" "$ACTION" "$LABEL_NAME" \
            "$BODY" "$LABELS" "$STATE" "$PERMISSION" "${TRUSTED_PRODUCERS:-}" \
            "$COMMENT_BODY")
          if [ "$VERDICT" != "accept" ]; then
            say "#$ISSUE_NUMBER ${VERDICT#reject: }"

            # A refusal that only reaches the run log is the failure mode this
            # whole queue exists to remove. Most refusals are ordinary — an issue
            # with no marker, a task somebody already claimed — and commenting on
            # those would be noise. But an issue that DOES carry a task marker and
            # is still refused is a producer that believes it has filed work and a
            # repository that has silently dropped it. That one gets said out loud,
            # on the issue, where the person who filed it is looking.
            #
            # Only on `issues` events: a refused comment would otherwise draw a
            # comment per comment. This costs nothing from Anthropic either way —
            # it is a gh call in the gate, not an agent run.
            #
            # There is a second shape, and it is the one a person actually
            # notices: somebody with write access typed `@claude` and nothing
            # happened. Before 2026-08-22 that was the commonest event on this
            # repository and it was answered with silence, which reads exactly
            # like an agent that is thinking. It is not more expensive to say so
            # — this job holds no Anthropic credential and posts with `gh`.
            ANSWER=none
            case "$BODY" in
              *attadipa-agent-task*)
                if [ "$EVENT_NAME" = "issues" ]; then ANSWER=marker; fi ;;
            esac
            if [ "$ANSWER" = none ]; then
              case "$EVENT_NAME" in
                issue_comment|pull_request_review_comment|pull_request_review)
                  # Bots never get an answer: two automations apologising to
                  # each other is the loop this gate exists to prevent, and the
                  # only thing keeping it cheap is that neither of them replies.
                  # Write access only, for the same reason the gate needs it —
                  # on a public repository anybody can type `@claude`, and a
                  # reply each time is a megaphone attached to a stranger.
                  case "$ACTOR" in
                    *"[bot]") ;;
                    *)
                      case "$PERMISSION" in
                        admin|maintain|write)
                          # The same question rule 3 asks, asked the same way —
                          # a mention inside a code span is somebody writing
                          # about the agent, and answering it would be a bot
                          # replying to documentation.
                          if bash .github/scripts/intake-decision.sh \
                               --mentions "$COMMENT_BODY"; then
                            ANSWER=mention
                          fi ;;
                      esac ;;
                  esac ;;
              esac
            fi
            if [ "$ANSWER" != none ]; then
              {
                echo "refused_marker=true"
                echo "refusal_kind=$ANSWER"
                echo "issue=$ISSUE_NUMBER"
                echo "refusal=${VERDICT#reject: }"
              } >> "$GITHUB_OUTPUT"
            fi
            exit 0
          fi

          # The marker fields decide what KIND of work this is. They never
          # decide whether there is any — that was settled above, by write
          # access. See docs/automation/AI_TASK_PROTOCOL.md.
          field() {
            printf '%s' "$BODY" | sed -n "s/^[[:space:]]*$1:[[:space:]]*\\([A-Za-z0-9._-]*\\).*/\\1/p" | head -1
          }
          TASK_TYPE=$(field task_type); TASK_TYPE=${TASK_TYPE:-unspecified}
          PRIORITY=$(field priority);  PRIORITY=${PRIORITY:-P2}
          PRODUCER=$(field producer);  PRODUCER=${PRODUCER:-owner}

          RESEARCH_ONLY=false
          case "$TASK_TYPE" in
            next-task-research|upstream-intelligence|readiness-audit) RESEARCH_ONLY=true ;;
          esac

          # reviewed_head: has the tree moved since the producer looked at it?
          #
          # AI_TASK_PROTOCOL.md has always specified this field, and until now
          # nothing read it. That is the quietest way for this queue to do damage:
          # a finding produced against a commit that has since been fixed gets
          # implemented anyway, because the agent had no reason to doubt it. The
          # comparison is one API call and no checkout — the gate job only
          # sparse-checks out .github/scripts, so there is no history here to
          # `git log` against.
          REVIEWED_HEAD=$(field reviewed_head)
          DEFAULT_BRANCH="${{ github.event.repository.default_branch }}"
          DEFAULT_BRANCH=${DEFAULT_BRANCH:-main}
          HEAD_MOVED=unknown
          STALENESS="reviewed_head was not given, so nothing can be said about what has changed since."
          if [ -n "$REVIEWED_HEAD" ]; then
            CMP=$(gh api "repos/$REPO/compare/$REVIEWED_HEAD...$DEFAULT_BRANCH" 2>/dev/null || echo '')
            if [ -n "$CMP" ]; then
              HEAD_MOVED=$(printf '%s' "$CMP" | jq -r '.ahead_by // "unknown"')
              # How many files, and where — not a truncated list. The filter
              # lives in .github/scripts/compare-summary.jq rather than here,
              # for the reason its header gives and the reason
              # intake-decision.sh and queue-scan.jq already live in files:
              # logic inside a `run:` block cannot be executed by a test, so
              # the fixtures it was checked against exist only in somebody's
              # terminal. .github/tests/compare-summary-test.sh runs it over
              # every shape, and CI runs that.
              CHANGED=$(printf '%s' "$CMP" | jq -r -f .github/scripts/compare-summary.jq)
              if [ "$HEAD_MOVED" = "0" ]; then
                STALENESS="reviewed_head $REVIEWED_HEAD is still the tip of $DEFAULT_BRANCH. The finding was made against current code."
              else
                STALENESS="$DEFAULT_BRANCH is $HEAD_MOVED commit(s) ahead of the reviewed commit $REVIEWED_HEAD. $CHANGED"
              fi
            else
              STALENESS="reviewed_head $REVIEWED_HEAD could not be compared against $DEFAULT_BRANCH — it is not a commit in this repository."
            fi
          fi
          echo "::notice::reviewed_head=$REVIEWED_HEAD ahead_by=$HEAD_MOVED"

          {
            echo "run=true"
            echo "issue=$ISSUE_NUMBER"
            echo "task_type=$TASK_TYPE"
            echo "priority=$PRIORITY"
            echo "producer=$PRODUCER"
            echo "research_only=$RESEARCH_ONLY"
            echo "reason=accepted"
            echo "reviewed_head=${REVIEWED_HEAD:-unspecified}"
            echo "head_moved=$HEAD_MOVED"
            echo "staleness=$STALENESS"
          } >> "$GITHUB_OUTPUT"
          echo "::notice::accepted #$ISSUE_NUMBER type=$TASK_TYPE priority=$PRIORITY producer=$PRODUCER"

  acknowledge:
    # THE RECEIPT. Somebody asked for an agent; they hear back in seconds.
    #
    # Its own job, and that is the point rather than tidiness. It does not sit
    # in the writer concurrency group, so it answers even while another task is
    # being written; it does not wait for the checkout or the credential check,
    # so it answers before the agent has read a line; and it is not the agent,
    # so it can still speak in the one case the agent cannot — the run that
    # never starts.
    #
    # It also cannot loop. The comment and the reaction are written with the
    # built-in GITHUB_TOKEN, and GitHub deliberately does not start workflow
    # runs from events that token creates.
    name: Say it was accepted
    needs: gate
    if: needs.gate.outputs.run == 'true'
    # Two outcomes now reach this job, and the reaction below is common to both:
    # somebody asked and was heard. Which comment follows is decided per step.
    runs-on: ubuntu-latest
    permissions:
      issues: write
      pull-requests: write
      contents: read
    steps:
      - name: Fetch the wording from the default branch
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          sparse-checkout: .github/scripts
          sparse-checkout-cone-mode: false
          persist-credentials: false

      - name: React to the comment that asked
        # The fastest possible signal, and the only one that appears on the
        # comment itself rather than below it. A person who wrote `@claude` and
        # sees eyes on it within seconds knows the pipeline is alive, before any
        # comment renders and without opening a run.
        #
        # Only comment events have something to react to; a label has no author
        # and no reaction target, which is why this step is conditional rather
        # than defensive.
        if: github.event.comment.id != ''
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          COMMENT_ID: ${{ github.event.comment.id }}
          # pull_request_review_comment lives under a different collection than
          # issue_comment, and posting to the wrong one is a 404 rather than a
          # wrong reaction.
          KIND: ${{ github.event_name }}
        run: |
          set -euo pipefail
          case "$KIND" in
            pull_request_review_comment) path="pulls/comments" ;;
            *)                           path="issues/comments" ;;
          esac
          gh api --method POST "repos/$REPO/$path/$COMMENT_ID/reactions" \
            -f content=eyes --silent
          echo "::notice::reacted to comment $COMMENT_ID"

      - name: Say what was understood
        if: needs.gate.outputs.admission_allow == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          ISSUE: ${{ needs.gate.outputs.issue }}
          TASK_TYPE: ${{ needs.gate.outputs.task_type }}
          PRIORITY: ${{ needs.gate.outputs.priority }}
          RESEARCH_ONLY: ${{ needs.gate.outputs.research_only }}
          TRIGGER: ${{ github.event_name }}
          ACTOR: ${{ github.actor }}
          # Suppressed only when there was nothing to say — that is, when the
          # producer gave no reviewed_head at all, which is the common case and
          # is noise on an issue.
          #
          # Keyed on reviewed_head rather than on head_moved, and the difference
          # is a real one the review on #58 caught: head_moved stays `unknown`
          # BOTH when the field was absent and when it was present but could not
          # be compared, and the second is exactly the case worth saying out
          # loud. A producer that filed a truncated or foreign SHA should hear
          # so on the issue, not only in a run log nobody opens.
          STALENESS: ${{ needs.gate.outputs.reviewed_head != 'unspecified' && needs.gate.outputs.staleness || '' }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          bash .github/scripts/agent-say.sh receipt \
            "$RUN_URL" "$TASK_TYPE" "$PRIORITY" "$RESEARCH_ONLY" \
            "$TRIGGER" "$ACTOR" "$STALENESS" > /tmp/receipt.md
          gh issue comment "$ISSUE" --repo "$REPO" --body-file /tmp/receipt.md

      # ACCEPTED, AND NOT STARTED. The other half of #293: one visible receipt
      # naming the admission reason, plus the durable signal that brings the
      # task back without anybody retyping it.
      - name: Say it is deferred
        if: needs.gate.outputs.admission_allow != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          ISSUE: ${{ needs.gate.outputs.issue }}
          TARGET_KIND: ${{ needs.gate.outputs.target_kind }}
          TASK_TYPE: ${{ needs.gate.outputs.task_type }}
          PRIORITY: ${{ needs.gate.outputs.priority }}
          STATE: ${{ needs.gate.outputs.admission }}
          COUNT: ${{ needs.gate.outputs.admission_count }}
          TRIGGER: ${{ github.event_name }}
          ACTOR: ${{ github.actor }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail

          # `agent:ready` is the queue's own durable signal and the watchdog
          # already reads it -- no new label, no new mechanism. But the label is
          # only worth adding where the watchdog can act on it, and there are
          # THREE ways it cannot. Asking one of the three and adding the label
          # anyway is an inert label promising a pickup that will not happen,
          # which is the failure this step exists to avoid, not to commit.
          #
          #   1. The target is a pull request. `queue-scan.jq` is
          #      `select(.pull_request == null)`: the watchdog never picks one
          #      up, at any priority, ever.
          #   2. The target carries a state label. queue-scan.jq drops
          #      agent:review and agent:blocked outright, and
          #      intake-decision.sh rejects a workflow_dispatch carrying either.
          #   3. The deferral was not about capacity. `parked` is an owner hold
          #      and wip-limit.sh exempts a parked pull request from the count
          #      entirely, so nothing about draining the queue lifts it; the
          #      owner does, by removing the label.
          #
          # REQUEUED is a reason, not a flag, because the receipt has to say
          # WHICH of the three applies -- a reader told only "not requeued"
          # cannot tell an owner hold from a task under review.
          # shellcheck source=.github/scripts/gh-label.sh
          # shellcheck disable=SC1091
          . .github/scripts/gh-label.sh

          LABELS=$(gh api "repos/$REPO/issues/$ISSUE" --jq '[.labels[].name] | join(",")')
          REQUEUED=true
          case ",$LABELS," in
            *,agent:working,*|*,agent:review,*|*,agent:blocked,*) REQUEUED=state-label ;;
          esac
          if [ "$REQUEUED" = true ] && [ "$TARGET_KIND" = pr ]; then
            REQUEUED=pull-request
          fi
          if [ "$REQUEUED" = true ]; then
            case "$STATE" in
              full|incident|unknown) ;;
              *) REQUEUED=not-capacity ;;
            esac
          fi
          if [ "$REQUEUED" = true ]; then
            attadipa_label_edit "$TARGET_KIND" "$ISSUE" "$REPO" --add-label agent:ready
          fi

          # No agent:working and no claim: this task was never started, and a
          # label saying otherwise is what the two-hour watchdog would have to
          # clean up. Written with GITHUB_TOKEN, whose events GitHub does not
          # use to start workflow runs, so neither the label nor the comment
          # can loop back into this gate.
          bash .github/scripts/agent-say.sh deferred \
            "$RUN_URL" "$TASK_TYPE" "$PRIORITY" "$TRIGGER" "$ACTOR" \
            "$STATE" "$COUNT" "$REQUEUED" > /tmp/deferred.md
          # `gh issue comment` does resolve a pull request today. Relying on that
          # is relying on the accident gh-label.sh's header says not to rely on,
          # and this step is now three lines away from a call that does not
          # share it.
          attadipa_label_comment "$TARGET_KIND" "$ISSUE" "$REPO" --body-file /tmp/deferred.md
          echo "::notice::deferred #$ISSUE ($TARGET_KIND) admission=$STATE requeued=$REQUEUED"

  refused:
    name: Say why it was refused
    needs: gate
    if: needs.gate.outputs.refused_marker == 'true'
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Comment once
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          # From the gate, not from the event: a pull_request_review_comment has
          # no github.event.issue at all, and this job now answers those too.
          ISSUE: ${{ needs.gate.outputs.issue }}
          KIND: ${{ needs.gate.outputs.refusal_kind }}
          REFUSAL: ${{ needs.gate.outputs.refusal }}
          ACTOR: ${{ github.actor }}
        run: |
          set -euo pipefail

          # Once per issue per shape. The HTML marker is what makes that
          # checkable, and the comment is posted with the built-in GITHUB_TOKEN,
          # whose events GitHub deliberately does not use to start workflow runs
          # — so this cannot start another gate run and cannot loop.
          case "$KIND" in
            mention) TAG=attadipa-mention-refused ;;
            *)       TAG=attadipa-intake-refused ;;
          esac
          EXISTING=$(gh api "repos/$REPO/issues/$ISSUE/comments" --paginate \
                       --jq "[.[] | select(.body | test(\"$TAG\"))] | length")
          if [ "$EXISTING" != "0" ]; then
            echo "::notice::already explained on #$ISSUE"; exit 0
          fi

          # Somebody with write access asked for an agent by name and did not get
          # one. That deserves the actual reason rather than the marker lecture,
          # which is about a producer's task and not about their sentence.
          if [ "$KIND" = mention ]; then
            {
              echo "<!-- $TAG -->"
              echo "**You mentioned \`@claude\` here and no agent was started.** The reason:"
              echo
              echo "> $REFUSAL"
              echo
              echo "Nothing is queued. The two causes that produce this in practice:"
              echo
              echo "* **the issue is closed** — the gate refuses closed issues, because a task"
              echo "  nobody can see the state of is worse than no task. Reopen it and mention"
              echo "  \`@claude\` again;"
              echo "* **the mention was edited in afterwards** — GitHub raises no event this"
              echo "  workflow listens to when a comment is edited, so only a new comment"
              echo "  counts."
              echo
              echo "Either way this is a state problem, not a refusal of the request. Adding the"
              echo "\`agent:ready\` label also queues it, and the hourly watchdog will pick it up"
              echo "even if no event fires at all."
            } > /tmp/refused.md
            gh issue comment "$ISSUE" --repo "$REPO" --body-file /tmp/refused.md
            exit 0
          fi

          {
            echo "<!-- $TAG -->"
            echo "**This issue carries a \`attadipa-agent-task\` marker, and the intake gate refused it.**"
            echo
            echo "> $REFUSAL"
            echo
            echo "Nothing is queued and no agent will pick this up. The marker is data, not a"
            echo "permission — see [AI_TASK_PROTOCOL](../blob/HEAD/docs/automation/AI_TASK_PROTOCOL.md#the-marker-is-data-not-a-permission)."
            echo
            echo "The usual causes, in order of likelihood:"
            echo
            echo "1. **The producer posted as a GitHub App.** The gate rejects any actor whose"
            echo "   login ends in \`[bot]\`, because a Claude comment that mentions \`@claude\`"
            echo "   would otherwise start a Claude run that comments. A producing agent must"
            echo "   file through an ordinary user account."
            echo "2. **The actor lacks write access.** \`write\`, \`maintain\` or \`admin\` is"
            echo "   required. The actor on this event was \`$ACTOR\`."
            echo "3. **The task is already claimed.** A state label suppresses a second pickup."
            echo
            echo "To queue it deliberately, someone with write access can comment \`@claude\`,"
            echo "or run the \`Claude agent\` workflow with this issue number."
          } > /tmp/refused.md
          gh issue comment "$ISSUE" --repo "$REPO" --body-file /tmp/refused.md
          gh issue edit "$ISSUE" --repo "$REPO" --add-label needs-owner || true


  agent:
    name: Claude
    needs: gate
    # Both halves, and the second one is not redundant with the recheck inside
    # this job. The writer concurrency group below keeps at most one PENDING
    # run and cancels the older one when a newer arrives, so a run that enters
    # the group only to discover it has no capacity spends the single pending
    # slot on a no-op and can evict a task that did have one.
    if: needs.gate.outputs.run == 'true' && needs.gate.outputs.admission_allow == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    # One writer. Two agents editing one checkout is a merge conflict with a
    # robot on both ends, so a second accepted task waits here rather than
    # racing. cancel-in-progress is false because cancelling a writer mid-run
    # leaves a half-pushed branch behind; see the note at the top of this file
    # for why the group is on this job and not on the workflow.
    concurrency:
      group: attadipa-agent-writer
      cancel-in-progress: false
    permissions:
      contents: write
      pull-requests: write
      issues: write
      actions: read
      # id-token: write is not optional, and the reason is easy to miss.
      #
      # github_token below is ATTADIPA_AGENT_TOKEN, which is deliberately allowed
      # to be empty — see docs/automation/CLAUDE_AUTOMATION.md. When it is, the
      # action authenticates as the Claude GitHub App by exchanging this
      # workflow's GitHub OIDC token for an installation token, and without this
      # permission that exchange fails with "Unable to get
      # ACTIONS_ID_TOKEN_REQUEST_URL". The failure looks like an authentication
      # problem with the Anthropic credential and is not one.
      id-token: write
    steps:
      # The claim is the first thing this job does, and it is inside this job
      # rather than in one of its own so that it happens if and only if the
      # writer actually starts. A separate job could label an issue
      # `agent:working` and then have its agent cancelled while queued, leaving
      # a claim with nobody behind it — which the watchdog only notices two
      # hours later.
      - name: Acquire exclusive claim
        id: claim
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          ISSUE: ${{ needs.gate.outputs.issue }}
          TARGET_KIND: ${{ needs.gate.outputs.target_kind }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          CLAIM_HOLDER: agent-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          set -euo pipefail
          for script in claim.sh writer-admission.sh wip-limit.sh; do
            gh api "repos/$REPO/contents/.github/scripts/$script?ref=$DEFAULT_BRANCH" --jq .content \
              | base64 --decode > "/tmp/$script"
          done
          set +e
          bash /tmp/claim.sh acquire "$REPO" writer "$CLAIM_HOLDER"
          rc=$?
          set -e
          case "$rc" in
            0) ;;
            3) echo "acquired=false" >> "$GITHUB_OUTPUT"; echo "::notice::Another writer holds the repository; this run is held"; exit 0 ;;
            *) echo "::error::Could not establish repository writer lease"; exit "$rc" ;;
          esac

          : > /tmp/admission-output
          GITHUB_OUTPUT=/tmp/admission-output bash /tmp/writer-admission.sh "$REPO" "$ISSUE"
          if [ "$(sed -n 's/^allow=//p' /tmp/admission-output)" != true ]; then
            bash /tmp/claim.sh release "$REPO" writer "$CLAIM_HOLDER" || true
            echo "acquired=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Writer held by $(sed -n 's/^state=//p' /tmp/admission-output) admission"
            # THE RACE THE GATE'S OWN CHECK CANNOT COVER: capacity was there
            # when the gate looked and is gone now, so the receipt above
            # already said an agent was working. Leaving only a run-log notice
            # here is the same silent drop #293 is about, one step later. The
            # issue was never claimed at this point -- the issue-level claim is
            # the next statement -- so agent:ready is true rather than
            # decorative, and it is what the watchdog rediscovers.
            #
            # ON AN ISSUE. `queue-scan.jq` is `select(.pull_request == null)`,
            # so on a pull request the watchdog never comes and the label is
            # decorative; and a bare `gh issue edit ... || true` would not even
            # have applied it, silently, which is the outcome the paragraph
            # above claims to remove. The split is written out rather than
            # sourced because this step runs before the checkout, exactly as
            # `Normalise labels` does and for the same reason.
            if [ "${TARGET_KIND:-issue}" = issue ]; then
              gh issue edit "$ISSUE" --repo "$REPO" --add-label agent:ready || true
            else
              echo "::notice::#$ISSUE is a pull request; queue-scan.jq never picks one up, so agent:ready is not added"
            fi
            exit 0
          fi

          set +e
          bash /tmp/claim.sh acquire "$REPO" "$ISSUE" "$CLAIM_HOLDER"
          rc=$?
          set -e
          case "$rc" in
            0) echo "acquired=true" >> "$GITHUB_OUTPUT" ;;
            3) bash /tmp/claim.sh release "$REPO" writer "$CLAIM_HOLDER" || true; echo "acquired=false" >> "$GITHUB_OUTPUT"; echo "::notice::#$ISSUE already claimed; writer held" ;;
            *) bash /tmp/claim.sh release "$REPO" writer "$CLAIM_HOLDER" || true; echo "::error::Could not establish exclusive claim for #$ISSUE"; exit "$rc" ;;
          esac

      - name: Normalise labels
        if: steps.claim.outputs.acquired == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          ISSUE: ${{ needs.gate.outputs.issue }}
          TASK_TYPE: ${{ needs.gate.outputs.task_type }}
          PRIORITY: ${{ needs.gate.outputs.priority }}
          PRODUCER: ${{ needs.gate.outputs.producer }}
        run: |
          set -euo pipefail

          # WHEN THIS RUN STARTED, recorded before anything else in the job and
          # therefore before the agent can push a commit. The hand-over uses it
          # to tell a pull request this run put work on from one that merely
          # carries `Fixes #N` -- see .github/scripts/promote-decision.sh. It is
          # written here rather than read from a context because no context
          # offers the writer job's own start, and `github.event...` timestamps
          # can predate a queued run by hours.
          echo "ATTADIPA_RUN_STARTED_AT=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_ENV"

          # WHAT THIS NUMBER ACTUALLY IS, read once, before anything is changed.
          #
          # `needs.gate.outputs.issue` is a PULL REQUEST number whenever the
          # trigger was `issue_comment` on a pull request,
          # `pull_request_review_comment` or `pull_request_review` -- three of
          # this workflow's five triggers. Two facts follow from that and both
          # were being guessed at until review of #85:
          #
          #   ATTADIPA_TARGET_KIND     which gh command edits it (see
          #                            .github/scripts/gh-label.sh -- `gh issue
          #                            edit` does not resolve pull requests, and
          #                            every call here is `|| true`, so neither
          #                            outcome was reported);
          #   ATTADIPA_BLOCKED_BEFORE  whether agent:blocked was already there
          #                            when this run started.
          #
          # The second replaces an inference. The hand-over treats agent:blocked
          # at the end of a run as "the AGENT blocked itself, so do not talk over
          # its BLOCKED comment", which is only true if the label cannot have
          # arrived before the run -- and the argument for that held for issues
          # and not for pull requests: claude-ci-repair.yml puts `ci:failed` +
          # `agent:blocked` on a PULL REQUEST when repair gives up. Recording the
          # fact costs one API call and removes the inference entirely.
          #
          # An unreadable lookup writes `unknown`, and the hand-over treats
          # unknown as "not this run" -- it REPORTS rather than falling silent.
          # Silence is the defect being fixed; a redundant outcome comment is
          # not.
          BEFORE_JSON=$(gh api "repos/$REPO/issues/$ISSUE" 2>/dev/null || echo "")
          TARGET_KIND=issue
          BLOCKED_BEFORE=unknown
          if [ -n "$BEFORE_JSON" ]; then
            TARGET_KIND=$(printf '%s' "$BEFORE_JSON" \
              | jq -r 'if .pull_request then "pr" else "issue" end' 2>/dev/null || echo issue)
            BLOCKED_BEFORE=$(printf '%s' "$BEFORE_JSON" \
              | jq -r 'if ([.labels[]?.name] | index("agent:blocked")) then "true" else "false" end' 2>/dev/null || echo unknown)
          fi
          case "$TARGET_KIND" in pr|issue) ;; *) TARGET_KIND=issue ;; esac
          case "$BLOCKED_BEFORE" in true|false) ;; *) BLOCKED_BEFORE=unknown ;; esac
          echo "ATTADIPA_TARGET_KIND=$TARGET_KIND" >> "$GITHUB_ENV"
          echo "ATTADIPA_BLOCKED_BEFORE=$BLOCKED_BEFORE" >> "$GITHUB_ENV"
          echo "::notice::#$ISSUE is a $TARGET_KIND; agent:blocked before this run: $BLOCKED_BEFORE"

          # The same split .github/scripts/gh-label.sh makes, written out here
          # rather than sourced, because THIS step runs before the checkout --
          # the claim has to happen the moment the writer starts, and a
          # bootstrap checkout ahead of it would put a sparse working tree where
          # the agent's full one goes. The two copies are held together by
          # .github/tests/blocked-restart-test.sh, which asserts that neither
          # place edits a label without asking which object it is editing;
          # queue-scan.jq and stranded-failures.jq repeat the author filter for
          # the same reason and say so in the same words.
          label_edit() {
            case "$TARGET_KIND" in
              pr) gh pr edit "$ISSUE" --repo "$REPO" "$@" ;;
              *)  gh issue edit "$ISSUE" --repo "$REPO" "$@" ;;
            esac
          }

          add=(agent:claude)

          case "$TASK_TYPE" in
            continuous-review)    add+=(type:review) ;;
            upstream-intelligence) add+=(type:upstream) ;;
            quality-audit)        add+=(type:quality) ;;
            next-task-research)   add+=(type:research) ;;
            readiness-audit)      add+=(type:readiness) ;;
          esac
          case "$PRIORITY" in P0|P1|P2|P3) add+=("priority:$PRIORITY") ;; esac
          case "$PRODUCER" in
            chatgpt) add+=(source:chatgpt) ;;
            claude)  add+=(source:claude) ;;
            *)       add+=(source:owner) ;;
          esac

          # Built as an argument array rather than a string that gets word-split:
          # a label containing a space would otherwise become two labels, and
          # the shell would not mention it.
          args=()
          for label in "${add[@]}"; do
            args+=(--add-label "$label")
          done

          # Adding is idempotent; removing the other state labels is what makes
          # the claim true rather than merely additional.
          #
          # agent:ready must go or the watchdog picks the task up twice. The
          # other two matter for the second run on an issue that has already
          # been through the loop — the @claude override, or a retry after a
          # failure. Without this the issue ends up carrying agent:working AND
          # agent:review at once, and the `Hand over` step below sees
          # agent:review in the label list, concludes the agent labelled the
          # issue itself, and exits without clearing agent:working. The task is
          # then stuck working forever, the watchdog "unsticks" it two hours
          # later, and a finished task is re-queued on a loop.
          #
          # agent:blocked is in the list for a fourth reason, and it is the one
          # that is easy to get wrong in the other direction. The `Hand over`
          # step below re-reads the labels at the end and, if it finds
          # agent:blocked, concludes the AGENT blocked itself during this run,
          # writes no outcome comment, and exits. It cannot tell that apart
          # from a label that was already on the issue before the run started.
          # There is exactly one way an issue carrying agent:blocked can reach
          # this step at all -- a person commenting `@claude`, because the
          # comment event skips the claimed-state check by design, while
          # queue-scan.jq and the intake gate both refuse a labelled or
          # dispatched start on anything carrying it. So the person deliberately
          # restarting a blocked task got a run that did the work and then
          # reported nothing, every time -- which is the route the watchdog's
          # own escalation comment leads with. Clearing it here makes the check
          # below mean what it says: agent:blocked at hand-over time is a label
          # THIS run applied. needs-owner is deliberately left alone -- a
          # decision only the owner can make is not undone by starting a run.
          # Found in review of #85; asserted by blocked-restart-test.sh.
          #
          # AND agent:blocked IS STRIPPED FROM ISSUES ONLY, which the second
          # review of #85 asked for. The paragraph above reasons about issues
          # throughout -- "a person commenting `@claude`" -- and this step also
          # runs for PULL REQUESTS, where claude-ci-repair.yml writes
          # `ci:failed` + `agent:blocked` when repair gives up and asks for a
          # human. Removing it there would clear that escalation silently, and
          # agent:blocked is one of the labels the unattended backstop requires
          # ABSENT (docs/automation/attadipa-backstop-routine.md STEP 2) while
          # `ci:failed` is not on that list -- so a pull request escalated to a
          # person would become backstop-eligible the moment somebody commented
          # `@claude` on it. It is not stripped, and the hand-over does not need
          # it stripped any more: ATTADIPA_BLOCKED_BEFORE above records the fact
          # directly instead of inferring it from the label's presence.
          label_edit "${args[@]}" || true
          stale_labels=(agent:ready agent:review agent:failed)
          if [ "$TARGET_KIND" != "pr" ]; then
            stale_labels+=(agent:blocked)
          fi
          for stale in "${stale_labels[@]}"; do
            label_edit --remove-label "$stale" || true
          done

          # This is deliberately read after the claim's label edits.  The
          # hand-over needs to distinguish a blocker the agent created during
          # this run from a pre-existing escalation, and a pre-mutation snapshot
          # cannot answer that question for an issue restarted with @claude.
          AFTER_JSON=$(gh api "repos/$REPO/issues/$ISSUE" 2>/dev/null || echo "")
          BLOCKED_AT_CLAIM=unknown
          if [ -n "$AFTER_JSON" ]; then
            BLOCKED_AT_CLAIM=$(printf '%s' "$AFTER_JSON" \
              | jq -r 'if ([.labels[]?.name] | index("agent:blocked")) then "true" else "false" end' \
                2>/dev/null || echo unknown)
          fi
          case "$BLOCKED_AT_CLAIM" in true|false) ;; *) BLOCKED_AT_CLAIM=unknown ;; esac
          echo "ATTADIPA_BLOCKED_AT_CLAIM=$BLOCKED_AT_CLAIM" >> "$GITHUB_ENV"
          echo "::notice::#$ISSUE is agent:blocked at claim baseline: $BLOCKED_AT_CLAIM"

      - name: Check that an Anthropic credential exists
        id: auth
        if: steps.claim.outputs.acquired == 'true'
        env:
          HAS_KEY: ${{ secrets.ANTHROPIC_API_KEY != '' }}
          HAS_OAUTH: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN != '' }}
        run: |
          # A workflow that is red because a secret was never added is a workflow
          # people learn to ignore. This says so once, in the issue, and exits
          # green — the infrastructure is correct, it is simply not wired to an
          # account yet.
          if [ "$HAS_KEY" = "true" ] || [ "$HAS_OAUTH" = "true" ]; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
          else
            echo "ok=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Say what is missing
        if: steps.claim.outputs.acquired == 'true' && steps.auth.outputs.ok == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          ISSUE: ${{ needs.gate.outputs.issue }}
        run: |
          set -euo pipefail
          # Written to a file rather than assembled inline. The quoting needed to
          # get backticks and an apostrophe through two layers of shell is the
          # kind of thing that works until somebody edits one word.
          {
            echo "BLOCKED"
            echo "Reason: no Anthropic credential is configured, so the agent cannot start."
            echo "Evidence: neither ANTHROPIC_API_KEY nor CLAUDE_CODE_OAUTH_TOKEN is present"
            echo "in this repository's Actions secrets."
            echo "Impact: every Claude workflow will accept tasks and then stop here."
            echo "What can be done automatically: nothing — a workflow cannot create a secret."
            echo "Owner action required: run \`claude setup-token\` locally, then"
            echo "\`gh secret set CLAUDE_CODE_OAUTH_TOKEN\`. That credential draws on a"
            echo "Claude Pro or Max subscription. ANTHROPIC_API_KEY also works and bills"
            echo "an API account per token, which is a separate bill from the subscription."
            echo "How to resume: comment @claude on this issue."
          } > /tmp/blocked.md
          # Same object question as the claim step, and the same answer it wrote
          # down there: this step also runs when the trigger was a comment on a
          # pull request. See .github/scripts/gh-label.sh. Written out rather
          # than sourced because the checkout is the step after this one.
          case "${ATTADIPA_TARGET_KIND:-issue}" in
            pr)
              gh pr comment "$ISSUE" --repo "$REPO" --body-file /tmp/blocked.md
              gh pr edit "$ISSUE" --repo "$REPO" --add-label agent:blocked --add-label needs-owner --remove-label agent:working || true ;;
            *)
              gh issue comment "$ISSUE" --repo "$REPO" --body-file /tmp/blocked.md
              gh issue edit "$ISSUE" --repo "$REPO" --add-label agent:blocked --add-label needs-owner --remove-label agent:working || true ;;
          esac

      # THE BRANCH, FOR THE CODING WORK. Deliberately whatever the event points
      # at, because that is the code the task is about. What it is NOT any more
      # is where the hand-over reads its own logic from -- see the next step.
      - uses: actions/checkout@v7
        if: steps.claim.outputs.acquired == 'true' && steps.auth.outputs.ok == 'true'
        with:
          fetch-depth: 0

      # THE ORCHESTRATION BUNDLE: THE HAND-OVER'S OWN CODE, FROM main, KEPT OUT
      # OF THE SESSION'S REACH.
      #
      # Everything after `Run Claude` in this job is privileged. It holds
      # `contents: write`, `issues: write`, `pull-requests: write` and a live
      # GH_TOKEN, and it decides what this run is allowed to say and which state
      # the queue is left in. Until this step existed it read that code out of
      # $GITHUB_WORKSPACE, and the workspace is not ours to trust:
      #
      #   - `pull_request_review` and `pull_request_review_comment` -- two of
      #     this workflow's five triggers -- set GITHUB_REF to
      #     `refs/pull/N/merge` (GitHub's own events table). The checkout above
      #     is then the reviewed branch merged into the base, and a branch that
      #     edits `.github/scripts` wins that merge for the files it edits;
      #   - the model session runs BETWEEN that checkout and those steps, with
      #     write access to every file in the tree, and is routinely handed
      #     tasks whose subject is these very helpers -- #106 rewrites
      #     `failure-reason.sh`, #129 adds a hand-over script. The reporting
      #     step was executing the half-finished reporting code the run had just
      #     written;
      #   - a tree that has no such file at all -- a branch predating a helper,
      #     a branch that deletes one, a session that moved it -- met
      #     `set -euo pipefail` and killed the step before the outcome comment.
      #     The issue then sat on `agent:working` with nothing said until the
      #     watchdog picked it up two hours later. That is #133, and it is the
      #     same execution path already reported once against #85.
      #
      # So the hand-over's code comes from the default branch, which is
      # protected by CI and by review, or it does not come at all. The pattern
      # is the sparse checkout the gate above already uses, and the acknowledge
      # job, and agent-queue-watchdog.yml, and pr-merge-sweep.yml: no new
      # dependency, a fourth caller of a shape this repository already trusts.
      #
      # It lands INSIDE the workspace because actions/checkout refuses a `path:`
      # outside it, and the very next step moves it to RUNNER_TEMP and deletes
      # the staging copy. THAT ORDERING IS THE GUARANTEE RATHER THAN A TIDY-UP:
      # both steps run before `Run Claude`, so there is no moment at which the
      # session and the trusted copy are in the same tree.
      #
      # continue-on-error, because a fetch that fails must not take the run's
      # only report down with it. `Hand over` treats an unusable bundle as a
      # reason to write a shorter outcome inline -- never as a reason to fall
      # back to the workspace, and never as a reason to say nothing.
      - name: Fetch the hand-over's own code from the default branch
        if: steps.claim.outputs.acquired == 'true' && steps.auth.outputs.ok == 'true'
        continue-on-error: true
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          sparse-checkout: .github/scripts
          sparse-checkout-cone-mode: false
          persist-credentials: false
          path: .attadipa-bundle

      - name: Move it out of the agent's reach
        if: steps.claim.outputs.acquired == 'true' && steps.auth.outputs.ok == 'true'
        run: |
          # No `set -e` here on purpose. A bundle that cannot be staged is a
          # degraded hand-over, which the hand-over handles by itself; it is not
          # a reason to fail this job before the agent has run at all.
          set -uo pipefail
          DEST="$RUNNER_TEMP/attadipa-orchestration"
          rm -rf "$DEST"
          if [ -d .attadipa-bundle/.github/scripts ]; then
            mkdir -p "$DEST" && cp -R .attadipa-bundle/.github/scripts "$DEST/scripts"
          fi
          # Unconditionally, whether that copy worked or not: nothing this step
          # brought in may still be in the workspace when the session starts.
          # RUNNER_TEMP is outside $GITHUB_WORKSPACE and is not what the agent
          # is pointed at, working in, or asked to commit.
          rm -rf .attadipa-bundle
          if [ -r "$DEST/scripts/agent-say.sh" ]; then
            echo "ATTADIPA_TRUSTED_SCRIPTS=$DEST/scripts" >> "$GITHUB_ENV"
            echo "::notice::hand-over code staged from the default branch at $DEST/scripts"
          else
            # Written empty rather than left unset, so the hand-over reads a
            # decision rather than an absence.
            echo "ATTADIPA_TRUSTED_SCRIPTS=" >> "$GITHUB_ENV"
            echo "::warning::the hand-over code could not be staged from the default branch; the outcome will be the reduced inline one"
          fi

      # WHERE THE BRANCH WAS BEFORE THIS RUN TOUCHED IT.
      #
      # Only meaningful when the task is a pull request -- `@claude` on #71
      # rather than on an issue. The hand-over step needs it to tell "this run
      # pushed a fix here" from "this run pushed nothing", and those two are
      # indistinguishable from the trigger alone: the pull request is open and
      # is its own number either way.
      #
      # IT HAS TO BE READ HERE, NOT IN THE GATE, and the reason is the writer
      # queue directly above. The gate has no concurrency group and runs the
      # instant the event arrives; this job waits in `attadipa-agent-writer`
      # until whatever is ahead of it finishes, which can be most of an hour.
      # A snapshot taken in the gate would therefore predate any push made in
      # that window -- a second `@claude` that queued ahead of this one, or a
      # person pushing a fixup to the same branch, neither of which "one
      # writer" serialises against. The head would differ at hand-over time for
      # a reason that has nothing to do with this run, and the step would post
      # "Done — pushed to this pull request" for a run that pushed nothing.
      # That is the same false claim by a different door, and review caught it
      # on the previous revision of this file rather than in production.
      #
      # Empty for an issue, and empty is the safe value: an unknown starting
      # point can never be read as proof that anything happened.
      - name: Where the pull request head was
        id: prhead
        if: steps.claim.outputs.acquired == 'true' && steps.auth.outputs.ok == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          ISSUE: ${{ needs.gate.outputs.issue }}
        run: |
          set -euo pipefail
          # shellcheck disable=SC2016  # GraphQL variables, bound by -F below.
          SHA=$(gh api graphql -f query='
            query($owner:String!, $repo:String!, $number:Int!) {
              repository(owner:$owner, name:$repo) {
                issueOrPullRequest(number:$number) {
                  ... on PullRequest { headRefOid }
                }
              }
            }' -F owner="${REPO%%/*}" -F repo="${REPO##*/}" -F number="$ISSUE" \
            --jq '.data.repository.issueOrPullRequest.headRefOid // ""' 2>/dev/null || echo "")
          case "$SHA" in
            *[!0-9a-f]*) SHA="" ;;
          esac
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          echo "::notice::pull request head before this run: ${SHA:-not a pull request}"

      - name: Run Claude
        if: steps.claim.outputs.acquired == 'true' && steps.auth.outputs.ok == 'true'
        id: claude
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # Deliberately NOT secrets.GITHUB_TOKEN.
          #
          # GitHub does not start workflow runs for events created with the
          # built-in GITHUB_TOKEN. A pull request opened with it would therefore
          # never run CI, and the whole point of this loop is that CI runs
          # without anybody asking. Left empty, the action uses the Claude GitHub
          # App instead, whose installation token does trigger workflows; set
          # ATTADIPA_AGENT_TOKEN to a fine-grained PAT to use that instead.
          # docs/automation/CLAUDE_AUTOMATION.md explains both.
          github_token: ${{ secrets.ATTADIPA_AGENT_TOKEN }}
          branch_prefix: "claude/issue-"
          # THIS LINE WAS EMPTY, AND IT DISABLED THE ENTIRE AUTONOMOUS QUEUE.
          #
          # The hourly watchdog hands a task over with `gh workflow run` using
          # the default GITHUB_TOKEN, so the dispatching actor is
          # `github-actions[bot]`. With allowed_bots empty, this action refused
          # every one of those runs before reading a single file:
          #
          #   Actor type: Bot
          #   Workflow initiated by non-human actor: github-actions (type: Bot).
          #
          # Five seconds, no execution log, and the hand-over could only report
          # `no conclusion`. Every "unexplained" agent death on this repository
          # traces here -- #27, #28, #67, #69 -- and they all shared one
          # property nobody had noticed: they were started by the watchdog
          # rather than by a person commenting. Anything a human started ran
          # fine, which is exactly why it read as random. Found 2026-08-22 by
          # reading the step log after .github/scripts/failure-reason.sh (#81)
          # made the failure say "no execution log was written" instead of
          # pointing at a redacted run log.
          #
          # Naming one bot is not the same concession as '*'. The comment this
          # replaces was right that '*' would let ANY GitHub App drive a
          # write-capable agent on a public repository. `github-actions` is the
          # actor of workflows in THIS repository and nothing else -- an
          # outside app cannot present as it -- so the surface added is "a
          # workflow already in this repository may start the agent", which is
          # the design, and those workflows are protected by branch protection
          # and by CI.
          #
          # What this does NOT relax, and must not be read as relaxing:
          # .github/scripts/queue-scan.jq still refuses to honour `claude` or
          # `github-actions` in ATTADIPA_TRUSTED_PRODUCERS, so our own output
          # still cannot enqueue a billable writer. That rule is the allowlist
          # that matters; this input only decides who may press the button on a
          # task that rule already approved.
          #
          # The action lowercases both sides and strips a trailing `[bot]`
          # (src/github/validation/actor.ts, isAllowedBot at the v1 tag), so
          # `github-actions` and `github-actions[bot]` are the same entry.
          # .github/tests/bot-actor-test.sh asserts this stays in
          # agreement with the watchdog rather than trusting the comment.
          allowed_bots: "github-actions"
          allowed_non_write_users: ""
          # Two different things, and only one of them is a leak.
          #
          # show_full_output prints every message including tool results, which
          # can contain tokens, into a world-readable log on a public
          # repository. It stays off.
          #
          # display_report posts Claude's own summary of what it did. Turning
          # that off as well was a mistake found by smoke test A: the agent ran
          # twenty-eight turns successfully and left no branch, no pull request
          # and no comment, so the only evidence any work happened at all was a
          # green tick. An agent whose conclusions nobody can read is not an
          # agent, it is a bill.
          show_full_output: "false"
          display_report: "true"
          additional_permissions: |
            actions: read
          # --allowedTools is not optional, and its absence is silent.
          #
          # Agent mode — which is what `prompt:` selects — sets no default
          # --allowedTools and no --permission-mode. Tag mode sets both
          # (src/modes/tag/index.ts); agent mode passes through only what is
          # written here. The headless SDK has no prompt handler, so every tool
          # that would fall through to "ask" is DENIED, without an error and
          # without a line in the log.
          #
          # Observed on 2026-08-21, before this line existed: the reviewer ran
          # for 41 s, exited 0, and posted no comment and set no label; the
          # implementation agent on issue #5 finished green and produced no
          # branch and no pull request. Both had read the diff perfectly well
          # and had no way to say so.
          #
          # Verified against anthropics/claude-code-action at the v1 tag
          # (v1.0.198, 3f854a8): src/mcp/install-mcp-server.ts gates the comment
          # MCP servers on these names too, and `grep -rn "addLabels" src/`
          # returns nothing — the action has no label feature at all, so the
          # label in the prompt below depends entirely on `gh` being allowed.
          #
          # This one writes, so it gets Edit, Write and Bash. The boundary that
          # matters for it is the job's `permissions:` block and the branch it
          # is checked out on, not the tool list.
          #
          # THE CEILING WAS 60 AND IT KILLED SIX RUNS IN ONE AFTERNOON.
          #
          # 2026-08-22: #71 three times, #67, #75 and #78 all ended the same way
          # -- accepted, an accurate plan comment three minutes in, then dead
          # with `error_max_turns` at turn 61 and nothing on the branch. Read
          # from the execution log of run 32587675386: `"subtype":
          # "error_max_turns"`, `"num_turns": 61`, `"total_cost_usd": 3.00`,
          # after 8 min 49 s of real work. An honest report over an empty branch
          # is the one outcome nobody can act on, and it was paid for in full
          # every time.
          #
          # This repository already reached this conclusion once, for the
          # reviewer, on this same day -- docs/automation/CLAUDE_AUTOMATION.md
          # records #39 being killed at turn 50 of a 40 ceiling having posted
          # nothing, and the reasoning it settled on: "a limit that stops work
          # AFTER it has been paid for is not a cost control; the control that
          # actually bounds spend is timeout-minutes, which is denominated in
          # the thing being billed. --max-turns bounds a different failure -- a
          # session stuck in a loop." The reviewer went to 100. The agent was
          # left at 60 and is the job that does strictly more: it reads the same
          # material the reviewer does, and then implements, tests, pushes and
          # reports.
          #
          # 200 keeps a productive implementation from being killed after its
          # cost is already incurred. Spend is bounded by timeout-minutes.
          # WHICH MODEL, AND HOW HARD IT THINKS. Neither was pinned until
          # 2026-08-22, and the action has no `model:` input -- so every run
          # this loop has ever made used whatever the CLI defaulted to, and
          # nothing in the repository recorded which model that was. A result
          # you cannot attribute to a model is a result you cannot compare
          # against the next one.
          #
          # Verified against `claude --help` rather than assumed: `--model`
          # takes an alias ('opus', 'sonnet', 'fable') or a full name, and
          # `--effort` takes one of low, medium, high, xhigh, max. The full
          # name is pinned rather than the alias so that a new Opus does not
          # silently change what this loop is: the cost of that choice is that
          # somebody must come here to move it, which is the intended cost.
          #
          # Owner decision: automated Claude roles cap at xhigh.  `max` is
          # reserved for an explicit owner-requested manual exception.
          claude_args: |
            --model claude-opus-5 --effort xhigh --max-turns 200 --allowedTools "Read,Glob,Grep,Edit,Write,Bash,WebFetch,WebSearch,TodoWrite,Task"
          prompt: |
            You are the implementation agent for Attadipa, working from GitHub
            issue #${{ needs.gate.outputs.issue }} in ${{ github.repository }}.

            Before editing, read the issue and every comment, `AGENTS.md`, the
            nearest scoped `AGENTS.md` for changed files, and open issues and
            pull requests so you do not duplicate claimed work. Read only the
            relevant product requirements, ADRs and evidence. Check the reuse
            ledger when a non-trivial dependency or upstream implementation is
            involved.

            task_type is `${{ needs.gate.outputs.task_type }}` and
            research_only is `${{ needs.gate.outputs.research_only }}`.

            HAS THE FINDING GONE STALE? The producer looked at
            `${{ needs.gate.outputs.reviewed_head }}`, and:

              ${{ needs.gate.outputs.staleness }}

            If the default branch has moved, verify the finding against the code
            as it is now BEFORE implementing anything. A finding that has already
            been fixed, or that was never right, is closed with the evidence that
            says so — a diff, a file and a line — and not implemented. Neither
            the issue nor its producer is automatically correct; that is why this
            field exists. Say in a comment which of the two you found.

            If research_only is true: do NOT write speculative implementation
            code. Verify sources, update docs/research/, the reuse ledger, and
            an ADR only if a decision was genuinely made. Open a documentation
            pull request, and its body must contain
            `Fixes #${{ needs.gate.outputs.issue }}` exactly as an
            implementation one does — a research pull request that does not
            reference its issue neither closes it on merge nor is recognised as
            this run's output.

            Otherwise: implement the task on a branch, run every check that can
            run here (`cmake -S . -B build && cmake --build build && ctest
            --test-dir build --output-on-failure`), and open a DRAFT pull
            request whose body contains `Fixes #${{ needs.gate.outputs.issue }}`
            and sections for problem, solution, upstream and reuse references,
            tests, hardware not executed, risks, and remaining blockers.

            Never claim a hardware result. Anything that needs a physical board,
            an instrument or a measurement is written as
            `NOT EXECUTED — HARDWARE REQUIRED` and, if it blocks the task, as a
            BLOCKED comment in the format `AGENTS.md` gives, with the issue
            labelled agent:blocked plus needs-hardware or needs-owner.

            Do not ask the owner a question that the issue, an ADR, relevant
            requirements or existing evidence already answers. When you genuinely
            need a human decision, say so once, with two to four concrete
            options and a recommendation, and apply the needs-owner label.

            Put task status and test evidence in the issue and pull request.
            Do not edit the `STATUS.md` or `TASKS.md` compatibility pointers.
            Leave the repository so the next agent can continue without this
            conversation.

            ## SAY WHAT YOU ARE DOING, ON THE ISSUE, WHILE YOU DO IT

            Somebody is watching this issue on a phone. To them, an agent
            thinking hard for forty minutes and an agent that died in the first
            second look exactly the same. That is not their problem to solve by
            opening Actions — it is yours to solve by writing.

            A receipt saying the task was accepted has already been posted for
            you, and an outcome comment will be posted after you exit whatever
            happens. Neither of those knows anything about the work. **You do,
            and the middle is yours.**

            **Post a plan comment once, early** — after you have read the issue
            and the documents and before the long part starts. Three or four
            lines, no preamble: what you are actually going to change, which
            files, and anything you already know will be awkward. If the issue
            turns out to describe something different from what the code does,
            that belongs here rather than at the end.

            **Post again when the answer changes**, and only then:

              * the finding does not reproduce, or is already fixed — say so
                with the file and the line as soon as you know, not after
                another twenty minutes of looking;
              * the shape of the fix changed from your plan — one line on what
                and why;
              * you are about to wait on something slow, or you are going to
                run out of room. Saying "this is bigger than one pull request,
                here is what I am cutting" beats an unexplained partial diff.

            **At most three comments before the end.** A comment that repeats
            the last one is worse than silence, because it teaches people to
            stop reading. Never narrate tool calls, never post a progress bar,
            never say "working on it" — if there is nothing new, write nothing.

            **Finish by leaving the outcome on the issue itself**, with `gh
            issue comment`, in every case including the ones where you changed
            nothing:

              * work done — link the pull request, say in two sentences what it
                changes, and say what you are now waiting on;
              * nothing to change — say what you checked and what you found, so
                the next person does not check it again;
              * blocked — the BLOCKED format above. Be specific about what would
                unblock it: a decision, a measurement, or a board.

            Nobody can see your reasoning. An issue that ends with a green tick
            and no sentence has cost money and told nobody anything, and the
            next agent along will start the same task from the beginning.

      - name: Work out why the run died
        # THE MISSING HALF OF THE REPORT. `show_full_output: false` above is
        # right and stays: tool results carry file contents and token-shaped
        # strings, and this repository is public. But it means the run log a
        # failure comment points at contains the SDK options, an init line, and
        # a result object -- and on 2026-08-22 run 32589375744 that result
        # object was `{"subtype":"success","is_error":true,"num_turns":20}` and
        # nothing else. A person following the link learned that it broke, which
        # they already knew.
        #
        # The action's FULL execution log is written to the runner and never
        # published. .github/scripts/failure-reason.sh reads it there and emits
        # one line matching a whitelist of error grammars -- an API status, a
        # context refusal, a credit balance, an expired token -- and reports
        # anything else as `unclassified` with only structural facts. What it
        # cannot classify it does not paraphrase, and .github/tests/
        # failure-reason-test.sh puts a private key and an API key in the log
        # next to a real error to prove only the error comes out.
        id: why
        if: always() && steps.claim.outputs.acquired == 'true' && steps.auth.outputs.ok == 'true' && steps.claude.outcome == 'failure'
        env:
          EXEC_FILE: ${{ steps.claude.outputs.execution_file }}
        run: |
          set -uo pipefail
          # From the default-branch bundle, never from the workspace. This step
          # is already inside the privileged tail, it reads a file the session
          # produced, and `failure-reason.sh` is itself one of the things agents
          # are sent to edit (#106). See the bundle step above for why the
          # workspace is not a source of orchestration code.
          if [ -n "${ATTADIPA_TRUSTED_SCRIPTS:-}" ] && [ -r "${ATTADIPA_TRUSTED_SCRIPTS}/failure-reason.sh" ]; then
            REASON=$(bash "${ATTADIPA_TRUSTED_SCRIPTS}/failure-reason.sh" "${EXEC_FILE:-}")
          else
            REASON="unclassified: the failure classifier could not be read from the default branch"
          fi
          echo "::notice::why the run died: ${REASON}"
          {
            echo "reason<<ATTADIPA_EOF"
            echo "${REASON}"
            echo "ATTADIPA_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Hand over
        # ALWAYS SAYS SOMETHING. Every exit path from this job ends in a comment
        # on the issue naming what happened and what is being waited on next.
        #
        # It used to comment only when the run died, on the reasoning that a
        # successful agent speaks for itself. It does not: the agent's own
        # summary goes to the run's step summary, and a person watching the
        # issue saw a label change and nothing else. Success and silent death
        # were indistinguishable without opening Actions, which is the failure
        # this whole reporting protocol exists to remove — see the header of
        # .github/scripts/agent-say.sh.
        if: always() && steps.claim.outputs.acquired == 'true' && steps.auth.outputs.ok == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          ISSUE: ${{ needs.gate.outputs.issue }}
          HEAD_BEFORE: ${{ steps.prhead.outputs.sha }}
          CONCLUSION: ${{ steps.claude.outputs.conclusion }}
          # Through the environment rather than `${{ }}` inside the script: the
          # value is derived from a file the model's session wrote, and a shell
          # interpolation of model-adjacent text is an injection whatever the
          # whitelist upstream of it does.
          REASON: ${{ steps.why.outputs.reason }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail

          # Which object is this? The claim step wrote it down at the start of
          # the run; the fallback is the issue path, which is what every
          # scheduled trigger dispatches. See .github/scripts/gh-label.sh for
          # why `gh issue edit` is not safe to point at a pull request.
          TARGET="${ATTADIPA_TARGET_KIND:-issue}"

          # WHICH COPY OF THE HAND-OVER'S CODE IS THIS STEP ALLOWED TO RUN?
          #
          # Only the one staged from the default branch before the session
          # started. `ATTADIPA_TRUSTED_SCRIPTS` points at it; empty means the
          # staging failed. The copy in $GITHUB_WORKSPACE is NEVER a fallback --
          # it is the reviewed branch merged into the base plus whatever the
          # session did to the tree, and this step runs with write access. See
          # the bundle step for the three ways that goes wrong.
          #
          # Resolved first and with no side effects, so the decision is made
          # before anything is written anywhere.
          TRUSTED="${ATTADIPA_TRUSTED_SCRIPTS:-}"
          MISSING=""
          for f in gh-label.sh handover-decision.sh agent-say.sh promote-decision.sh; do
            if [ -z "$TRUSTED" ] || [ ! -r "$TRUSTED/$f" ]; then
              MISSING="${MISSING:+$MISSING }$f"
            fi
          done
          [ -z "$MISSING" ] || echo "::error::the hand-over could not read its own code from the default branch ($MISSING); reporting the reduced outcome inline rather than running the copy in this branch's working tree"

          # The `gh issue` / `gh pr` split. From the bundle when it is readable,
          # written out here when it is not -- the same two lines the claim step
          # writes out for a sibling reason, and for the same reason: a step
          # that cannot reach the file still must not point `gh issue edit` at a
          # pull request. .github/tests/orchestration-bundle-test.sh holds the
          # copies in agreement, exactly as blocked-restart-test.sh does for the
          # claim step's copy.
          if [ -z "$MISSING" ]; then
            # shellcheck source=.github/scripts/gh-label.sh
            # shellcheck disable=SC1091
            . "$TRUSTED/gh-label.sh"
          else
            attadipa_label_edit() {
              local kind="$1" number="$2" slug="$3"; shift 3
              case "$kind" in
                pr) gh pr edit "$number" --repo "$slug" "$@" ;;
                *)  gh issue edit "$number" --repo "$slug" "$@" ;;
              esac
            }
            attadipa_label_comment() {
              local kind="$1" number="$2" slug="$3"; shift 3
              case "$kind" in
                pr) gh pr comment "$number" --repo "$slug" "$@" ;;
                *)  gh issue comment "$number" --repo "$slug" "$@" ;;
              esac
            }
          fi

          LABELS=$(gh api "repos/$REPO/issues/$ISSUE" --jq '[.labels[].name] | join(",")')

          # Did the agent open a pull request for this issue? That is the
          # difference between "done" and "ran and produced nothing", and
          # getting it wrong is expensive in a specific way: a successful run
          # reported as a silent failure invites somebody to comment `@claude`,
          # which the gate deliberately does NOT deduplicate for comment events
          # — so a second billed agent starts against work already finished and
          # opens a second, competing pull request. The message meant to prevent
          # duplicate work would have caused it.
          #
          # ONE QUESTION, and it used to be two.
          #
          #   Which open pull request CLOSES this issue? GitHub resolves the
          #   closing keyword itself, so this is a fact rather than a grep for
          #   "Fixes".
          #
          # THE SECOND QUESTION IS GONE, and its removal is the point. It asked
          # which open pull request MENTIONS the issue at all, on the reasoning
          # that research-only branches were told merely to "open a
          # documentation pull request" and so produced work no closing keyword
          # could find. That reasoning expired: the prompt above now requires
          # `Fixes #N` from a research pull request in the same words as an
          # implementation one, and says why.
          #
          # What the fallback cost while it lived: a cross-reference is created
          # by ANY pull request that names the issue, including one somebody
          # else edits mid-run to discuss the same problem. #75 cites #71 five
          # times as evidence and was told "Done — pull request #71". The first
          # repair filtered mentions by time, which proves only that a mention
          # appeared during the run -- not that this run caused it. Correlation
          # was standing in for ownership, and it also let a weak signal
          # outrank a failed conclusion. Reported by the producing agent as #76
          # against 5087913, and it is right: the honest fix is to stop asking
          # the second question rather than to qualify it further.
          # shellcheck disable=SC2016  # $owner/$repo/$number are GraphQL
          # variables bound by -F below, not shell expansions.
          FOUND=$(gh api graphql -f query='
            query($owner:String!, $repo:String!, $number:Int!) {
              repository(owner:$owner, name:$repo) {
                issueOrPullRequest(number:$number) {
                  __typename
                  ... on PullRequest { number state headRefOid }
                  ... on Issue {
                    closedByPullRequestsReferences(first:5, includeClosedPrs:false) {
                      nodes { number state }
                    }
                  }
                }
              }
            }' -F owner="${REPO%%/*}" -F repo="${REPO##*/}" -F number="$ISSUE" \
            --jq '.data.repository.issueOrPullRequest as $i
                  | if $i.__typename == "PullRequest"
                    then (if $i.state == "OPEN"
                          then "here \($i.number) \($i.headRefOid)" else "" end)
                    else ([$i.closedByPullRequestsReferences.nodes[]?
                            | select(.state == "OPEN") | "pr \(.number)"]
                          | first // "")
                    end' 2>/dev/null || echo "")

          # Everything from here is .github/scripts/handover-decision.sh, which
          # is a file so that .github/tests/handover-decision-test.sh can run
          # it. Both defects this step has had were in a shell block embedded in
          # a workflow, where nothing could execute it — the same reason the
          # intake gate and the watchdog filter are files.
          #
          # It decides four things at once: that only "here <n> <sha>" and
          # "pr <n>" mean anything and everything else is "found nothing"; that
          # a pull request which triggered its own agent is only "done" if its
          # head actually moved; that a clean run which pushed nothing says so
          # rather than claiming a push; and that a pull request number found
          # for an issue outranks even a missing conclusion, because an agent
          # that opened a pull request and then timed out has still done the
          # work.
          if [ -z "$MISSING" ]; then
            {
              read -r KIND
              read -r DETAIL
              read -r EXTRA
            } < <(bash "$TRUSTED/handover-decision.sh" \
                    "$FOUND" "$HEAD_BEFORE" "${CONCLUSION:-}")
          else
            # THE REDUCED CLASSIFIER, and reduced is the honest word for it.
            #
            # `$FOUND` is produced by the GraphQL query above, which lives in
            # this file and therefore comes from the default branch whatever the
            # workspace holds -- so the one fact that matters is still available
            # even with no bundle: is there an open pull request that closes
            # this issue, or is the trigger itself an open pull request.
            #
            # What is deliberately NOT reconstructed here is the rest of
            # handover-decision.sh's judgement: whether the head moved, whether
            # a run without a conclusion still counts, whether a draft may be
            # promoted. Those are the questions worth getting right, which is
            # why they live in a tested file, and guessing at them inline would
            # be the duplication this repository keeps refusing to make. The
            # split below is the one that cannot be got wrong: something exists
            # to look at, or nothing does.
            case "$FOUND" in
              here\ *|pr\ *) KIND=degraded_pr;   DETAIL=$(printf '%s' "$FOUND" | cut -d' ' -f2) ;;
              *)             KIND=degraded_nopr; DETAIL="" ;;
            esac
            EXTRA=""
          fi
          echo "::notice::hand over as $KIND (${DETAIL:-no detail}${EXTRA:+, $EXTRA})"

          # THE AGENT LABELS THE ISSUE ITSELF WHEN IT BLOCKS -- OR SOMEBODY
          # ELSE DID, WHICH IS THE WHOLE QUESTION. It WAS INFERRED, and the second
          # review of #85 was right that the inference does not hold. It rested
          # on the claim step stripping agent:blocked at the start of the run,
          # and that strip is issue-only: on a pull request the label can be
          # claude-ci-repair.yml's escalation, put there before this run existed.
          # Inferring "the agent blocked itself" from it made a run that did the
          # work report nothing -- #82's own shape, on the other half of the
          # trigger surface.
          #
          # So the fact is recorded rather than deduced. The claim step wrote
          # ATTADIPA_BLOCKED_AT_CLAIM after it finished normalising labels.
          # `unknown` means the read failed, and unknown is treated as "not this
          # run": falling silent is the defect, and a redundant outcome comment
          # beside a BLOCKED comment is a smaller cost than a finished run
          # saying nothing at all.
          #
          # `.github/tests/blocked-restart-test.sh` asserts the pair, which lives
          # in two steps of one workflow and is correct in neither alone.
          BLOCKED_OUTCOME=normal
          if [ -z "$MISSING" ] && [ -r "$TRUSTED/blocked-outcome.sh" ]; then
            BLOCKED_OUTCOME=$(bash "$TRUSTED/blocked-outcome.sh" \
              "$LABELS" "${ATTADIPA_BLOCKED_AT_CLAIM:-unknown}" 2>/dev/null) || BLOCKED_OUTCOME=report
          fi
          case "$BLOCKED_OUTCOME" in
            silent|report|normal) ;;
            *) BLOCKED_OUTCOME=report ;;
          esac
          if [ "$BLOCKED_OUTCOME" = "silent" ]; then
            attadipa_label_edit "$TARGET" "$ISSUE" "$REPO" --remove-label agent:working || true
            echo "::notice::#$ISSUE is blocked and the agent has said why; not commenting over it."
            exit 0
          fi
          if [ "$BLOCKED_OUTCOME" = "report" ]; then
            echo "::notice::#$ISSUE carries a pre-existing or unreadable blocker; reporting without changing its state."
          fi

          if [ -z "$MISSING" ]; then
            bash "$TRUSTED/agent-say.sh" outcome \
              "$KIND" "$RUN_URL" "$DETAIL" "$EXTRA" "${REASON:-}" > /tmp/outcome.md
          else
            # Never execute a fallback from the reviewed/session-mutated tree.
            # This inline reduced report is part of the trusted workflow itself.
            {
              echo "### The run finished; the hand-over could not read its own code"
              echo
              echo "\`$MISSING\` could not be staged from the default branch. This is a"
              echo "reduced report; it deliberately does **not** fall back to the working"
              echo "tree, because that is reviewed/session-mutated code with write access."
              echo
              case "$KIND" in
                degraded_pr)
                  echo "**There is something to inspect.** #$DETAIL remains a draft and is"
                  echo "marked \`agent:review\`; a person or orchestrator must decide it."
                  ;;
                *)
                  echo "**No open pull request closes this issue.** It returns to the queue as"
                  echo "\`agent:failed\` + \`agent:ready\`; nothing was merged."
                  ;;
              esac
              echo
              echo "The session's conclusion was \`${CONCLUSION:-none}\`. Run log: $RUN_URL"
              echo
              echo "This is an automation fault: check the default-branch bundle checkout"
              echo "before restarting anything."
            } > /tmp/outcome.md
          fi
          attadipa_label_comment "$TARGET" "$ISSUE" "$REPO" --body-file /tmp/outcome.md

          if [ "$BLOCKED_OUTCOME" = "report" ]; then
            exit 0
          fi

          # A DRAFT IS NOT A HAND-OVER. The prompt tells the agent to open the
          # pull request as a draft while it is still moving and to mark it
          # ready when it is not -- and the second half was left to the agent
          # remembering, which it reliably did not. On 2026-08-22 five finished
          # pull requests (#88, #92, #94, #95, #97) sat as drafts with green CI
          # for hours; nothing merges a draft, so six issues stayed open with
          # their fix already written and their `Fixes #N` already in place. The
          # owner asked why. This is why.
          #
          # So the step that decides the run is done marks it ready, rather than
          # asking the model to. `--undo` is never used: a person who puts a
          # pull request back to draft has said something, and a later run must
          # not overrule them. Only the four "done" kinds qualify; a cut-off run
          # (done_pr_cut) leaves the draft alone, because a draft is exactly
          # what half-finished work should be.
          # Two of the four "done" kinds carry a pull request this run actually
          # moved -- done_pr (one was opened or found for the issue) and
          # done_here (the run started from one and its head advanced). Those
          # get marked ready. done_here_nopush pushed nothing, and done_nopr has
          # no pull request at all, so neither has anything to promote.
          #
          # AND A DRAFT IS NOT ALWAYS OURS TO PROMOTE. For done_pr the number
          # above came from `closedByPullRequestsReferences` -- whichever open
          # pull request declares it closes this issue. Anybody can write
          # `Fixes #N`, including an abandoned branch from a run three days ago,
          # and that heuristic has already misfired here (#75 reported as #71).
          # While it only put a wrong number in a sentence, being wrong was
          # cheap. Undrafting is not: a draft can never read
          # `mergeable_state: clean`, so taking one out of draft is exactly what
          # makes a branch eligible for the unattended backstop. Review of #85
          # asked for the guard handover-decision.sh already applies to
          # done_here -- a moved head -- to reach done_pr as well.
          #
          # The decision is .github/scripts/promote-decision.sh, a file for the
          # same reason as its three siblings. The two timestamps it needs are
          # fetched here and nowhere else; a lookup that fails leaves them empty
          # and the decision holds, which costs a person one button press.
          PR_CREATED=""
          PR_HEAD_AT=""
          case "$KIND" in
            done_pr)
              if printf '%s' "${DETAIL:-}" | grep -qE '^[0-9]+$'; then
                # shellcheck disable=SC2016  # GraphQL variables, bound by -F.
                read -r PR_CREATED PR_HEAD_AT <<< "$(gh api graphql -f query='
                  query($owner:String!, $repo:String!, $number:Int!) {
                    repository(owner:$owner, name:$repo) {
                      pullRequest(number:$number) {
                        createdAt
                        commits(last:1) { nodes { commit { committedDate } } }
                      }
                    }
                  }' -F owner="${REPO%%/*}" -F repo="${REPO##*/}" -F number="$DETAIL" \
                  --jq '.data.repository.pullRequest
                        | "\(.createdAt // "") \(.commits.nodes[0].commit.committedDate // "")"' \
                  2>/dev/null || echo "")"
              fi ;;
          esac

          # `hold` when there is no bundle, and that is the safe direction
          # rather than a shrug: taking a pull request out of draft is what
          # makes it eligible for the unattended backstop, so a hand-over that
          # could not read its own decision code must not make that one.
          PROMOTE="hold the hand-over could not read promote-decision.sh"
          if [ -z "$MISSING" ]; then
            PROMOTE=$(bash "$TRUSTED/promote-decision.sh" \
                        "$KIND" "$PR_CREATED" "$PR_HEAD_AT" "${ATTADIPA_RUN_STARTED_AT:-}")
          fi

          case "$KIND" in
            done_pr|done_here)
              if [ "${PROMOTE%% *}" != "promote" ]; then
                echo "::notice::#${DETAIL:-?} stays a draft: ${PROMOTE#hold }"
              elif printf '%s' "${DETAIL:-}" | grep -qE '^[0-9]+$'; then
                gh pr ready "$DETAIL" --repo "$REPO" \
                  && echo "::notice::marked pull request #$DETAIL ready for review" \
                  || echo "::warning::could not mark #$DETAIL ready for review; it stays a draft and a person has to press the button"
              fi ;;
          esac

          case "$KIND" in
            done_pr|done_here|done_here_nopush|done_nopr)
              attadipa_label_edit "$TARGET" "$ISSUE" "$REPO" --add-label agent:review --remove-label agent:working || true ;;
            done_pr_cut|done_here_cut|degraded_pr)
              # `degraded_pr` sits here for the same reason `done_pr_cut` does:
              # there is something open to look at, and nothing about it is
              # finished enough to promote. It reaches this arm having skipped
              # `gh pr ready` above, so the draft stays a draft.
              #
              # agent:review only, and NOT agent:ready. The first version added
              # both -- a commit to read, and somebody to pick up the rest --
              # and review pointed out that the second label is inert on a pull
              # request and therefore a lie: .github/scripts/queue-scan.jq drops
              # every pull request before it reads a label, and labelling one
              # raises pull_request.labeled, which this workflow does not listen
              # for. Nothing would ever have come back for it, while the label
              # said something would. The comment says so in words instead --
              # words are the only thing that actually reaches a person here.
              attadipa_label_edit "$TARGET" "$ISSUE" "$REPO" --add-label agent:review --remove-label agent:working || true ;;
            *)
              # agent:failed AND back to agent:ready: the label pair says both
              # "this went wrong" and "somebody should pick it up", and the
              # watchdog only reads the second. A failed task that nothing
              # re-queues is a task nobody ever looks at again.
              attadipa_label_edit "$TARGET" "$ISSUE" "$REPO" --add-label agent:failed --add-label agent:ready --remove-label agent:working || true ;;
          esac

      - name: Release exclusive claim
        if: always() && steps.claim.outputs.acquired == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          ISSUE: ${{ needs.gate.outputs.issue }}
          CLAIM_HOLDER: agent-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          rc=0
          bash /tmp/claim.sh release "$REPO" "$ISSUE" "$CLAIM_HOLDER" || rc=$?
          bash /tmp/claim.sh release "$REPO" writer "$CLAIM_HOLDER" || rc=$?
          exit "$rc"
