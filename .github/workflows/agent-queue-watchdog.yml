name: Agent queue watchdog

# The event-driven path is the normal one. This exists for the times it does not
# fire: a GitHub Actions outage, an auth failure, a runner that died, a workflow
# that was disabled while a task arrived, or an issue opened during any of that.
#
# It is deliberately cheap. The scan is shell and the GitHub API; Claude is
# invoked only when there is something to do, and on a quiet repository this
# workflow costs a few seconds of a runner and nothing at all from Anthropic.
# A watchdog that wakes an agent every hour to be told there is no work is not a
# watchdog, it is a subscription.

on:
  schedule:
    # Hourly, a few minutes off the hour. Every scheduled workflow on GitHub
    # fires at :00 and queues behind everybody else's.
    - cron: "17 * * * *"
  workflow_dispatch:

concurrency:
  group: attadipa-agent-watchdog
  cancel-in-progress: false

permissions: {}

jobs:
  scan:
    name: Anything waiting
    runs-on: ubuntu-latest
    if: vars.CLAUDE_AUTOMATION_ENABLED != 'false'
    permissions:
      issues: read
      actions: write
      contents: read
    steps:
      # Pinned to the default branch, and sparse, for the same reason the intake
      # gate's checkout is: this job can dispatch a write-capable agent, so the
      # rules it applies come from `main` or from nowhere. A schedule event
      # already runs from the default branch, but saying so here means a future
      # trigger cannot quietly change that.
      - name: Fetch the scan filter from the default branch
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          sparse-checkout: .github/scripts
          sparse-checkout-cone-mode: false
          persist-credentials: false

      - name: Look for a stranded task
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          # An app is never OWNER, MEMBER or COLLABORATOR — issue #10 was filed
          # with a valid marker and author_association NONE, and this scan
          # skipped it while the intake gate refused it, so the task was
          # invisible to both halves at once. A producer the owner has named in
          # ATTADIPA_TRUSTED_PRODUCERS must be visible to the safety net too, or
          # the net has a hole exactly where the queue's input is.
          TRUSTED_PRODUCERS: ${{ vars.ATTADIPA_TRUSTED_PRODUCERS }}
        run: |
          set -euo pipefail

          # Everything open, with its labels and its author's association. One
          # request, and the whole decision is made locally.
          gh api "repos/$REPO/issues?state=open&per_page=100" --paginate > /tmp/open.json

          # A task is waiting if it is a real issue (not a pull request), it was
          # filed by somebody trusted, it carries a task marker or the
          # agent:ready label, and no state label says somebody already has it.
          # The filter lives in .github/scripts/queue-scan.jq so it can be run
          # against fixtures. See the header of that file for why.
          jq -r --arg trusted "${TRUSTED_PRODUCERS:-}" \
             -f .github/scripts/queue-scan.jq /tmp/open.json > /tmp/pick

          PICK=$(cat /tmp/pick)
          if [ -z "$PICK" ]; then
            echo "::notice::Queue is empty. Nothing to do, nothing spent."
            exit 0
          fi

          # One task per tick, highest priority first. The agent workflow's own
          # concurrency group means a second one would queue behind this anyway,
          # and dispatching several would only make the queue harder to read.
          echo "::notice::Handing issue #$PICK to the agent workflow."
          gh workflow run claude-agent.yml --repo "$REPO" -f "issue_number=$PICK"

  stuck:
    name: Anything stuck
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Unstick tasks whose agent never came back
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          # agent:working is a claim, and a claim with nobody behind it is worse
          # than no claim: the watchdog skips it forever and the task is lost in
          # plain sight. Two hours is comfortably longer than the 60-minute
          # timeout on the agent job, so anything older is genuinely orphaned.
          CUTOFF=$(date -u -d '2 hours ago' +%Y-%m-%dT%H:%M:%SZ)
          gh api "repos/$REPO/issues?state=open&labels=agent:working&per_page=100" --paginate \
            --jq ".[] | select(.updated_at < \"$CUTOFF\") | .number" > /tmp/stuck || true

          while read -r n; do
            [ -n "$n" ] || continue
            echo "::warning::Issue #$n has been agent:working since before $CUTOFF; returning it to the queue."
            gh issue comment "$n" --repo "$REPO" --body \
              "The agent that claimed this did not come back within two hours, so the task has been returned to the queue. If it was mid-flight, its branch is still there."
            gh issue edit "$n" --repo "$REPO" --remove-label agent:working --add-label agent:ready || true
          done < /tmp/stuck
