# --- The provisioning entry screen (ADR-0018, OD-26, #469) -----------------
#
# What a holder sets on the watch with a finger: the local clock, the MeshCore
# node's passkey, or -- under `EntryTask::All`, which is the only task a board
# constructs today -- both in that order, the clock's receipt being a waypoint
# rather than the end. The same six keys and the same strings serve all three.
# Nothing here is typed — every value is stepped — so there is no "that is not
# a date" to report and no digit keys to label. What is left to say is what is
# being set, what the six keys do to it, and what the board answered.
#
# The answer lines are the part that has to stay honest. A board's `Rejected`
# and its `Failed` describe two different watches: one changed nothing, the
# other may have moved part of what it was given and has no rollback behind
# it. They keep separate sentences for that reason and not for variety.

[provision_title_day]
en = "Day"
ru = "День"

[provision_title_month]
en = "Month"
ru = "Месяц"

[provision_title_year]
en = "Year"
ru = "Год"

[provision_title_hour]
en = "Hour"
ru = "Часы"

[provision_title_minute]
en = "Minute"
ru = "Минуты"

[provision_title_offset]
en = "Local offset"
ru = "Местный сдвиг"

[provision_title_review]
en = "Check it"
ru = "Проверьте"

[provision_title_receipt]
en = "Result"
ru = "Результат"

# The node (#411): shown only on a watch that is pinned to one, as the first
# eight hex digits of its key, so it can be held against the node's own
# screen. Forget takes the pin, and of the trust behind it only a bond the
# watch had already recorded as stale — a good pairing survives it, and the
# passkey survives it on purpose:
# `firmware/main/meshcore_node_forget.h:108` — "    // The passkey itself is deliberately retained. This marker is therefore"
# So the confirmation below promises neither of those two (#504), and what
# the radio answers afterwards is one of six things — the line names the one
# that happened rather than the first that started.
[provision_title_node]
en = "Node"
ru = "Узел"

[provision_title_forget]
en = "Forget this node?"
ru = "Забыть узел?"

[provision_title_passkey]
en = "Node passkey"
ru = "Код узла"

[provision_hint_date]
en = "the local date, not UTC"
ru = "местная дата, не UTC"

[provision_hint_time]
en = "the local time, not UTC"
ru = "местное время, не UTC"

[provision_hint_offset]
en = "local time minus UTC, in quarter hours"
ru = "местное время минус UTC, шаг 15 минут"

[provision_hint_review]
en = "Save writes the UTC line to the clock"
ru = "Сохранить запишет в часы строку UTC"

[provision_hint_node]
en = "Next goes on to the passkey"
ru = "Далее — к коду узла"

# Three clauses because the operation has three: the pin always goes, a
# pairing goes only where one was recorded stale, and what the owner has to do
# next is enter digits. The old line promised "its bond and its passkey,
# both", and `Unpinned` — the ordinary ending on a watch with no stale bond
# recorded — does neither of those (#504). Both locales carry the restriction:
# a Russian conjunction that only listed the pairing would contradict its own
# receipt, which on that ending says сопряжение сохранено.
#
# The third clause is an obligation and not a reassurance, and that is the
# deliberate part. "The passkey stays" is true of the value in NVS and false
# of anything the owner can do with it — the marker exists so those digits are
# never replayed, and a node that has been reset shows new ones after every
# power cycle:
# `docs/research/MESHCORE_NODE_RESET_RECOVERY.md:340` — "**Must be replaced, not erased:**"
# So the line says what the next screen says, one press earlier, instead of
# reassuring the owner out of the six digits they are about to need.
#
# Two wrapped lines is the budget, and it was measured rather than guessed:
# the 240 px panel draws a third line under the keys, which is where the
# Russian of the old line was already disappearing.
[provision_hint_forget]
en = "the node and only a stale pairing; then new digits"
ru = "узел и только устаревшее сопряжение; потом новый код"

[provision_hint_passkey]
en = "six digits from the node's own screen"
ru = "шесть цифр с экрана узла"

