# --- Navigation: where the other node is, from here ----------------------
#
# Added 2026-09-04 with the node navigation readout (#428). Eight statuses,
# and each is a different thing being wrong, so each gets its own entry
# rather than a shared "unavailable": the reader acts differently on "go
# outside" than on "the node has not said".
#
# The units carry the number's placeholder because Russian abbreviates them
# differently and a unit glued on in C++ is a string the catalogue cannot see.

# The screen's own title. The face draws it; it does not choose it, which is
# what keeps `ui/lvgl/` free of user-facing text.
