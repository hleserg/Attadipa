[mesh_answered]
en = "answered %s"
ru = "ответил %s"

# "MESSAGE" is what is arriving now; "LAST KNOWN" is the same three fields when
# the link is deliberately down. There is no age in `core::MeshStatus` to print,
# so the honest claim is not "3 minutes ago" -- it is that this is the last
# thing heard rather than the current state of a link that is off.
[mesh_message_heading]
en = "MESSAGE"
ru = "СООБЩЕНИЕ"

[mesh_message_last_known]
en = "LAST KNOWN"
ru = "ПОСЛЕДНЕЕ"

[mesh_no_message]
en = "no message"
ru = "нет сообщений"

[mesh_label_snr]
en = "SNR dB"
ru = "ОСШ дБ"

[mesh_label_peers]
en = "PEERS"
ru = "УЗЛЫ"

[mesh_label_mtu]
en = "MTU"
ru = "MTU"

# Delivery is the third field of the message block, and it reached the panel as
# `core::to_string(MeshDelivery)` -- the same defect as the transport phase, one
# line further down.
[mesh_delivery_none]
en = "not sent"
ru = "не отправлено"

[mesh_delivery_queued]
en = "queued"
ru = "в очереди"

[mesh_delivery_accepted]
en = "accepted"
ru = "принято"

[mesh_delivery_confirmed]
en = "delivered"
ru = "доставлено"

[mesh_delivery_failed]
en = "failed"
ru = "не доставлено"


