# --- The provisioning entry screen (ADR-0018, OD-26) -----------------------
#
# What a holder types into the watch with a finger: the clock, then the
# passkey the MeshCore node shows. Titles name the field; hints say what to
# type, and are replaced by the verdict on the last OK until the next key.
# The keypad's digits are digits and are not in the catalogue.

[provision_title_date]
en = "Date"
ru = "Дата"

[provision_title_time]
en = "Time, UTC"
ru = "Время, UTC"

[provision_title_offset]
en = "Local offset"
ru = "Местный сдвиг"

[provision_title_passkey]
en = "Node passkey"
ru = "Код узла"

[provision_title_done]
en = "Done"
ru = "Готово"

[provision_hint_date]
en = "year, month, day"
ru = "год, месяц, день"

[provision_hint_time]
en = "hours and minutes, in UTC"
ru = "часы и минуты по UTC"

[provision_hint_offset]
en = "local time minus UTC; ± flips it"
ru = "местное время минус UTC; ± меняет знак"

[provision_hint_passkey]
en = "six digits from the node; OK alone skips"
ru = "шесть цифр с узла; OK без цифр — пропустить"

# The node field (#411): shown only on a watch that is pinned to a node, as
# the first eight hex digits of its key, so it can be held against the node's
# own screen. OK keeps it; the erase key, relabelled Forget, drops it with its
# bond. What the radio answers is one of five things, and the hint names the
# one that happened rather than the first that started.
[provision_title_node]
en = "Node"
ru = "Узел"

[provision_hint_node]
en = "OK keeps it; Forget drops it"
ru = "OK оставит; Забыть сбросит"

[provision_key_forget]
en = "Forget"
ru = "Забыть"

[provision_node_pending]
en = "still forgetting the node"
ru = "узел ещё забывается"

# Also the passkey hint from then on: a reset node shows new digits, and the
# old six would fail with nothing on the screen to say why.
[provision_node_forgotten]
en = "forgotten; type its new digits"
ru = "узел забыт; введите цифры"

[provision_node_forgotten_ram]
en = "forgot till reboot; type digits"
ru = "забыт до рестарта; цифры"

[provision_node_kept]
en = "not forgotten; retry"
ru = "не забыт; повторите"

[provision_node_replay_inhibited]
en = "not forgotten; reboot scan is blocked"
ru = "не забыт; поиск после рестарта закрыт"

[provision_node_nothing]
en = "nothing to forget"
ru = "нечего забывать"

[provision_forgotten_skipped]
en = "no passkey; node is forgotten"
ru = "без кода; узел забыт"

[provision_rejected]
en = "not accepted — check it"
ru = "не принято — проверьте"

[provision_failed]
